<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!--
  regiontype 로드맵 에셋.

  색은 전부 CSS 변수다. 쓰는 쪽 style 에 rt-car 같은 변수를 주면
  그 인스턴스 하나만 색이 바뀐다.

  긴 그림자는 흐림이 없다. 실루엣을 오른쪽 아래로 조금씩 여러 번 밀어
  겹쳐 만든다. 쐐기를 따로 그리면 끝이 뾰족해져 레퍼런스와 어긋난다.
-->
<defs>
  <!-- ── 공통 조각 ─────────────────────────────────── -->
  <rect id="rt-blk-stop-sil" x="20" y="28" width="128" height="72" rx="11"/>
  <rect id="rt-blk-end-sil"  x="20" y="28" width="102" height="72" rx="11"/>

  <g id="rt-pin">
    <path d="M0 0c-4.7-7-7.2-10.2-7.2-14A7.2 7.2 0 1 1 7.2-14C7.2-10.2 4.7-7 0 0Z"
          fill="var(--rt-pin,#2b3033)"/>
    <circle cy="-14" r="2.8" fill="#fff"/>
  </g>

  <!-- 실루엣 (그림자용, 채움만) -->
  <path id="rt-stop-sil"
        d="M34 6H146Q166 6 166 26V44H170Q180 44 180 54Q180 64 170 64H166V82Q166 102 146 102H34
           Q14 102 14 82V64H10Q0 64 0 54Q0 44 10 44H14V26Q14 6 34 6Z"/>
  <path id="rt-end-sil"
        d="M34 6H120Q140 6 140 26V82Q140 102 120 102H34Q14 102 14 82V64H10Q0 64 0 54
           Q0 44 10 44H14V26Q14 6 34 6Z"/>
  <rect id="rt-depot-sil" x="8" y="8" width="46" height="46" rx="8"/>
  <rect id="rt-car-sil" x="2" y="3" width="24" height="46" rx="7"/>

  <!-- 긴 그림자 — 실루엣을 조금씩 밀어 겹친다 -->
  <g id="rt-sh-depot" fill="var(--rt-shadow,#8fa3a6)" opacity=".42">
    <use href="#rt-depot-sil" transform="translate(1.8 1.8)"/>
    <use href="#rt-depot-sil" transform="translate(3.6 3.6)"/>
    <use href="#rt-depot-sil" transform="translate(5.4 5.4)"/>
    <use href="#rt-depot-sil" transform="translate(7.2 7.2)"/>
    <use href="#rt-depot-sil" transform="translate(9.0 9.0)"/>
    <use href="#rt-depot-sil" transform="translate(10.8 10.8)"/>
    <use href="#rt-depot-sil" transform="translate(12.6 12.6)"/>
    <use href="#rt-depot-sil" transform="translate(14.4 14.4)"/>
    <use href="#rt-depot-sil" transform="translate(16.2 16.2)"/>
    <use href="#rt-depot-sil" transform="translate(18.0 18.0)"/>
    <use href="#rt-depot-sil" transform="translate(19.8 19.8)"/>
    <use href="#rt-depot-sil" transform="translate(21.6 21.6)"/>
  </g>
  <g id="rt-sh-car" fill="var(--rt-shadow,#8fa3a6)" opacity=".34">
    <use href="#rt-car-sil" transform="translate(1.2 1.2)"/>
    <use href="#rt-car-sil" transform="translate(2.4 2.4)"/>
    <use href="#rt-car-sil" transform="translate(3.6 3.6)"/>
    <use href="#rt-car-sil" transform="translate(4.8 4.8)"/>
    <use href="#rt-car-sil" transform="translate(6.0 6.0)"/>
    <use href="#rt-car-sil" transform="translate(7.2 7.2)"/>
    <use href="#rt-car-sil" transform="translate(8.4 8.4)"/>
    <use href="#rt-car-sil" transform="translate(9.6 9.6)"/>
  </g>

  <!-- ── 자동차 : 진행 방향은 위 ────────────────────── -->
  <symbol id="rt-car" viewBox="-2 -2 42 60">
    <use href="#rt-sh-car"/>
    <rect x="2" y="3" width="24" height="46" rx="7" fill="var(--rt-car,#e2695e)"/>
    <rect x="2" y="15" width="24" height="12" fill="#fff" opacity=".34"/>
    <rect x="2" y="3" width="24" height="8" rx="4" fill="#fff" opacity=".2"/>
  </symbol>

  <!-- ── 차고지 : 코스가 시작되는 곳 ────────────────── -->
  <symbol id="rt-depot" viewBox="-2 -2 84 82">
    <use href="#rt-sh-depot"/>
    <rect x="8" y="8" width="46" height="46" rx="8" fill="var(--rt-depot-base,#d98b3a)"/>
    <path d="M16 8h30a8 8 0 0 1 8 8v16H8V16a8 8 0 0 1 8-8Z" fill="var(--rt-depot,#f2c94c)"/>
    <rect x="8" y="32" width="46" height="4" fill="#000" opacity=".1"/>
  </symbol>

  <!-- ── 경유지 : 좌우로 길이 지나고 큰집 하나 ───────── -->
  <symbol id="rt-stop" viewBox="-2 -2 192 144">
    <use href="#rt-stop-sil" fill="var(--rt-road,#fff)"
         stroke="var(--rt-edge,#a9b9bc)" stroke-width="3.5" stroke-linejoin="round"/>
    <g fill="var(--rt-shadow,#8fa3a6)" opacity=".42">
      <use href="#rt-blk-stop-sil" transform="translate(3 3)"/>
      <use href="#rt-blk-stop-sil" transform="translate(6 6)"/>
      <use href="#rt-blk-stop-sil" transform="translate(9 9)"/>
      <use href="#rt-blk-stop-sil" transform="translate(12 12)"/>
      <use href="#rt-blk-stop-sil" transform="translate(15 15)"/>
      <use href="#rt-blk-stop-sil" transform="translate(18 18)"/>
      <use href="#rt-blk-stop-sil" transform="translate(21 21)"/>
      <use href="#rt-blk-stop-sil" transform="translate(24 24)"/>
      <use href="#rt-blk-stop-sil" transform="translate(27 27)"/>
      <use href="#rt-blk-stop-sil" transform="translate(30 30)"/>
      <use href="#rt-blk-stop-sil" transform="translate(33 33)"/>
      <use href="#rt-blk-stop-sil" transform="translate(36 36)"/>
    </g>
    <rect x="20" y="28" width="128" height="72" rx="11" fill="var(--rt-base,#e08b3d)"/>
    <rect x="23" y="23" width="128" height="72" rx="11" fill="var(--rt-wall,#c85a4e)"/>
    <rect x="26" y="18" width="128" height="72" rx="11" fill="var(--rt-roof,#f6cf5b)"/>
    <path d="M154 26v11l-14-14h7a7 7 0 0 1 7 7Z" fill="#000" opacity=".15"/>
  </symbol>

  <!-- ── 종점 : 길이 한쪽에만 붙은 막다른 큰집 ───────── -->
  <symbol id="rt-end" viewBox="-2 -2 166 144">
    <use href="#rt-end-sil" fill="var(--rt-road,#fff)"
         stroke="var(--rt-edge,#a9b9bc)" stroke-width="3.5" stroke-linejoin="round"/>
    <g fill="var(--rt-shadow,#8fa3a6)" opacity=".42">
      <use href="#rt-blk-end-sil" transform="translate(3 3)"/>
      <use href="#rt-blk-end-sil" transform="translate(6 6)"/>
      <use href="#rt-blk-end-sil" transform="translate(9 9)"/>
      <use href="#rt-blk-end-sil" transform="translate(12 12)"/>
      <use href="#rt-blk-end-sil" transform="translate(15 15)"/>
      <use href="#rt-blk-end-sil" transform="translate(18 18)"/>
      <use href="#rt-blk-end-sil" transform="translate(21 21)"/>
      <use href="#rt-blk-end-sil" transform="translate(24 24)"/>
      <use href="#rt-blk-end-sil" transform="translate(27 27)"/>
      <use href="#rt-blk-end-sil" transform="translate(30 30)"/>
      <use href="#rt-blk-end-sil" transform="translate(33 33)"/>
      <use href="#rt-blk-end-sil" transform="translate(36 36)"/>
    </g>
    <rect x="20" y="28" width="102" height="72" rx="11" fill="var(--rt-base,#e08b3d)"/>
    <rect x="23" y="23" width="102" height="72" rx="11" fill="var(--rt-wall,#c85a4e)"/>
    <rect x="26" y="18" width="102" height="72" rx="11" fill="var(--rt-roof,#f6cf5b)"/>
    <path d="M128 26v11l-14-14h7a7 7 0 0 1 7 7Z" fill="#000" opacity=".15"/>
    <use href="#rt-pin" x="46" y="44"/>
  </symbol>
</defs>
</svg>
