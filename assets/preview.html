<!doctype html>
<meta charset="utf-8">
<title>regiontype — 보드 에셋</title>
<style>
  body{margin:0;padding:48px 56px;background:#f7f2e4;
       font:500 15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#3c464a}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
  p.sub{color:#8b8372;margin:0 0 36px}
  h2{font-size:17px;font-weight:800;margin:34px 0 12px}
  .row{display:flex;align-items:flex-end;gap:44px;flex-wrap:wrap}
  .cell{text-align:center}
  .cell b{display:block;font-size:13px;font-weight:600;color:#8b8372;margin-top:10px}
  svg.a{overflow:visible}
  .road{background:#fff;border:3px solid #a9b9bc;border-radius:30px;height:44px;
        display:flex;align-items:center;gap:26px;padding:0 22px;width:max-content}
</style>

<h1>보드 에셋</h1>
<p class="sub">색은 전부 CSS 변수다. 쓰는 쪽에서 덮으면 그 하나만 바뀐다.</p>

<h2>자동차 — 색 커스텀</h2>
<div class="row">
  <div class="cell"><svg class="a" width="26" height="38"><use href="board.svg#rt-car"/></svg><b>기본</b></div>
  <div class="cell"><svg class="a" width="26" height="38" style="--rt-car:#efa14a"><use href="board.svg#rt-car"/></svg><b>--rt-car</b></div>
  <div class="cell"><svg class="a" width="26" height="38" style="--rt-car:#7cc17a"><use href="board.svg#rt-car"/></svg><b>초록</b></div>
  <div class="cell"><svg class="a" width="26" height="38" style="--rt-car:#5fb0c9"><use href="board.svg#rt-car"/></svg><b>파랑</b></div>
  <div class="cell"><svg class="a" width="26" height="38" style="--rt-car:#7d8fd6"><use href="board.svg#rt-car"/></svg><b>보라</b></div>
  <div class="cell"><svg class="a" width="26" height="38" style="--rt-car:#2b3033"><use href="board.svg#rt-car"/></svg><b>검정</b></div>
</div>

<h2>차고지 — 코스가 시작되는 곳</h2>
<div class="row">
  <div class="cell"><svg class="a" width="76" height="66"><use href="board.svg#rt-depot"/></svg><b>기본</b></div>
  <div class="cell"><svg class="a" width="76" height="66" style="--rt-depot:#9fd0e2;--rt-depot-base:#5fb0c9"><use href="board.svg#rt-depot"/></svg><b>파랑</b></div>
  <div class="cell"><svg class="a" width="76" height="66" style="--rt-depot:#a8dba6;--rt-depot-base:#7cc17a"><use href="board.svg#rt-depot"/></svg><b>초록</b></div>
</div>

<h2>경유지 — 좌우로 길이 지나고 큰집 하나</h2>
<div class="row">
  <div class="cell"><svg class="a" width="240" height="150"><use href="board.svg#rt-stop"/></svg><b>기본</b></div>
  <div class="cell"><svg class="a" width="240" height="150" style="--rt-roof:#9fd0e2;--rt-wall:#5fb0c9;--rt-base:#3f8ba4"><use href="board.svg#rt-stop"/></svg><b>집 색 변경</b></div>
</div>

<h2>종점 — 길이 한쪽에만 붙은 막다른 큰집</h2>
<div class="row">
  <div class="cell"><svg class="a" width="200" height="156"><use href="board.svg#rt-end"/></svg><b>기본</b></div>
  <div class="cell"><svg class="a" width="200" height="156" style="--rt-roof:#a8dba6;--rt-wall:#7cc17a;--rt-base:#4f9b6a"><use href="board.svg#rt-end"/></svg><b>집 색 변경</b></div>
</div>

<h2>이어 붙이면</h2>
<p class="sub" style="margin:-6px 0 18px">
  길과 부지를 하나의 합집합 외곽선으로 그린다. 같은 path 를 굵게 그은 뒤
  그 위에 채우면 안쪽 선이 덮여 바깥 윤곽만 남는다.
</p>
<svg class="a chain" viewBox="0 0 1460 500" width="100%" style="max-width:1180px">
  <!-- 길 + 부지 두 곳. 아래 두 path 는 같은 d 를 쓴다 -->
  <defs>
    <path id="chain-sil"
      d="M110 336h1350a16 16 0 0 1 16 16v26a16 16 0 0 1-16 16H110a16 16 0 0 1-16-16v-26a16 16 0 0 1 16-16Z
         M520 160h280a20 20 0 0 1 20 20v198a16 16 0 0 1-16 16H516a16 16 0 0 1-16-16V180a20 20 0 0 1 20-20Z
         M1170 160h110a20 20 0 0 1 20 20v198a16 16 0 0 1-16 16h-134a16 16 0 0 1-16-16V180a20 20 0 0 1 20-20Z"/>
  </defs>

  <!-- 긴 그림자 -->
  <g fill="#9aabad" opacity=".55">
    <use href="#chain-sil" transform="translate(6 6)"/>
    <use href="#chain-sil" transform="translate(12 12)"/>
    <use href="#chain-sil" transform="translate(18 18)"/>
    <use href="#chain-sil" transform="translate(24 24)"/>
    <use href="#chain-sil" transform="translate(30 30)"/>
    <use href="#chain-sil" transform="translate(36 36)"/>
  </g>

  <!-- 외곽선: 굵게 긋고 그 위를 채워 안쪽 선을 덮는다 -->
  <use href="#chain-sil" fill="none" stroke="#a9b9bc" stroke-width="9" stroke-linejoin="round"/>
  <use href="#chain-sil" fill="#fff"/>

  <!-- 부지 위 -->
  <g fill="#9aabad" opacity=".5">
    <rect x="536" y="194" width="120" height="120" rx="18" transform="translate(12 12)"/>
    <rect x="536" y="194" width="120" height="120" rx="18" transform="translate(24 24)"/>
    <rect x="536" y="194" width="120" height="120" rx="18" transform="translate(36 36)"/>
    <rect x="536" y="194" width="120" height="120" rx="18" transform="translate(48 48)"/>
    <rect x="1186" y="194" width="120" height="120" rx="18" transform="translate(12 12)"/>
    <rect x="1186" y="194" width="120" height="120" rx="18" transform="translate(24 24)"/>
    <rect x="1186" y="194" width="120" height="120" rx="18" transform="translate(36 36)"/>
    <rect x="1186" y="194" width="120" height="120" rx="18" transform="translate(48 48)"/>
  </g>
  <use href="board.svg#rt-hatch" transform="translate(556 372) scale(1.5)"/>
  <rect x="680" y="182" width="120" height="120" rx="12" fill="none"
        stroke="#a9b9bc" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round" opacity=".8"/>
  <use href="board.svg#rt-house" transform="translate(524 182) scale(3)"/>
  <use href="board.svg#rt-pin" transform="translate(566 226) scale(1.7)"/>

  <use href="board.svg#rt-hatch" transform="translate(1188 372) scale(1.5)"/>
  <use href="board.svg#rt-house" transform="translate(1174 182) scale(3)"/>
  <use href="board.svg#rt-pin" transform="translate(1216 226) scale(1.7)"/>

  <!-- 차고지가 길의 왼쪽 끝을 막는다 -->
  <use href="board.svg#rt-depot" x="72" y="306" width="128" height="126"/>

  <!-- 길 위의 차 -->
  <use href="board.svg#rt-car" x="0" y="0" width="34" height="48"
       transform="translate(348 342) rotate(90)" style="--rt-car:#efa14a"/>
  <use href="board.svg#rt-car" x="0" y="0" width="34" height="48"
       transform="translate(1008 342) rotate(90)" style="--rt-car:#5fb0c9"/>
</svg>
