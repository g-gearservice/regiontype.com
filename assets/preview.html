<!doctype html>
<meta charset="utf-8">
<title>regiontype — 보드 에셋</title>
<link rel="stylesheet" href="palette.css">
<style>
  body{margin:0;padding:44px 52px 80px;background:#f7f2e4;
       font:500 15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#3c464a}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
  h2{font-size:17px;font-weight:800;margin:38px 0 14px}
  p.sub{color:#8b8372;margin:0 0 8px;max-width:70ch}
  svg{overflow:visible}
  table{border-collapse:separate;max-width:100%;border-spacing:11px 8px}
  th{font-size:12px;font-weight:700;color:#8b8372;text-transform:uppercase;letter-spacing:.06em}
  td{text-align:center;vertical-align:bottom}
  th.side{text-align:right;white-space:nowrap;text-transform:none;font-size:13px;letter-spacing:0}
  .swatch{width:26px;height:26px;border-radius:7px;margin:0 auto 4px}
</style>

<h1>보드 에셋</h1>
<p class="sub">
  색은 CSS 변수다. 요소에 <b>c-이름</b> 클래스를 붙이면 그 계열로 칠해진다.
  톤은 <code>tools/build_palette.py</code> 가 기준색 하나에서 계산한다 —
  손으로 고르면 계열끼리 어긋난다.
</p>

<table id="grid"></table>

<h2>이어 붙이면</h2>
<p class="sub" style="margin-bottom:16px">
  길과 부지를 하나의 합집합 외곽선으로 그린다. 같은 path 를 굵게 그은 뒤
  그 위에 채우면 안쪽 선이 덮여 바깥 윤곽만 남는다.
</p>
<svg class="chain" viewBox="0 0 1460 500" width="100%" style="max-width:1180px">
  <defs>
    <path id="chain-sil"
      d="M110 336h1350a16 16 0 0 1 16 16v26a16 16 0 0 1-16 16H110a16 16 0 0 1-16-16v-26a16 16 0 0 1 16-16Z
         M520 160h280a20 20 0 0 1 20 20v198a16 16 0 0 1-16 16H516a16 16 0 0 1-16-16V180a20 20 0 0 1 20-20Z
         M1170 160h110a20 20 0 0 1 20 20v198a16 16 0 0 1-16 16h-134a16 16 0 0 1-16-16V180a20 20 0 0 1 20-20Z"/>
  </defs>
  <use href="#chain-sil" fill="none" stroke="#a9b9bc" stroke-width="9" stroke-linejoin="round"/>
  <use href="#chain-sil" fill="#fff"/>

  <use href="board.svg#rt-hatch" transform="translate(556 372) scale(1.5)"/>
  <rect x="680" y="182" width="120" height="120" rx="12" fill="none"
        stroke="#a9b9bc" stroke-width="4" stroke-dasharray="12 10" stroke-linecap="round" opacity=".8"/>
  <use class="c-yellow" href="board.svg#rt-house" transform="translate(524 182) scale(3)"/>
  <use href="board.svg#rt-pin" transform="translate(566 226) scale(1.7)"/>

  <use href="board.svg#rt-hatch" transform="translate(1188 372) scale(1.5)"/>
  <use class="c-teal" href="board.svg#rt-house" transform="translate(1174 182) scale(3)"/>
  <use href="board.svg#rt-pin" transform="translate(1216 226) scale(1.7)"/>

  <use class="c-orange" href="board.svg#rt-depot" x="72" y="306" width="128" height="126"/>
  <use class="c-yellow" href="board.svg#rt-car" x="0" y="0" width="34" height="48"
       transform="translate(348 342) rotate(90)"/>
  <use class="c-teal" href="board.svg#rt-car" x="0" y="0" width="34" height="48"
       transform="translate(1008 342) rotate(90)"/>
</svg>

<script>
const COLORS = ['red','orange','yellow','green','teal','blue','purple','pink','slate'];
const ROWS = [
  ['자동차',  '#rt-car',   28,  40],
  ['차고지',  '#rt-depot', 54,  52],
  ['경유지',  '#rt-stop',  118, 72],
  ['종점',    '#rt-end',    92, 72],
];
const t = document.getElementById('grid');
t.insertAdjacentHTML('beforeend',
  '<tr><th></th>' + COLORS.map(c =>
    `<th><div class="swatch c-${c}" style="background:var(--rt-wall)"></div>${c}</th>`).join('') + '</tr>');
for (const [label, id, w, h] of ROWS) {
  t.insertAdjacentHTML('beforeend',
    `<tr><th class="side">${label}</th>` + COLORS.map(c =>
      `<td><svg class="c-${c}" width="${w}" height="${h}"><use href="board.svg${id}"/></svg></td>`
    ).join('') + '</tr>');
}
</script>
