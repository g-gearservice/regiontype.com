<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif" font-weight="800" text-anchor="middle">
  <!-- 경쟁전: 시작하기를 꾹 누르면 알약이 빨갛게 차오르고 '경쟁전 시작'으로 바뀐다 -->
  <defs>
    <linearGradient id="fill" x1="0" x2="1">
      <stop offset="0" stop-color="#c8322a"/><stop offset=".62" stop-color="#c8322a"/>
      <stop offset=".62" stop-color="#f0a03c"/><stop offset="1" stop-color="#f0a03c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="240" rx="18" fill="#e8edf0"/>
  <!-- 1. 누르는 중 -->
  <rect x="40" y="86" width="220" height="68" rx="34" fill="#e7eef1" stroke="#dae2e7" stroke-width="2"/>
  <rect x="80" y="96" width="140" height="48" rx="24" fill="url(#fill)"/>
  <path d="M142 112l14 8-14 8z" fill="#232c31"/>
  <path d="M168 138l0 44 11-10 9 21 9-4-9-20 15-1z" fill="#3c464a" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <!-- 누르는 시간 -->
  <circle cx="232" cy="64" r="22" fill="none" stroke="#dae2e7" stroke-width="6"/>
  <path d="M232 42a22 22 0 1 1-19 33" fill="none" stroke="#c8322a" stroke-width="6" stroke-linecap="round"/>
  <text x="232" y="69" font-size="13" fill="#3c464a">0.6s</text>
  <!-- 화살표 -->
  <path d="M290 120h52" stroke="#5b676e" stroke-width="5" stroke-linecap="round"/>
  <path d="M334 108l14 12-14 12" fill="none" stroke="#5b676e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 2. 켜짐: 빨간 알약, 트로피 표시 -->
  <rect x="380" y="86" width="220" height="68" rx="34" fill="#e7eef1" stroke="#dae2e7" stroke-width="2"/>
  <rect x="420" y="96" width="140" height="48" rx="24" fill="#c8322a"/>
  <g fill="#fff">
    <path d="M476 108h28v8a14 14 0 0 1-28 0z"/>
    <path d="M486 128h8v6h6v4h-20v-4h6z"/>
  </g>
  <path d="M476 110h-6a6 6 0 0 0 6 8M504 110h6a6 6 0 0 1-6 8" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="490" y="190" font-size="20" fill="#c8322a">120s · LP</text>
</svg>
