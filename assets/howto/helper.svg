  <rect x="345" y="140" width="7" height="12" rx="3.5" fill="#fff"/><rect x="364" y="140" width="7" height="12" rx="3.5" fill="#fff"/>
  <path d="M378 160l0 36 9-8 7 17 7-3-7-16 12-1z" fill="#3c464a" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <rect x="408" y="52" width="180" height="52" rx="14" fill="#c8322a"/>
  <path d="M420 104l-14 18 30-18z" fill="#c8322a"/>
  <g fill="#fff"><circle cx="470" cy="78" r="5"/><circle cx="498" cy="78" r="5"/><circle cx="526" cy="78" r="5"/></g>
