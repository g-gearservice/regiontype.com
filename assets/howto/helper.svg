  <rect x="20" y="20" width="600" height="180" rx="12" fill="none" stroke="#dae2e7" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- 자는 봇 (왼쪽 아래 귀퉁이) -->
  <rect x="48" y="130" width="52" height="46" rx="20" fill="#c8322a"/>
  <path d="M62 152q5 4 10 0M78 152q5 4 10 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="112" y="130" font-size="18" fill="#5b676e">z</text><text x="124" y="116" font-size="13" fill="#5b676e">z</text>
  <!-- 화살표 -->
  <path d="M200 150h70" stroke="#5b676e" stroke-width="5" stroke-linecap="round"/>
  <path d="M262 138l14 12-14 12" fill="none" stroke="#5b676e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 깬 봇 + 커서 + 말풍선 -->
