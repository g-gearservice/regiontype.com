<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="system-ui,-apple-system,sans-serif" font-weight="800" text-anchor="middle">
  <!-- 도우미 봇: 귀퉁이에서 자다가(z) 가리키거나 누르면 깬다 -->
