<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>regiontype</title>
<!-- 설정 화면은 이제 홈 위에 뜨는 덮개다(index.html + settings.js). 이 자리는
     해시만 홈으로 넘기는 착지대다. /settings/#security 같은 옛 주소가 그대로
     살아 있게 하려고 둔다. -->
<meta name="robots" content="noindex">
<script>
  /* replace 로 넘긴다 — 뒤로 가기가 이 자리로 되돌아오면 안 된다 */
  location.replace('../' + (location.hash || '#settings'));
</script>
</head>
<body></body>
</html>
