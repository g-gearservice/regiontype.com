<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>regiontype · 30s promo</title>
<!-- 30초 세로 홍보 영상의 원본. 그냥 열면 미리 보기(Space 재생, ←/→ 한 프레임, R 처음부터),
     ?render 로 열면 render.mjs 가 프레임을 한 장씩 찍는다. 저장소 뿌리에서 python3 -m http.server 로 띄운다 -->
<style>
  :root{--accent:#f0a03c;--block:#6f9a9e}
  html,body{margin:0;background:#1d2326;overflow:hidden}
  #stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden}
  #stage canvas{position:absolute;inset:0}
  #bot{position:absolute;left:0;top:0;width:720px;height:720px;transform-origin:50% 50%;opacity:0}
  #bot .buddy{display:block;width:100%;height:100%;overflow:visible}
  #ui{position:fixed;left:12px;bottom:12px;font:600 13px system-ui;color:#cfd8dc}
  body.render #ui{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="under" width="1080" height="1920"></canvas>
  <div id="bot"></div>
  <canvas id="over" width="1080" height="1920"></canvas>
</div>
<div id="ui">Space 재생 · ←/→ 프레임 · R 처음부터 · <span id="tc">0.00</span>s</div>
<audio id="audio" src="out/audio.wav" preload="auto"></audio>
<script type="module">
  const render = new URLSearchParams(location.search).has('render');
  if (render) document.body.classList.add('render');
  const { seek } = await import('./scene.js');
  const { FPS, DUR } = await import('./timeline.js');
  window.seek = seek;
  if (!render) {
    const st = document.getElementById('stage'), tc = document.getElementById('tc'), au = document.getElementById('audio');
    const fit = () => { const k = Math.min(innerWidth / 1080, innerHeight / 1920); st.style.transform = `translate(${(innerWidth - 1080 * k) / 2}px,0) scale(${k})`; };
    addEventListener('resize', fit); fit();
    /* 봇의 시계는 앞으로만 간다 — 되감기는 처음부터 다시 돌려 그 자리까지 간다.
       rAF·performance.now 는 봇의 가짜 시계가 쥐고 있어 재생은 setTimeout·Date.now 로 잰다 */
    let t = 0, playing = false, wall = 0;
    const go = to => {
      if (to < t - 1e-6) { location.search = '?t=' + to.toFixed(3); return; }
      for (; t + 1 / FPS <= to; t += 1 / FPS) seek(t);
      t = to; seek(t); tc.textContent = t.toFixed(2);
    };
    go(+(new URLSearchParams(location.search).get('t') || 0));
    const tick = () => {
      if (!playing) return;
      const to = Math.min(DUR - 1 / FPS, (Date.now() - wall) / 1000);
      go(to);
      if (to >= DUR - 1 / FPS) { playing = false; au.pause(); } else setTimeout(tick, 1000 / FPS);
    };
    addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault(); playing = !playing;
        if (playing) { wall = Date.now() - t * 1000; au.currentTime = t; au.play().catch(() => {}); tick(); } else au.pause();
      }
      if (e.code === 'ArrowRight') go(t + 1 / FPS);
      if (e.code === 'ArrowLeft') go(Math.max(0, t - 1 / FPS));
      if (e.code === 'KeyR') location.search = '';
    });
  }
  window.__ready = true;
</script>
</body>
</html>
