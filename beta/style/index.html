<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스타일 · regiontype beta</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../favicon/favicon.svg">
<!-- 홈의 비트맵 말(색 토큰)을 그대로 입는다 — 옮겨 적지 않는다 -->
<link rel="stylesheet" href="../../style.css?v=4.42">
<style>
/* 홈처럼 한 장의 격자 판. 로고 하나가 루트로 들어가는 문이고, 그 아래 칸마다 우리가 만든
   스타일 하나가 대표 기호로 선다 */
body{--deco-cw:min(152px,calc(100vw / 3));--deco-ch:var(--deco-cw);overflow:auto;min-height:100%;
  background:
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/var(--deco-cw) var(--deco-ch),
    linear-gradient(0deg,var(--grid) 1px,transparent 1px) 0 0/var(--deco-cw) var(--deco-ch),
    var(--bg)}
.wall{position:relative;height:calc(var(--deco-ch) * 4)}
/* 로고 — 홈 넵바 로고와 같은 꼴(굵은 region · 가는 type · 주황 점) */
.home{position:absolute;left:var(--deco-cw);top:var(--deco-ch);height:var(--deco-ch);display:flex;align-items:center;
  font-size:min(56px,calc(var(--deco-cw) * .37));font-weight:800;letter-spacing:-.03em;color:var(--ink);text-decoration:none;border-radius:12px}
.home span{font-weight:400}
.home i{display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--accent);margin:0 0 .9em .04em}
.home:hover{color:var(--accent-text)}
.home:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
/* 기호 칸. 둥근 판 없이 격자 한 칸에 그 스타일의 대표 기호 하나만 선다 — 3D 내비게이션은 정육각형,
   동네버스는 정류장 도넛(검은 속 · 흰 테). 이름은 aria-label 과 title 로 붙는다 */
.cell{position:absolute;left:calc(var(--deco-cw) * var(--btn-col));top:calc(var(--deco-ch) * var(--btn-row));
  width:var(--deco-cw);height:var(--deco-ch);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.cell svg{width:46%;height:46%;overflow:visible;transition:transform var(--fast) var(--ease-out)}
.cell:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
@media (hover:hover) and (pointer:fine){ .cell:hover svg{transform:scale(1.12)} }
@media (prefers-reduced-motion:reduce){.cell svg{transition:none}}
</style>
</head>
<body>
<main class="wall">
  <a class="home" href="../../" aria-label="regiontype 홈">region<span>type</span><i aria-hidden="true"></i></a>
  <nav aria-label="스타일">
    <a class="cell" href="../3dnavigation/" style="--btn-col:1;--btn-row:2" aria-label="3D 내비게이션" title="3D 내비게이션">
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4L89.84 27V73L50 96L10.16 73V27Z" fill="currentColor"/></svg></a>
    <a class="cell" href="../bus/" style="--btn-col:2;--btn-row:2" aria-label="동네버스" title="동네버스">
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" fill="#000" stroke="#fff" stroke-width="20"/></svg></a>
  </nav>
</main>
<script>
/* 사이트 야간(rt.opt.night)을 따른다 — 홈과 같은 갈림 */
try{document.documentElement.toggleAttribute('data-night',!!JSON.parse(localStorage.getItem('rt.opt')||'{}').night)}catch(e){}
</script>
</body>
</html>
