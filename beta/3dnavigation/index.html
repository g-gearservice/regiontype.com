<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 내비게이션 · regiontype beta</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../favicon/favicon.svg">
<!-- 실제 지도. 바탕·3D 건물은 OpenFreeMap(OSM render_height), 길은 OSRM, 동 경계는
     tools/build_drive.py 가 찍은 data/*-dong.drive.json 이다 -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* ── 토큰 ─────────────────────────────────────────────────────────────
   베타는 사이트의 비트맵 말을 따르지 않고 Apple 지도의 말을 따른다. 세 층이다.
   1) sys-*  Apple 시스템 색(iOS HIG). 2) 뜻 토큰(label·fill·mat…) — 화면은 이것만 쓴다.
   3) map-*  지도 칠. JS 의 paint() 가 getComputedStyle 로 읽어 MapLibre 에 넣는다 —
      MapLibre 는 color-mix·var() 를 못 읽으니 map-* 는 hex/rgba 날값만 둔다.
   새 지도 결(위성·야간 운전 따위)은 :root[data-map=…] 에서 map-* 만 덮어쓰면 된다. */
:root{
  --sys-blue:#007aff; --sys-green:#34c759; --sys-red:#ff3b30; --sys-gray:#8e8e93;
  --brand:#f0a03c;                                   /* 로고 점 하나만 사이트 색을 남긴다 */

  --label:#1c1c1e; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.32);
  --fill:rgba(120,120,128,.14); --fill-2:rgba(120,120,128,.08); --sep:rgba(60,60,67,.16);
  --elev:#fff; --on-tint:#fff;
  --tint:var(--sys-blue); --go:var(--sys-green); --stop:var(--sys-red);
  --mat:rgba(250,250,250,.72); --mat-thick:rgba(250,250,250,.88);
  --mat-nav:rgba(28,28,30,.9); --nav-label:#fff; --nav-label-2:rgba(235,235,245,.62);
  --blur:blur(30px) saturate(190%);
  --edge:0 0 0 .5px rgba(0,0,0,.1);                  /* 머리카락 테두리 — 재질 가장자리 */
  --shadow-sm:var(--edge),0 2px 8px rgba(0,0,0,.12);
  --shadow-lg:var(--edge),0 10px 30px rgba(0,0,0,.16);

  --r-sheet:22px; --r-card:14px; --r-ctl:12px; --gap:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard",system-ui,"Malgun Gothic",sans-serif;
  --fast:.18s; --ease:cubic-bezier(.32,.72,0,1);     /* iOS 시트 곡선 — 감쇠 1.0 스프링 근사 */

  /* 지도 — Apple 지도 밝은 결 */
  --map-land:#f7f5f0; --map-water:#9fd0f2; --map-park:#d3ecc4;
  --map-road:#ffffff; --map-road-case:#e2ddd4; --map-hwy:#fde293; --map-hwy-case:#e9be5c;
  --map-bldg-lo:#ebe8e2; --map-bldg-hi:#d6d2ca;
  --map-label:#3a3a3c; --map-label-2:#6e6e73; --map-halo:#ffffff;
  --map-route:#1a7cff; --map-route-case:#0a56c2; --map-route-alt:#a9c9f5; --map-route-alt-case:#7ea7e0;
  --map-area:rgba(142,142,147,.10); --map-area-line:rgba(60,60,67,.42);
  --map-own:rgba(52,199,89,.24); --map-own-line:#248a3d; --map-own-halo:#e3f6e8;
  --map-tgt:rgba(0,122,255,.16); --map-tgt-line:#007aff;
}
/* 사이트 야간(rt.opt.night)을 따른다 — 홈과 같은 갈림 */
:root[data-night]{
  --sys-blue:#0a84ff; --sys-green:#30d158; --sys-red:#ff453a;
  --label:#f2f2f7; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.3);
  --fill:rgba(120,120,128,.32); --fill-2:rgba(120,120,128,.2); --sep:rgba(84,84,88,.6);
  --elev:#2c2c2e; --mat:rgba(30,30,32,.72); --mat-thick:rgba(30,30,32,.88);
  --edge:0 0 0 .5px rgba(255,255,255,.12);
  --map-land:#26272a; --map-water:#172a3e; --map-park:#20382a;
  --map-road:#46474c; --map-road-case:#303135; --map-hwy:#6b5b36; --map-hwy-case:#4b4027;
  --map-bldg-lo:#333438; --map-bldg-hi:#48494e;
  --map-label:#e5e5ea; --map-label-2:#a1a1a6; --map-halo:#1c1c1e;
  --map-route:#0a84ff; --map-route-case:#0060df; --map-route-alt:#3d5f8c; --map-route-alt-case:#2a4466;
  --map-area:rgba(142,142,147,.12); --map-area-line:rgba(235,235,245,.4);
  --map-own:rgba(48,209,88,.24); --map-own-line:#30d158; --map-own-halo:#1d3a26;
  --map-tgt:rgba(10,132,255,.22); --map-tgt-line:#0a84ff;
  color-scheme:dark;
}
@media (prefers-reduced-transparency:reduce){:root,:root[data-night]{--mat:var(--elev);--mat-thick:var(--elev);--blur:none}}
@media (prefers-contrast:more){:root,:root[data-night]{--mat:var(--elev);--mat-thick:var(--elev);--blur:none;--edge:0 0 0 1.5px var(--label)}}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--map-land);color:var(--label);
  font:400 15px/1.35 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
button:active:not(:disabled){transform:scale(.97)}
button{transition:transform 100ms ease-out,background var(--fast) var(--ease)}
a{white-space:nowrap}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
#map{position:fixed;inset:0}
.glass{background:var(--mat);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-lg)}
kbd{font:inherit;font-size:.78em;font-weight:600;background:var(--fill);border-radius:5px;padding:1px 5px}
.maplibregl-ctrl-attrib{display:none}

/* ── 사이트 넵바: 지도 위 재질 알약 ── */
.nav-top{position:fixed;left:50%;top:var(--gap);transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:2px;
  padding:4px 6px;border-radius:999px;box-shadow:var(--shadow-sm)}
.nav-top a{color:var(--label);text-decoration:none;font-weight:600;font-size:15px;padding:8px 12px;border-radius:999px}
.nav-top a:hover{background:var(--fill-2)}
.logo{font-size:20px!important;font-weight:700!important;letter-spacing:-.02em;padding:4px 10px!important}
.logo span{font-weight:400}
.logo i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);vertical-align:top;margin-top:4px}
.beta{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--fill);color:var(--label-2)}

/* ── 홈: Apple 지도 길찾기 카드(맥·아이패드는 왼쪽 떠 있는 카드, 폰은 아래 시트) ── */
.panel{position:fixed;left:var(--gap);top:68px;bottom:var(--gap);width:360px;border-radius:var(--r-sheet);display:flex;flex-direction:column;z-index:3;overflow:hidden;background:var(--mat-thick)}
.panel-head{display:flex;align-items:center;gap:10px;padding:18px 16px 2px}
.round{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--label-2);display:flex;align-items:center;justify-content:center;flex:none}
.round svg{width:16px;height:16px}
.round[hidden]{display:none}
.panel-head h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.022em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-sub{margin:2px 16px 12px;font-size:13px;color:var(--label-2);min-height:18px}
.cards{flex:1;overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;scroll-snap-type:y proximity;overscroll-behavior:contain}
/* 경로 줄 — 고른 줄은 파란 테두리 + 옅은 파란 바탕(색만으로 가르지 않는다) */
.card{scroll-snap-align:start;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:var(--r-card);background:var(--elev);border:2px solid transparent;text-align:left;width:100%;
  box-shadow:var(--edge);transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.card[aria-checked=true]{background:color-mix(in srgb,var(--tint) 8%,var(--elev));border-color:var(--tint)}
.card .t{flex:1;min-width:0}
.card b{display:block;font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .eta{display:block;margin-top:2px;font-size:13px;color:var(--label-2)}
.card .tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--fill-2);color:var(--label-2)}
.card[aria-checked=true] .tag{background:var(--tint);color:var(--on-tint)}
.go{width:68px;height:48px;border-radius:var(--r-ctl);border:0;background:var(--go);color:#fff;font-size:17px;font-weight:700;flex:none}
/* 구 목록 — 한 덩이 묶음 목록, 줄 사이는 머리카락 선 */
.cards:has(.gu){gap:0}
.gu{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 16px;background:var(--elev);border:0;width:100%;text-align:left;font-size:17px;font-weight:400}
.gu+.gu{box-shadow:inset 0 .5px 0 var(--sep)}
.gu:first-child{border-radius:var(--r-card) var(--r-card) 0 0}
.gu:last-child{border-radius:0 0 var(--r-card) var(--r-card)}
.gu:hover{background:color-mix(in srgb,var(--label) 4%,var(--elev))}
.gu small{font-size:15px;color:var(--label-2)}
.gu small::after{content:'›';margin-left:8px;color:var(--label-3);font-size:20px;line-height:0;vertical-align:-1px}
.gu[aria-current=true]{font-weight:600;color:var(--tint)}
.gu[aria-current=true] small::before{content:'✓ ';color:var(--tint)}
.pager{display:flex;justify-content:center;gap:8px;padding:6px 0}
.pager button{width:44px;height:32px;border:0;background:var(--fill-2);border-radius:999px;color:var(--label-2);display:flex;align-items:center;justify-content:center}
.pager svg{width:18px;height:18px}
.pager button:disabled{opacity:.35;cursor:default}
.hint{margin:0 16px 14px;font-size:12px;color:var(--label-2)}

/* 지도 단추 — Apple 지도 오른쪽 위 묶음: 44pt 칸, 파란 아이콘 */
.ctl{position:fixed;right:var(--gap);top:var(--gap);display:flex;flex-direction:column;gap:10px;z-index:3}
.ctl .grp{border-radius:var(--r-ctl);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm)}
.ctl button{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--tint)}
.ctl button:hover{background:var(--fill-2)}
.ctl button[aria-pressed=true]{background:var(--tint);color:var(--on-tint)}
.ctl .grp button+button{box-shadow:inset 0 .5px 0 var(--sep)}
.ctl svg{width:20px;height:20px}

/* 아래 막대 */
.nav-bot{position:fixed;left:50%;bottom:var(--gap);transform:translateX(-50%);z-index:3;display:flex;gap:4px;padding:5px;border-radius:999px;box-shadow:var(--shadow-sm)}
.nav-bot a,.nav-bot button{border:0;background:none;padding:10px 18px;border-radius:999px;color:var(--label);text-decoration:none;font-size:17px;font-weight:600}
.nav-bot a:hover{background:var(--fill-2)}
.nav-bot .is-play{background:var(--go);color:#fff;font-weight:700;padding:10px 26px}

/* 경로 말풍선 — Apple 지도 시간 꼬리표 */
.bubble{padding:5px 10px;border-radius:10px;font-weight:700;font-size:15px;line-height:1.15;white-space:nowrap;border:0;text-align:center;box-shadow:var(--shadow-sm)}
.bubble small{display:block;font-size:11px;font-weight:500;opacity:.85}
.bubble.on{background:var(--tint);color:var(--on-tint);box-shadow:var(--shadow-sm),0 0 0 2px var(--elev)}
.bubble.off{background:var(--elev);color:var(--label)}
/* 핀 — iOS 둥근 표지 + 꼬리, 흰 글리프 */
.pin{width:40px;height:52px;cursor:grab;color:var(--stop);filter:drop-shadow(0 4px 6px rgba(0,0,0,.28))}
.pin:active{cursor:grabbing}
.pin-tag{padding:3px 10px;border-radius:8px;background:var(--mat-thick);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--label);font-weight:600;font-size:13px;white-space:nowrap;margin-bottom:56px;pointer-events:none;box-shadow:var(--shadow-sm)}

/* ── 운전: Apple 지도 길 안내 ── */
.drive{display:none!important}
body.driving .drive{display:flex!important}
body.driving .home{display:none!important}
/* 위 안내판 — 어두운 재질, 흰 큰 거리 */
.banner{position:fixed;left:var(--gap);top:var(--gap);width:min(440px,calc(100vw - 2*var(--gap)));border-radius:var(--r-sheet);overflow:hidden;flex-direction:column;z-index:3;
  background:var(--mat-nav);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--nav-label);box-shadow:var(--shadow-lg)}
.banner .row{display:flex;align-items:center;gap:14px;padding:16px 18px}
.banner .arrow{width:56px;height:56px;flex:none}
.banner .dist{font-size:36px;line-height:1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.banner .road{margin-top:4px;font-size:15px;color:var(--nav-label-2)}
.banner .street{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:24px;font-weight:700;letter-spacing:-.015em}
.shield{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 6px;border-radius:6px;background:var(--nav-label);color:#1c1c1e;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
/* '그다음' 줄 — 한 단 더 짙게 */
.banner .lanes{display:flex;gap:6px;align-items:center;padding:9px 18px;background:rgba(0,0,0,.28);font-size:13px;color:var(--nav-label-2);overflow:hidden}
.banner .lanes span{padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.banner .lanes span:first-child{background:var(--nav-label);color:#1c1c1e;font-weight:700}
.pills{position:fixed;top:var(--gap);right:var(--gap);gap:8px;z-index:3}
.pill{height:44px;padding:0 18px;border-radius:999px;border:0;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
.pill.stop{background:var(--stop);color:#fff;backdrop-filter:none}
.pill.stop kbd{background:rgba(255,255,255,.22)}
/* 아래 여정 카드 — 도착·시간·거리 세 칸 */
.trip{position:fixed;left:var(--gap);bottom:var(--gap);border-radius:var(--r-sheet);z-index:3;padding:12px 4px;background:var(--mat-thick)}
.trip div{padding:0 18px;text-align:center}
.trip div+div{box-shadow:inset .5px 0 0 var(--sep)}
.trip b{display:block;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.trip span{font-size:12px;color:var(--label-2)}
.typer{position:fixed;left:50%;bottom:var(--gap);transform:translateX(-50%);width:min(500px,calc(100vw - 2*var(--gap)));border-radius:var(--r-sheet);z-index:3;padding:10px;flex-direction:column;gap:6px;background:var(--mat-thick)}
.typer label{font-size:13px;color:var(--label-2);padding:0 6px}
.typer input{height:54px;border-radius:var(--r-card);border:2px solid transparent;background:var(--fill-2);padding:0 16px;font:600 24px/1 var(--font);letter-spacing:-.01em;color:var(--label);width:100%;outline:0;
  transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease)}
.typer input:focus{border-color:var(--tint);background:var(--elev)}
.typer input.bad{border-color:var(--stop);animation:shake .3s}
/* 지난 동 · 지금 동 · 다음 동 — 몽키타입 줄처럼 한 줄에 흐른다. 색만으로 가르지 않는다(✓·테두리·굵기) */
.words{display:flex;align-items:center;gap:6px;margin:0;padding:2px 6px;list-style:none;overflow:hidden;white-space:nowrap;font-size:17px}
.words li{flex:none;padding:3px 10px;border-radius:999px;border:2px solid transparent}
.words .past{color:var(--label-3)}
.words .past::before{content:'✓ '}
.words .now{font-size:22px;font-weight:700;color:var(--label);border-color:var(--tint);background:var(--elev)}
.words .next{color:var(--label-2);font-weight:600}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 내 차 — 흰 원판 위 파란 화살(내비 퍽) */
.car{width:64px;height:64px;color:var(--map-route)}
.car svg{width:100%;height:100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
.done{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
.done.on{display:flex}
.done .box{border-radius:28px;padding:28px 28px 20px;text-align:center;min-width:300px;background:var(--mat-thick)}
.done h2{margin:0 0 6px;font-size:28px;font-weight:700;letter-spacing:-.02em}
.done p{margin:0;color:var(--label-2);font-variant-numeric:tabular-nums}
.done .pill{margin:20px auto 0;width:100%;justify-content:center;background:var(--tint);color:var(--on-tint);font-weight:700;box-shadow:none}
.attrib{position:fixed;right:var(--gap);bottom:4px;margin:0;font-size:10px;color:var(--label-2);z-index:2}
.attrib a{color:inherit}
.toast{position:fixed;left:50%;top:68px;transform:translateX(-50%);z-index:5;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;display:none}
.toast.on{display:block}

/* 폰 갈림은 pointer:coarse (CLAUDE.md). 좁은 데스크톱 창도 같은 배치로 접어 겹치지 않게만 한다 */
@media (pointer:coarse),(max-width:760px){
  :root{--gap:8px;--r-sheet:28px}
  .nav-top .side{display:none}
  /* 아래 시트 + 손잡이 */
  .panel{top:auto;left:var(--gap);right:var(--gap);width:auto;height:44vh;bottom:calc(72px + env(safe-area-inset-bottom))}
  .panel::before{content:'';width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:6px auto 0;flex:none}
  .panel-head{padding-top:8px}
  .ctl{top:60px}
  .nav-bot{bottom:calc(var(--gap) + env(safe-area-inset-bottom))}
  .nav-bot a,.nav-bot button{font-size:16px;padding:10px 16px}
  .hint{display:none}
  .banner .dist{font-size:30px}.banner .arrow{width:44px;height:44px}.banner .street{font-size:20px}
  .pills{top:auto;bottom:calc(190px + env(safe-area-inset-bottom))}
  .trip{left:var(--gap);right:var(--gap);bottom:calc(104px + env(safe-area-inset-bottom));justify-content:space-around}
  .typer{bottom:calc(var(--gap) + env(safe-area-inset-bottom))}
  .attrib{display:none}
}
@media (prefers-reduced-motion:reduce){
  .typer input.bad{animation:none}
  .card,button,.typer input{transition:none}
  button:active:not(:disabled){transform:none}
}
</style>
</head>
<body>
<div id="map" role="region" aria-label="지도"></div>

<nav class="nav-top glass home" aria-label="사이트 메뉴">
  <a class="side" href="../../about/">소개</a>
  <a class="side" href="../../#ranking">순위</a>
  <a class="logo" href="../../" aria-label="regiontype 홈">region<span>type</span><i aria-hidden="true"></i></a>
  <span class="beta">BETA</span>
  <a class="side" href="../../community/">커뮤니티</a>
</nav>

<section class="panel glass home" aria-labelledby="ttl">
  <div class="panel-head">
    <button class="round" type="button" id="back" aria-label="구 목록으로" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="ttl">어느 구를 달릴까요</h1>
  </div>
  <p class="panel-sub" id="sub" aria-live="polite"></p>
  <div class="cards" id="cards"></div>
  <div class="pager">
    <button type="button" id="up" aria-label="위로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15l7-7 7 7"/></svg></button>
    <button type="button" id="down" aria-label="아래로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
  </div>
  <p class="hint" id="hintKeys"><kbd>↑</kbd> <kbd>↓</kbd> 고르기 · <kbd>Enter</kbd> 출발 · 동을 누르거나 핀을 끌어 출발할 동을 고릅니다</p>
</section>

<div class="ctl home">
  <div class="grp glass">
    <button type="button" id="tilt" aria-pressed="false" aria-label="3D 건물로 기울이기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12 4 7.5"/></svg></button>
    <button type="button" id="fit" aria-label="코스 전체 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
  </div>
  <div class="grp glass">
    <button type="button" id="zin" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" id="zout" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  </div>
</div>

<nav class="nav-bot glass home" aria-label="놀이 메뉴">
  <a href="settings/">설정</a>
  <button type="button" class="is-play" id="play">출발</button>
  <a href="../../signin/">로그인</a>
</nav>

<!-- 운전 -->
<section class="banner drive" aria-live="polite" aria-label="길 안내">
  <div class="row">
    <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path id="arrow" d="M12 21V5M6 11l6-6 6 6"/></svg>
    <div>
      <div class="dist" id="dist">–</div>
      <div class="road" id="road"></div>
      <div class="street"><span class="shield" id="shield" aria-label="순번">1</span><span id="target">–</span></div>
    </div>
  </div>
  <div class="lanes" id="lanes" aria-label="다음 동들"></div>
</section>
<div class="pills drive">
  <button class="pill glass" type="button" id="peek">첫 글자</button>
  <button class="pill stop" type="button" id="quit">그만두기 <kbd>Esc</kbd></button>
</div>
<div class="trip glass drive" role="status">
  <div><b id="left">0</b><span>남은 곳</span></div>
  <div><b id="clock">0:00</b><span>달린 시간</span></div>
  <div><b id="km">0.0</b><span>km</span></div>
</div>
<div class="typer glass drive">
  <ol class="words" id="words" aria-label="코스 — 지난 동, 지금 동, 다음 동"></ol>
  <label for="in">다음 동 이름을 치면 그 동까지 달립니다</label>
  <input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ko" enterkeyhint="go">
</div>
<div class="done" id="done" role="dialog" aria-modal="true" aria-labelledby="doneT"><div class="box glass"><h2 id="doneT">도착</h2><p id="doneP"></p><button class="pill" type="button" id="again">다시 고르기</button></div></div>
<p class="toast glass" id="toast" role="status"></p>
<p class="attrib">© <a href="https://openfreemap.org">OpenFreeMap</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · 길 <a href="https://project-osrm.org">OSRM</a> · 경계 KOSTAT 2013</p>

<script>
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE=matchMedia('(pointer:coarse),(max-width:760px)').matches;   // 배치만 접는다
const DATA='../../data/';
/* 사이트 야간 설정을 그대로 따른다(app.js 의 rt.opt) */
try{document.documentElement.toggleAttribute('data-night',!!JSON.parse(localStorage.getItem('rt.opt')||'{}').night)}catch(e){}
/* 지도 칠은 CSS 의 --map-* 토큰에서 읽는다 — 색을 여기 적지 않는다 */
const T=n=>getComputedStyle(document.documentElement).getPropertyValue('--map-'+n).trim();
/* 설정은 settings/index.html 이 쓴다. 키와 기본값을 저쪽과 맞춘다 */
const NAV=(()=>{const d={past:2,next:3,pitch:62,zoom:16.8,speed:'normal'};
  try{return {...d,...JSON.parse(localStorage.getItem('rt-nav3d')||'{}')}}catch{return d}})();
const PACE={slow:2,normal:1.4,fast:.8}[NAV.speed]||1.4;   // 1 m 에 몇 ms

const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',
  center:[126.98,37.56],zoom:11,attributionControl:false,maxPitch:70,dragRotate:true});

let index=[], slug=null, dongs=[], routes=[], sel=0, view='list', pin, pinTag, bubbles=[], run=null, planSeq=0;

/* ── 바탕: OSM 이름을 한국어로, 칠은 Apple 지도 결(--map-*)로 ── */
function tame(){
  for(const l of map.getStyle().layers){
    try{
      const id=l.id;
      if(l.type==='symbol'&&map.getLayoutProperty(id,'text-field')){
        map.setLayoutProperty(id,'text-field',['coalesce',['get','name:ko'],['get','name']]);
        map.setPaintProperty(id,'text-color',T(/road|highway|street/.test(id)?'label-2':'label'));
        map.setPaintProperty(id,'text-halo-color',T('halo'));
        map.setPaintProperty(id,'text-halo-width',1.4);
      }
      if((l.type==='symbol'&&/poi/.test(id))||l.type==='raster') map.setLayoutProperty(id,'visibility','none');   // 저배율 위성 래스터는 Apple 의 평평한 땅과 안 맞는다
      if(l.type==='fill'&&/^aeroway/.test(id)) map.setPaintProperty(id,'fill-color',T('bldg-lo'));
      if(l.type==='fill'&&id==='building') map.setPaintProperty(id,'fill-color',T('bldg-lo'));
      if(l.type==='background') map.setPaintProperty(id,'background-color',T('land'));
      if(l.type==='fill'&&/^water/.test(id)) map.setPaintProperty(id,'fill-color',T('water'));
      if(l.type==='line'&&/^water/.test(id)) map.setPaintProperty(id,'line-color',T('water'));
      if(l.type==='fill'&&/park|wood|grass|landcover|landuse/.test(id)){
        map.setPaintProperty(id,'fill-color',/park|wood|grass/.test(id)?T('park'):T('land'));map.setPaintProperty(id,'fill-opacity',1);
      }
      if(l.type==='line'&&/^(road|highway|bridge|tunnel)/.test(id)&&!/rail|path|pier|area/.test(id)){
        const hwy=/motorway/.test(id),cs=/casing/.test(id);
        map.setPaintProperty(id,'line-color',T((hwy?'hwy':'road')+(cs?'-case':'')));
      }
      if(l.type==='fill-extrusion'){
        map.setPaintProperty(id,'fill-extrusion-color',['interpolate',['linear'],['coalesce',['get','render_height'],8],0,T('bldg-lo'),120,T('bldg-hi')]);
        map.setPaintProperty(id,'fill-extrusion-opacity',.9);
      }
    }catch(e){}
  }
}

const norm=s=>s.replace(/[\s·,.\-]/g,'');
const mins=s=>Math.max(1,Math.round(s/60))+'분';
const km=m=>(m/1000).toFixed(1);
const fc=list=>({type:'FeatureCollection',features:list.map((d,i)=>({type:'Feature',
  properties:{name:d.name,own:d.own?1:0,tgt:d.tgt?1:0},geometry:d.geometry}))});
const pts=list=>({type:'FeatureCollection',features:list.map((d,i)=>({type:'Feature',
  properties:{name:(d.own?'✓ ':'')+d.name,own:d.own?1:0,tgt:d.tgt?1:0},geometry:{type:'Point',coordinates:d.c}}))});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3200)}

/* ── 코스: 핀을 놓은 동에서 출발하는 세 갈래 ── */
function nearest(from,list){
  const left=[...list],out=[];let cur=from;
  while(left.length){let bi=0,bd=1e9;
    left.forEach((d,i)=>{const dx=(d.c[0]-cur.c[0])*88,dy=(d.c[1]-cur.c[1])*111,q=dx*dx+dy*dy;if(q<bd){bd=q;bi=i}});
    cur=left.splice(bi,1)[0];out.push(cur)}
  return out;
}
function variants(s){
  const k=dongs.indexOf(s);
  return [
    {name:'코스 순서',tag:'추천',order:[...dongs.slice(k),...dongs.slice(0,k)]},
    {name:'가까운 동부터',tag:'짧은 길',order:[s,...nearest(s,dongs.filter(d=>d!==s))]},
    {name:'거꾸로 돌기',tag:'반대로',order:[s,...dongs.slice(0,k).reverse(),...dongs.slice(k+1).reverse()]},
  ];
}
/* 동 중심을 곧게 잇는 길. 길 서버를 기다리는 동안의 미리보기이자, 서버가 안 될 때의 대신이다 */
const straight=order=>({geom:order.map(d=>d.c),dist:0,dur:0,fallback:true,legs:order.slice(1).map((d,i)=>({dist:0,steps:[],coords:[order[i].c,d.c]}))});
const routeCache=new Map();   // 같은 순서는 다시 묻지 않는다
function route(order){
  const url='https://router.project-osrm.org/route/v1/driving/'+order.map(d=>d.c.join(',')).join(';')+'?overview=full&geometries=geojson&steps=true';
  if(!routeCache.has(url))routeCache.set(url,(async()=>{
    try{
      /* 공개 데모 서버라 가끔 한참 걸린다 — 6초 넘으면 곧은 길로 놀게 한다 */
      const j=await (await fetch(url,{signal:AbortSignal.timeout(6000)})).json();if(j.code!=='Ok')throw 0;
      const r=j.routes[0];
      return {geom:r.geometry.coordinates,dist:r.distance,dur:r.duration,
        legs:r.legs.map(l=>({dist:l.distance,steps:l.steps,coords:l.steps.flatMap(s=>s.geometry.coordinates)}))};
    }catch(e){routeCache.delete(url);return straight(order)}
  })());
  return routeCache.get(url);
}

/* ── 패널: 구 목록 → 경로 카드 ── */
function showList(){
  view='list';$('back').hidden=true;$('ttl').textContent='어느 구를 달릴까요';
  $('sub').textContent='서울 25개 구 · 행정동 코스';
  const box=$('cards');box.innerHTML='';box.setAttribute('role','list');
  index.forEach(m=>{
    const b=document.createElement('button');b.type='button';b.className='gu';b.setAttribute('role','listitem');
    b.setAttribute('aria-current',m.slug===slug);
    b.innerHTML=`<span>${m.title.split(' ')[0]}</span><small>${m.n}곳</small>`;
    b.onclick=()=>load(m.slug);box.appendChild(b);
  });
  clearRoutes();
  if(pin){pin.remove();pinTag.remove();pin=null}
  setDongs([]);
  map.easeTo({center:[126.985,37.56],zoom:COARSE?10:10.6,pitch:0,bearing:0,padding:pad(),duration:RM?0:700});
  (box.querySelector('[aria-current=true]')||box.firstChild)?.focus({preventScroll:false});
}
function pad(){return COARSE?{left:44,right:76,top:80,bottom:innerHeight*.6}:{left:400,right:96,top:96,bottom:96}}

async function load(s){
  slug=s;history.replaceState(null,'','?c='+s);
  const gj=await (await fetch(DATA+s+'.drive.json')).json();
  dongs=gj.features.map(f=>({name:f.properties.name,c:f.properties.c,geometry:f.geometry}));
  view='routes';$('back').hidden=false;
  setDongs(dongs);
  fit();
  placePin(dongs[0]);
  await plan(dongs[0]);
}
function setDongs(list){map.getSource('dongs').setData(fc(list));map.getSource('dong-pts').setData(pts(list))}
function fit(){
  if(!dongs.length)return;const b=new maplibregl.LngLatBounds();dongs.forEach(d=>b.extend(d.c));
  map.fitBounds(b,{padding:pad(),pitch:map.getPitch(),bearing:map.getBearing(),duration:RM?0:900,maxZoom:15});
}
function placePin(d){
  if(!pin){
    const el=document.createElement('div');el.className='pin';el.tabIndex=0;el.setAttribute('role','button');
    el.setAttribute('aria-label','플레이 핀 — 방향키로 옆 동으로 옮깁니다');
    el.innerHTML='<svg viewBox="0 0 40 52" width="40" height="52" aria-hidden="true"><path d="M20 51l-6-10h12z" fill="currentColor"/><circle cx="20" cy="20" r="18" fill="currentColor" stroke="#fff" stroke-width="2.5"/><path d="M15 11v18M15 12h11l-3 4 3 4H15" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
    pin=new maplibregl.Marker({element:el,anchor:'bottom',draggable:true}).setLngLat(d.c).addTo(map);
    const t=document.createElement('div');t.className='pin-tag';
    pinTag=new maplibregl.Marker({element:t,anchor:'bottom'}).setLngLat(d.c).addTo(map);
    pin.on('drag',()=>{const h=dongAt(pin.getLngLat());t.textContent=h?h.name:'코스 밖';pinTag.setLngLat(pin.getLngLat())});
    pin.on('dragend',()=>{const h=dongAt(pin.getLngLat());if(!h){toast('코스 안의 동에 놓아 주세요');return placePin(pin._d)}placePin(h);plan(h)});
    el.addEventListener('keydown',e=>{
      const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];if(!dir)return;
      e.preventDefault();e.stopPropagation();
      const cur=pin._d;let best=null,bd=1e9;
      dongs.forEach(o=>{if(o===cur)return;const dx=(o.c[0]-cur.c[0])*88,dy=(o.c[1]-cur.c[1])*111;
        const along=dx*dir[0]+dy*dir[1];if(along<=0)return;const q=dx*dx+dy*dy+Math.abs(dx*dir[1]-dy*dir[0])*4;if(q<bd){bd=q;best=o}});
      if(best){placePin(best);plan(best)}
    });
  }
  pin._d=d;pin.setLngLat(d.c);pinTag.setLngLat(d.c);pinTag.getElement().textContent=d.name;
}
function dongAt(ll){
  const f=map.queryRenderedFeatures(map.project(ll),{layers:['dong-fill','dong-tgt']})[0];
  return f&&dongs.find(d=>d.name===f.properties.name);
}

async function plan(s){
  const my=++planSeq;
  $('ttl').textContent=s.name+'에서 출발';
  $('sub').textContent='실제 도로로 길을 찾는 중…';
  const vs=variants(s);
  /* 곧은 길로 먼저 띄우고, 실제 도로가 오면 바꿔 낀다 */
  routes=vs.map(v=>({...straight(v.order),...v,pending:true}));sel=0;drawRoutes();renderCards();
  const rs=await Promise.all(vs.map(v=>route(v.order)));
  if(my!==planSeq||view!=='routes'||run)return;
  const focused=$('cards').contains(document.activeElement);
  routes=rs.map((r,i)=>({...r,...vs[i]}));
  $('sub').textContent=routes[0].fallback?'길 서버에 닿지 않아 동 사이를 곧게 잇습니다':`${index.find(m=>m.slug===slug)?.title||''} · 실제 도로 경로`;
  drawRoutes();renderCards();
  if(focused)document.querySelectorAll('.card')[sel]?.focus({preventScroll:true});
}
function clearRoutes(){
  for(let i=0;i<3;i++)if(map.getLayer('r'+i)){map.removeLayer('r'+i);map.removeLayer('r'+i+'-case');map.removeSource('r'+i)}
  bubbles.forEach(b=>b.remove());bubbles=[];routes=[];
}
function drawRoutes(){
  const keep=routes;clearRoutes();routes=keep;   // clearRoutes 가 routes 를 비우니 들고 있다가 되돌린다
  routes.forEach((r,i)=>{
    map.addSource('r'+i,{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:r.geom}}});
    map.addLayer({id:'r'+i+'-case',type:'line',source:'r'+i,layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':T('route-case'),'line-width':['interpolate',['linear'],['zoom'],11,6,17,22]}},'dong-label');
    map.addLayer({id:'r'+i,type:'line',source:'r'+i,layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':T('route'),'line-width':['interpolate',['linear'],['zoom'],11,4,17,16]}},'dong-label');
  });
  bubbles=routes.map((r,i)=>{
    const p=r.geom[Math.floor((r.geom.length-1)*(0.25+i*0.22))];
    const el=document.createElement('button');el.type='button';el.tabIndex=-1;
    el.innerHTML=`${r.fallback?r.order.length+'곳':mins(r.dur)}<small>${r.tag}</small>`;
    el.onclick=()=>pick(i);
    return new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat(p).addTo(map);
  });
  restyle();
}
function restyle(){
  routes.forEach((r,i)=>{
    const on=i===sel;
    map.setPaintProperty('r'+i,'line-color',T(on?'route':'route-alt'));
    map.setPaintProperty('r'+i+'-case','line-color',T(on?'route-case':'route-alt-case'));
  });
  if(routes[sel]){map.moveLayer('r'+sel+'-case','dong-label');map.moveLayer('r'+sel,'dong-label')}
  bubbles.forEach((b,i)=>{const e=b.getElement();e.classList.add('bubble');e.classList.toggle('on',i===sel);e.classList.toggle('off',i!==sel);e.style.zIndex=i===sel?2:1});   // className= 은 maplibregl-marker 를 지운다
  document.querySelectorAll('.card').forEach((c,i)=>{c.setAttribute('aria-checked',i===sel);c.tabIndex=i===sel?0:-1});
}
function renderCards(){
  const box=$('cards');box.innerHTML='';box.setAttribute('role','radiogroup');box.setAttribute('aria-label','경로');
  routes.forEach((r,i)=>{
    const c=document.createElement('div');c.className='card';c.setAttribute('role','radio');
    c.innerHTML=`<div class="t"><b>${r.fallback?r.order.length+'곳':mins(r.dur)}</b>`+
      `<span class="eta">${r.order.length}곳 · ${r.pending?'길 찾는 중…':r.fallback?'곧은 길':km(r.dist)+' km'} · ${r.name}</span><span class="tag">${r.tag}</span></div>`+
      `<button class="go" type="button" aria-label="${r.name}(으)로 출발">출발</button>`;
    c.addEventListener('click',e=>{if(e.target.closest('.go'))return start(i);pick(i)});
    box.appendChild(c);
  });
  restyle();
}
function pick(i){
  if(!routes.length)return;sel=(i+routes.length)%routes.length;restyle();
  const c=document.querySelectorAll('.card')[sel];c?.focus({preventScroll:true});c?.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
}
function step(d){
  if(view==='routes')return pick(sel+d);
  const b=[...document.querySelectorAll('.gu')],k=b.indexOf(document.activeElement);
  (b[Math.max(0,Math.min(b.length-1,(k<0?0:k+d)))]).focus();
}

/* ── 운전 ── */
const ARROWS={straight:'M12 21V5M6 11l6-6 6 6',right:'M7 21v-9a3 3 0 0 1 3-3h9M15 5l4 4-4 4','slight right':'M9 21v-8l8-8M11 5h6v6','sharp right':'M7 21V9a3 3 0 0 1 3-3h9M15 2l4 4-4 4',
  left:'M17 21v-9a3 3 0 0 0-3-3H5M9 5 5 9l4 4','slight left':'M15 21v-8L7 5M13 5H7v6','sharp left':'M17 21V9a3 3 0 0 0-3-3H5M9 2 5 6l4 4',uturn:'M8 21V9a4 4 0 0 1 8 0v6M12 12l4 4 4-4'};
const bearing=(a,b)=>{const r=Math.PI/180,y=Math.sin((b[0]-a[0])*r)*Math.cos(b[1]*r),x=Math.cos(a[1]*r)*Math.sin(b[1]*r)-Math.sin(a[1]*r)*Math.cos(b[1]*r)*Math.cos((b[0]-a[0])*r);return Math.atan2(y,x)/r};
const hav=(a,b)=>{const r=Math.PI/180,p=(b[1]-a[1])*r,q=(b[0]-a[0])*r,s=Math.sin(p/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(q/2)**2;return 12742000*Math.asin(Math.sqrt(s))};

function start(i=sel){
  if(!routes.length)return;
  if(routes[i].pending)return toast('실제 도로를 찾는 중이에요 — 잠깐만요');
  sel=i;const r=routes[sel];
  dongs.forEach(d=>{d.own=false;d.tgt=false});r.order[0].own=true;
  run={r,k:1,t0:performance.now(),dist:0,brg:0,busy:false};
  document.body.classList.add('driving');
  routes.forEach((_,j)=>{const v=j===sel?'visible':'none';map.setLayoutProperty('r'+j,'visibility',v);map.setLayoutProperty('r'+j+'-case','visibility',v)});
  bubbles.forEach(b=>b.getElement().style.display='none');
  pin.getElement().style.display='none';pinTag.getElement().style.display='none';
  const ce=document.createElement('div');ce.className='car';ce.setAttribute('aria-hidden','true');
  ce.innerHTML='<svg viewBox="0 0 58 58" width="58" height="58"><circle cx="29" cy="29" r="26" fill="#fff"/><path d="M29 11l12 30-12-6-12 6z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>';
  const c0=r.legs[0].coords;run.brg=bearing(c0[0],c0[Math.min(4,c0.length-1)]);
  run.car=new maplibregl.Marker({element:ce,rotationAlignment:'map',pitchAlignment:'map'}).setLngLat(c0[0]).setRotation(run.brg).addTo(map);
  map.flyTo({center:c0[0],zoom:NAV.zoom,pitch:NAV.pitch,bearing:run.brg,padding:{top:innerHeight*.26,bottom:0,left:0,right:0},duration:RM?0:2400,essential:true});
  setTarget();
  $('in').value='';$('in').placeholder='';setTimeout(()=>$('in').focus(),RM?0:400);
  tick();
}
function setTarget(){
  const o=run.r.order;o.forEach(d=>d.tgt=false);
  const d=o[run.k];if(d)d.tgt=true;
  setDongs(o);
  $('left').textContent=o.length-run.k;
  if(!d)return;
  $('target').textContent=d.name;$('shield').textContent=run.k+1;
  $('lanes').innerHTML=o.slice(run.k,run.k+5).map(x=>`<span>${x.name}</span>`).join('');
  const p0=Math.max(0,run.k-NAV.past);
  $('words').innerHTML=o.slice(p0,run.k+1+NAV.next).map((x,j)=>{
    const i=p0+j,c=i<run.k?'past':i===run.k?'now':'next';
    return `<li class="${c}"${c==='now'?' aria-current="step"':''}>${x.name}</li>`}).join('');
  const leg=run.r.legs[run.k-1];
  $('dist').textContent=leg.dist?(leg.dist>=1000?km(leg.dist)+' km':Math.round(leg.dist/10)*10+' m'):'곧장';
  const st=leg.steps.find(s=>s.maneuver.type!=='depart'&&s.name)||leg.steps.find(s=>s.maneuver.type!=='depart');
  $('road').textContent=st?.name?st.name+' 방면':'';
  $('arrow').setAttribute('d',ARROWS[st?.maneuver.modifier]||ARROWS.straight);
  $('in').placeholder='';
}
function tick(){
  if(!run||run.done)return;
  const s=Math.floor((performance.now()-run.t0)/1000);$('clock').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  requestAnimationFrame(tick);
}
function driveLeg(){
  const leg=run.r.legs[run.k-1],p=leg.coords,seg=[];let tot=0;
  for(let i=1;i<p.length;i++){const d=hav(p[i-1],p[i]);seg.push(d);tot+=d}
  const dur=RM?0:Math.min(5000*PACE,Math.max(1300*PACE,tot*PACE)),t0=performance.now();run.busy=true;
  const frame=now=>{
    if(!run)return;
    const f=dur?Math.min(1,(now-t0)/dur):1,e=f<.5?2*f*f:1-(-2*f+2)**2/2;
    let want=e*tot,i=0;while(i<seg.length-1&&want>seg[i]){want-=seg[i];i++}
    const a=p[i],b=p[i+1]||a,u=seg[i]?want/seg[i]:0,q=[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
    if(seg[i]>1){const d=((bearing(a,b)-run.brg+540)%360)-180;run.brg+=d*(RM?1:.1)}
    run.car.setLngLat(q).setRotation(run.brg);
    map.jumpTo({center:q,bearing:run.brg});
    $('km').textContent=km(run.dist+e*tot);
    if(f<1)requestAnimationFrame(frame);else{run.dist+=tot;arrive()}
  };
  requestAnimationFrame(frame);
}
function arrive(){
  const o=run.r.order;o[run.k].own=true;run.k++;run.busy=false;setTarget();
  if(run.k>=o.length)finish();else $('in').focus();
}
function finish(){
  run.done=true;const s=Math.floor((performance.now()-run.t0)/1000);
  $('doneP').textContent=`${run.r.order.length}곳 · ${km(run.dist)} km · ${Math.floor(s/60)}분 ${s%60}초`;
  $('done').classList.add('on');$('again').focus();
}
function tryType(final){
  if(!run||run.busy||run.done)return;
  const inp=$('in'),d=run.r.order[run.k],v=norm(inp.value),want=norm(d.name);
  if(v===want||(final&&v&&v+'동'===want)){inp.value='';driveLeg();return}
  if(final&&v){inp.classList.remove('bad');void inp.offsetWidth;inp.classList.add('bad')}
}
/* 이름을 다 치면 확정 키 없이 달린다. 스페이스는 가로채지 않는다(IME) */
$('in').addEventListener('input',()=>tryType(false));
$('in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();tryType(true)}});
$('peek').onclick=()=>{if(run&&!run.done){const d=run.r.order[run.k];$('in').placeholder=d.name[0]+'…';$('in').focus()}};
function quit(){
  if(!run)return;run.car.remove();run=null;
  $('done').classList.remove('on');document.body.classList.remove('driving');
  dongs.forEach(d=>{d.own=false;d.tgt=false});setDongs(dongs);
  routes.forEach((_,j)=>{map.setLayoutProperty('r'+j,'visibility','visible');map.setLayoutProperty('r'+j+'-case','visibility','visible')});
  bubbles.forEach(b=>b.getElement().style.display='');
  pin.getElement().style.display='';pinTag.getElement().style.display='';
  map.easeTo({pitch:$('tilt').getAttribute('aria-pressed')==='true'?55:0,bearing:0,padding:{top:0,bottom:0,left:0,right:0},duration:RM?0:700});
  setTimeout(fit,RM?0:720);
  document.querySelector('.card[aria-checked=true]')?.focus();
}

/* ── 단추·키 ── */
$('back').onclick=showList;
$('fit').onclick=fit;$('zin').onclick=()=>map.zoomIn();$('zout').onclick=()=>map.zoomOut();
$('tilt').onclick=()=>{const on=$('tilt').getAttribute('aria-pressed')!=='true';$('tilt').setAttribute('aria-pressed',on);
  map.easeTo({pitch:on?55:0,bearing:on?-17:0,duration:RM?0:700})};
$('up').onclick=()=>step(-1);$('down').onclick=()=>step(1);
$('play').onclick=()=>view==='routes'?start():toast('먼저 구를 고르세요');
$('quit').onclick=quit;$('again').onclick=quit;
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(run)return quit();if(view==='routes')return showList()}
  if(run||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowDown'){e.preventDefault();step(1)}
  if(e.key==='ArrowUp'){e.preventDefault();step(-1)}
  if(e.key==='Enter'&&view==='routes'&&!e.target.closest('button,a'))start();
});

map.on('load',async()=>{
  tame();
  map.addSource('dongs',{type:'geojson',data:fc([]),generateId:true});
  map.addSource('dong-pts',{type:'geojson',data:pts([])});
  const firstSym=map.getStyle().layers.find(l=>l.type==='symbol')?.id;
  /* 동 경계 그대로 칠한 면. 마우스를 얹으면 짙어지고, 누르면 그 동에서 출발한다 */
  const hov=['boolean',['feature-state','hover'],false];
  map.addLayer({id:'dong-fill',type:'fill',source:'dongs',filter:['!=',['get','tgt'],1],
    paint:{'fill-color':['case',['==',['get','own'],1],T('own'),T('area')],
      'fill-opacity':['case',hov,1,.75]}},firstSym);
  map.addLayer({id:'dong-tgt',type:'fill',source:'dongs',filter:['==',['get','tgt'],1],paint:{'fill-color':T('tgt')}},firstSym);
  map.addLayer({id:'dong-line',type:'line',source:'dongs',layout:{'line-join':'round'},paint:{
    'line-color':['case',['==',['get','tgt'],1],T('tgt-line'),['==',['get','own'],1],T('own-line'),T('area-line')],
    'line-width':['case',['==',['get','tgt'],1],4,hov,3,['==',['get','own'],1],2.5,1.2]}},firstSym);
  let hovId=null;
  const unhover=()=>{if(hovId!==null)map.setFeatureState({source:'dongs',id:hovId},{hover:false});hovId=null;map.getCanvas().style.cursor=''};
  map.on('mousemove','dong-fill',e=>{
    if(run)return unhover();
    const id=e.features[0].id;if(id===hovId)return;unhover();
    hovId=id;map.setFeatureState({source:'dongs',id},{hover:true});map.getCanvas().style.cursor='pointer';
  });
  map.on('mouseleave','dong-fill',unhover);
  map.on('click','dong-fill',e=>{
    if(run||view!=='routes')return;
    const d=dongs.find(x=>x.name===e.features[0].properties.name);if(d&&d!==pin?._d){placePin(d);plan(d)}
  });
  map.addLayer({id:'dong-label',type:'symbol',source:'dong-pts',layout:{
    'text-field':['get','name'],'text-font':['Noto Sans Bold'],'text-letter-spacing':-.01,
    'text-size':['interpolate',['linear'],['zoom'],11,12,16,21],'symbol-sort-key':['case',['==',['get','tgt'],1],0,1],
    'text-padding':4},
    paint:{'text-color':['case',['==',['get','tgt'],1],'#ffffff',T('label')],
      'text-halo-color':['case',['==',['get','tgt'],1],T('tgt-line'),['==',['get','own'],1],T('own-halo'),T('halo')],
      'text-halo-width':['case',['==',['get','tgt'],1],6,2]}});
  index=await (await fetch(DATA+'drive-index.json')).json();
  const q=new URLSearchParams(location.search).get('c');
  if(q&&index.some(m=>m.slug===q))load(q);else showList();
});
map.on('error',e=>{if(/tiles|style/.test(e?.error?.message||''))toast('지도 타일을 받지 못했습니다')});
</script>
