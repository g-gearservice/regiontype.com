<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 내비게이션 · regiontype beta</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../../favicon/favicon.svg">
<!-- 실제 지도. 바탕·3D 건물은 OpenFreeMap(OSM render_height), 길은 OSRM, 동 경계는
     tools/build_drive.py 가 찍은 data/*-dong.drive.json 이다 -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* ── 토큰 ─────────────────────────────────────────────────────────────
   베타는 사이트의 비트맵 말을 따르지 않고 Apple 지도의 말을 따른다. 세 층이다.
   1) sys-*  Apple 시스템 색(iOS HIG). 2) 뜻 토큰(label·fill·mat…) — 화면은 이것만 쓴다.
   3) map-*  지도 칠. JS 의 paint() 가 getComputedStyle 로 읽어 MapLibre 에 넣는다 —
      MapLibre 는 color-mix·var() 를 못 읽으니 map-* 는 hex/rgba 날값만 둔다.
   새 지도 결(위성·야간 운전 따위)은 :root[data-map=…] 에서 map-* 만 덮어쓰면 된다. */
:root{
  --sys-blue:#007aff; --sys-green:#34c759; --sys-red:#ff3b30; --sys-gray:#8e8e93;
  --brand:#f0a03c;                                   /* 로고 점 하나만 사이트 색을 남긴다 */

  --label:#1c1c1e; --label-2:rgba(60,60,67,.62); --label-3:rgba(60,60,67,.32);
  --fill:rgba(120,120,128,.14); --fill-2:rgba(120,120,128,.08); --sep:rgba(60,60,67,.16);
  --elev:#fff; --on-tint:#fff;
  --tint:var(--sys-blue); --go:var(--sys-green); --stop:var(--sys-red);
  /* 리퀴드 글래스 — 뿌옇게 가리는 판이 아니라 맑은 렌즈다. 지도는 흐림 없이 그대로 비치고,
     옅게만 물들며(--ga), 판 가장자리의 볼록한 베벨이 지도를 안쪽으로 휜다(아래 스크립트의 #glassGL).
     --rim 은 그 베벨에 걸린 안쪽 빛줄이다. WebGL 이 없거나 굴절을 끄면
     스크립트가 --ga 를 올리고 --blur 로 서린 유리가 된다. --ga·--sk 는 설정의 투명도·반사광이 넣는다.
     두꺼운 판(패널·시트)은 얇은 판보다 1.6 배 짙게 물든다 — Apple 의 regular/clear 갈림 */
  --ga:.15; --sk:1;
  --mat:rgb(255 255 255 / var(--ga)); --mat-thick:rgb(255 255 255 / min(1, var(--ga) * 1.6));
  /* 투명도(--ga)는 판만이 아니라 판 위의 모든 것에 걸린다 — 어두운 안내판(--mat-nav), 목록 줄(--mat-row),
     색 단추(출발·그만두기·다시, --tintmix)도 같은 값으로 맑아지고 짙어진다. 글자가 얹히는 것은 바닥값을
     두어(안내판 .3 · 줄 40% · 색 단추 45%) 아무리 맑게 해도 읽힌다 */
  --mat-nav:rgb(28 28 30 / min(1, .3 + var(--ga) * 1.6));
  --mat-row:color-mix(in srgb,var(--elev) calc(40% + var(--ga) * 60%),transparent);
  --tintmix:calc(45% + var(--ga) * 55%);
  --nav-label:#fff; --nav-label-2:rgba(235,235,245,.62);
  --blur:blur(28px) saturate(220%);
  /* 빛테는 한 줄이다 — 같은 1px 자리에 왼쪽 위는 밝게, 오른쪽 아래는 옅게. 테를 여러 겹(안쪽 빛줄 둘 +
     머리카락 테 + 셰이더 빛테) 두르면 테두리가 겹쳐 보인다. WebGL 유리가 뜨면 셰이더가 빛 방향을 따라
     테를 그리니 CSS 테는 걷는다(:root[data-gl]) */
  --rim:inset 1px 1px 0 rgb(255 255 255 / calc(.5 * var(--sk))),inset -1px -1px 0 rgb(255 255 255 / calc(.18 * var(--sk)));
  --edge:0 0 0 .5px rgba(0,0,0,.1);                  /* 카드의 머리카락 테두리 */
  --shadow-sm:var(--rim),0 4px 10px rgba(0,0,0,.15);
  --shadow-lg:var(--rim),0 6px 6px rgba(0,0,0,.2),0 0 20px rgba(0,0,0,.1);

  --r-sheet:22px; --r-card:14px; --r-ctl:12px; --gap:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Pretendard",system-ui,"Malgun Gothic",sans-serif;
  --fast:.18s; --ease:cubic-bezier(.32,.72,0,1);     /* iOS 시트 곡선 — 감쇠 1.0 스프링 근사 */

  /* 지도 — Apple 지도 밝은 결 */
  --map-land:#f7f5f0; --map-water:#9fd0f2; --map-park:#d3ecc4;
  --map-road:#ffffff; --map-road-case:#e2ddd4; --map-hwy:#fde293; --map-hwy-case:#e9be5c;
  --map-bldg-lo:#ebe8e2; --map-bldg-hi:#d6d2ca;
  --map-label:#3a3a3c; --map-label-2:#6e6e73; --map-halo:#ffffff;
  --map-route:#1a7cff; --map-route-case:#0a56c2; --map-route-alt:#a9c9f5; --map-route-alt-case:#7ea7e0;
  --map-area:rgba(142,142,147,.10); --map-area-line:rgba(60,60,67,.42);
  --map-own:rgba(52,199,89,.24); --map-own-line:#248a3d; --map-own-halo:#e3f6e8;
  --map-tgt:rgba(0,122,255,.16); --map-tgt-line:#007aff;
}
/* 사이트 야간(rt.opt.night)을 따른다 — 홈과 같은 갈림 */
:root[data-night]{
  --sys-blue:#0a84ff; --sys-green:#30d158; --sys-red:#ff453a;
  --label:#f2f2f7; --label-2:rgba(235,235,245,.62); --label-3:rgba(235,235,245,.3);
  --fill:rgba(120,120,128,.32); --fill-2:rgba(120,120,128,.2); --sep:rgba(84,84,88,.6);
  --elev:#2c2c2e; --mat:rgb(30 30 32 / var(--ga)); --mat-thick:rgb(30 30 32 / min(1, var(--ga) * 1.6));
  --edge:0 0 0 .5px rgba(255,255,255,.12);
  --rim:inset 1px 1px 0 rgb(255 255 255 / calc(.28 * var(--sk))),inset -1px -1px 0 rgb(255 255 255 / calc(.1 * var(--sk)));
  --map-land:#26272a; --map-water:#172a3e; --map-park:#20382a;
  --map-road:#46474c; --map-road-case:#303135; --map-hwy:#6b5b36; --map-hwy-case:#4b4027;
  --map-bldg-lo:#333438; --map-bldg-hi:#48494e;
  --map-label:#e5e5ea; --map-label-2:#a1a1a6; --map-halo:#1c1c1e;
  --map-route:#0a84ff; --map-route-case:#0060df; --map-route-alt:#3d5f8c; --map-route-alt-case:#2a4466;
  --map-area:rgba(142,142,147,.12); --map-area-line:rgba(235,235,245,.4);
  --map-own:rgba(48,209,88,.24); --map-own-line:#30d158; --map-own-halo:#1d3a26;
  --map-tgt:rgba(10,132,255,.22); --map-tgt-line:#0a84ff;
  color-scheme:dark;
}
@media (prefers-reduced-transparency:reduce){:root,:root[data-night]{--mat:var(--elev);--mat-thick:var(--elev);--mat-nav:#1c1c1e;--mat-row:var(--elev);--tintmix:100%;--blur:none}}
@media (prefers-contrast:more){:root,:root[data-night]{--mat:var(--elev);--mat-thick:var(--elev);--mat-nav:#1c1c1e;--mat-row:var(--elev);--tintmix:100%;--blur:none;--edge:0 0 0 1.5px var(--label);--rim:inset 0 0 0 1.5px var(--label)}}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--map-land);color:var(--label);
  font:400 15px/1.35 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
button:active:not(:disabled){transform:scale(.97)}
button{transition:transform 100ms ease-out,background var(--fast) var(--ease)}
a{white-space:nowrap}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
#map{position:fixed;inset:0}
/* WebGL 유리(#glassGL)가 뜨면 큰 판은 제 backdrop-filter 를 내려놓는다 — 굴절한 지도가 밑에 이미 깔렸다.
   오른쪽 지도 단추(.grp)와 위·아래 넵바(.nav-top, .nav-bot)는 빼 둔다. 낮은 알약은 렌즈 베벨이
   면 전체를 덮어 왼쪽 패널과 달라지므로, 그 패널과 같은 물들임·CSS 흐림을 유지한다 */
:root[data-gl]{--rim:0 0 #0000}
:root[data-gl] :is(.glass,.banner,.typing,.play-sheet):not(.grp):not(.nav-top):not(.nav-bot){backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.glass{background-color:var(--mat);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-lg)}
kbd{font:inherit;font-size:.78em;font-weight:600;background:var(--fill);border-radius:5px;padding:1px 5px}
.maplibregl-ctrl-attrib{display:none}

/* ── 사이트 넵바: 왼쪽 판과 같은 두꺼운 유리. 물들임(--mat-thick)과 서린 흐림(--blur).
   알약이 낮아 렌즈 베벨이 면 전체를 덮으므로, WebGL 이 떠도 흐림은 걷지 않는다.
   가운데 맞춤은 줄(.nav-row)이 한다. 알약에 transform 을 두면 Safari 가 backdrop-filter 를 버린다 ── */
.nav-row{position:fixed;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.nav-row.is-top{top:var(--gap);z-index:4}
.nav-row.is-bot{bottom:var(--gap);z-index:3}
.nav-top,.nav-bot{pointer-events:auto}
.nav-top{display:flex;align-items:center;gap:2px;padding:4px 6px;border-radius:999px;background-color:var(--mat-thick);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-sm)}
.nav-top a{color:var(--label);text-decoration:none;font-weight:600;font-size:15px;padding:8px 12px;border-radius:999px}
.nav-top a:hover{background:var(--fill-2)}
.logo{font-size:20px!important;font-weight:700!important;letter-spacing:-.02em;padding:4px 10px!important}
.logo span{font-weight:400}
.logo i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);vertical-align:top;margin-top:4px}
.beta{font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--fill);color:var(--label-2)}

/* ── 홈: Apple 지도 길찾기 카드(맥·아이패드는 왼쪽 떠 있는 카드, 폰은 아래 시트) ── */
.panel{position:fixed;left:var(--gap);top:68px;bottom:var(--gap);width:360px;border-radius:var(--r-sheet);display:flex;flex-direction:column;z-index:3;overflow:hidden;background-color:var(--mat-thick)}
.panel-head{display:flex;align-items:center;gap:10px;padding:18px 16px 2px}
.round{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill);color:var(--label-2);display:flex;align-items:center;justify-content:center;flex:none}
.round svg{width:16px;height:16px}
.round[hidden]{display:none}
.panel-head h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.022em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-sub{margin:2px 16px 12px;font-size:13px;color:var(--label-2);min-height:18px}
.cards{flex:1;overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;scroll-snap-type:y proximity;overscroll-behavior:contain}
/* 경로 줄 — 고른 줄은 파란 테두리 + 옅은 파란 바탕(색만으로 가르지 않는다) */
.card{scroll-snap-align:start;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:var(--r-card);background:var(--mat-row);border:2px solid transparent;text-align:left;width:100%;
  box-shadow:var(--edge);transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease)}
.card[aria-checked=true]{background:color-mix(in srgb,var(--tint) 8%,var(--mat-row));border-color:var(--tint)}
.card .t{flex:1;min-width:0}
.card b{display:block;font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card .eta{display:block;margin-top:2px;font-size:13px;color:var(--label-2)}
.card .tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--fill-2);color:var(--label-2)}
.card[aria-checked=true] .tag{background:var(--tint);color:var(--on-tint)}
.go{width:68px;height:48px;border-radius:var(--r-ctl);border:0;background:color-mix(in srgb,var(--go) var(--tintmix),transparent);color:#fff;font-size:17px;font-weight:700;flex:none}
/* 구 목록 — 한 덩이 묶음 목록, 줄 사이는 머리카락 선 */
.cards:has(.gu){gap:0}
.gu{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 16px;background:var(--mat-row);border:0;width:100%;text-align:left;font-size:17px;font-weight:400}
.gu+.gu{box-shadow:inset 0 .5px 0 var(--sep)}
.gu:first-child{border-radius:var(--r-card) var(--r-card) 0 0}
.gu:last-child{border-radius:0 0 var(--r-card) var(--r-card)}
.gu:hover{background:color-mix(in srgb,var(--label) 4%,var(--mat-row))}
.gu small{font-size:15px;color:var(--label-2)}
.gu small::after{content:'›';margin-left:8px;color:var(--label-3);font-size:20px;line-height:0;vertical-align:-1px}
.gu[aria-current=true]{font-weight:600;color:var(--tint)}
.gu[aria-current=true] small::before{content:'✓ ';color:var(--tint)}
.pager{display:flex;justify-content:center;gap:8px;padding:6px 0}
.pager button{width:44px;height:32px;border:0;background:var(--fill-2);border-radius:999px;color:var(--label-2);display:flex;align-items:center;justify-content:center}
.pager svg{width:18px;height:18px}
.pager button:disabled{opacity:.35;cursor:default}
.hint{margin:0 16px 14px;font-size:12px;color:var(--label-2)}

/* 지도 단추 — Apple 지도 오른쪽 위 묶음: 44pt 칸, 파란 아이콘.
   왼쪽 패널(.panel)과 같은 리퀴드 글래스: 두꺼운 물들임(--mat-thick)과 CSS 흐림(--blur).
   .glass 의 얇은 물들임만 쓰면 지도 위에 거의 안 보이고, WebGL 렌즈는 이 크기에서 면 전체를 휜다 */
.ctl{position:fixed;right:var(--gap);top:var(--gap);display:flex;flex-direction:column;gap:10px;z-index:3}
.ctl .grp{border-radius:var(--r-ctl);overflow:hidden;display:flex;flex-direction:column;
  background-color:var(--mat-thick);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow-sm)}
.ctl button{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--tint)}
.ctl button:hover{background:var(--fill-2)}
.ctl button[aria-pressed=true]{background:var(--tint);color:var(--on-tint)}
.ctl .grp button+button{box-shadow:inset 0 .5px 0 var(--sep)}
.ctl svg{width:20px;height:20px}

/* 아래 막대 — 위 넵바와 같은 유리. 자리는 .nav-row.is-bot */
.nav-bot{display:flex;gap:4px;padding:5px;border-radius:999px;
  background-color:var(--mat-thick);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-sm)}
.nav-bot a,.nav-bot button{border:0;background:none;padding:10px 18px;border-radius:999px;color:var(--label);text-decoration:none;font-size:17px;font-weight:600}
.nav-bot a:hover{background:var(--fill-2)}
.nav-bot .is-play{background:color-mix(in srgb,var(--go) var(--tintmix),transparent);color:#fff;font-weight:700;padding:10px 26px}

/* 경로 말풍선 — Apple 지도 시간 꼬리표 */
.bubble{padding:5px 10px;border-radius:10px;font-weight:700;font-size:15px;line-height:1.15;white-space:nowrap;border:0;text-align:center;box-shadow:var(--shadow-sm)}
.bubble small{display:block;font-size:11px;font-weight:500;opacity:.85}
.bubble.on{background:var(--tint);color:var(--on-tint);box-shadow:var(--shadow-sm),0 0 0 2px var(--elev)}
.bubble.off{background:var(--elev);color:var(--label)}
/* 핀 — iOS 둥근 표지 + 꼬리, 흰 글리프 */
.pin{width:40px;height:52px;cursor:grab;color:var(--stop);filter:drop-shadow(0 4px 6px rgba(0,0,0,.28))}
.pin:active{cursor:grabbing}
.pin-tag{padding:3px 10px;border-radius:8px;background:var(--mat-thick);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--label);font-weight:600;font-size:13px;white-space:nowrap;margin-bottom:56px;pointer-events:none;box-shadow:var(--shadow-sm)}

/* ── 운전: Apple 지도 길 안내 ── */
.drive{display:none!important}
body.driving .drive{display:flex!important}
body.driving .home{display:none!important}
/* 위 안내판 — 어두운 재질, 흰 큰 거리 */
.banner{position:fixed;left:var(--gap);top:var(--gap);width:min(440px,calc(100vw - 2*var(--gap)));border-radius:var(--r-sheet);overflow:hidden;flex-direction:column;z-index:3;
  background:var(--mat-nav);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--nav-label);box-shadow:var(--shadow-lg)}
.banner .row{display:flex;align-items:center;gap:14px;padding:16px 18px}
.banner .arrow{width:56px;height:56px;flex:none}
.banner .dist{font-size:36px;line-height:1;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.banner .road{margin-top:4px;font-size:15px;color:var(--nav-label-2)}
.banner .street{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:24px;font-weight:700;letter-spacing:-.015em}
.shield{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 6px;border-radius:6px;background:var(--nav-label);color:#1c1c1e;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
/* '그다음' 줄 — 한 단 더 짙게 */
.banner .lanes{display:flex;gap:6px;align-items:center;padding:9px 18px;background:rgba(0,0,0,.28);font-size:13px;color:var(--nav-label-2);overflow:hidden}
.banner .lanes span{padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.1);white-space:nowrap}
.banner .lanes span:first-child{background:var(--nav-label);color:#1c1c1e;font-weight:700}
.pills{position:fixed;top:var(--gap);right:var(--gap);gap:8px;z-index:3}
.pill{height:44px;padding:0 18px;border-radius:999px;border:0;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-sm)}
.pill.stop{background:color-mix(in srgb,var(--stop) var(--tintmix),transparent);color:#fff}
.pill.stop kbd{background:rgba(255,255,255,.22)}
/* 아래 여정 카드 — 도착·시간·거리 세 칸 */
.trip{position:fixed;left:var(--gap);bottom:var(--gap);border-radius:var(--r-sheet);z-index:3;padding:12px 4px;background-color:var(--mat-thick)}
.trip div{padding:0 18px;text-align:center}
.trip div+div{box-shadow:inset .5px 0 0 var(--sep)}
.trip b{display:block;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.trip span{font-size:12px;color:var(--label-2)}
/* ── 타이핑 섹션 — 원래 맵(#play)의 하단 냅바 구조를 그대로 가져온다:
   순서형 큐(지난 동·지금 동·다음 동 하나씩). 가운데 이름이 입력창이고, 양옆은 이전·다음 지명만 둔다.
   뒤 흐림은 플레이 타이핑 줄과 같은 .backdrop-blur.bot 이다. */
.backdrop-blur{
  position:fixed; left:0; right:0; z-index:2;
  display:grid; pointer-events:none;
}
.backdrop-blur > span{grid-area:1/1}
.backdrop-blur > :nth-child(1){backdrop-filter:blur(calc(1px * var(--blur-k,.55)));-webkit-backdrop-filter:blur(calc(1px * var(--blur-k,.55)))}
.backdrop-blur > :nth-child(2){backdrop-filter:blur(calc(4px * var(--blur-k,.55)));-webkit-backdrop-filter:blur(calc(4px * var(--blur-k,.55)))}
.backdrop-blur > :nth-child(3){backdrop-filter:blur(calc(8px * var(--blur-k,.55)));-webkit-backdrop-filter:blur(calc(8px * var(--blur-k,.55)))}
.backdrop-blur > :nth-child(4){backdrop-filter:blur(calc(16px * var(--blur-k,.55)));-webkit-backdrop-filter:blur(calc(16px * var(--blur-k,.55)))}
.backdrop-blur > :nth-child(5){backdrop-filter:blur(calc(24px * var(--blur-k,.55)));-webkit-backdrop-filter:blur(calc(24px * var(--blur-k,.55)))}
.backdrop-blur > :nth-child(6){backdrop-filter:blur(calc(32px * var(--blur-k,.55)));-webkit-backdrop-filter:blur(calc(32px * var(--blur-k,.55)))}
.backdrop-blur.bot{
  top:auto; bottom:0;
  height:var(--blur-bot,160px);
  --fade-x:linear-gradient(90deg,
    transparent calc(50% - 400px),
    #000 calc(50% - 230px),
    #000 calc(50% + 230px),
    transparent calc(50% + 400px));
}
body.driving .backdrop-blur.bot.drive{display:grid!important}
.backdrop-blur.bot > span{
  -webkit-mask-composite:source-in;
  mask-composite:intersect;
}
.backdrop-blur.bot > :nth-child(1){-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 15%),var(--fade-x);mask-image:linear-gradient(180deg,transparent 0%,#000 15%),var(--fade-x)}
.backdrop-blur.bot > :nth-child(2){-webkit-mask-image:linear-gradient(180deg,transparent 5%,#000 30%),var(--fade-x);mask-image:linear-gradient(180deg,transparent 5%,#000 30%),var(--fade-x)}
.backdrop-blur.bot > :nth-child(3){-webkit-mask-image:linear-gradient(180deg,transparent 15%,#000 45%),var(--fade-x);mask-image:linear-gradient(180deg,transparent 15%,#000 45%),var(--fade-x)}
.backdrop-blur.bot > :nth-child(4){-webkit-mask-image:linear-gradient(180deg,transparent 30%,#000 60%),var(--fade-x);mask-image:linear-gradient(180deg,transparent 30%,#000 60%),var(--fade-x)}
.backdrop-blur.bot > :nth-child(5){-webkit-mask-image:linear-gradient(180deg,transparent 45%,#000 75%),var(--fade-x);mask-image:linear-gradient(180deg,transparent 45%,#000 75%),var(--fade-x)}
.backdrop-blur.bot > :nth-child(6){-webkit-mask-image:linear-gradient(180deg,transparent 60%,#000 90%),var(--fade-x);mask-image:linear-gradient(180deg,transparent 60%,#000 90%),var(--fade-x)}
.backdrop-blur.bot::after{
  content:""; grid-area:1/1;
  background:linear-gradient(0deg,color-mix(in srgb,var(--map-land) 34%,transparent) 60%,transparent);
  -webkit-mask-image:var(--fade-x);
  mask-image:var(--fade-x);
}
.play-sheet{
  position:fixed; left:50%; bottom:var(--gap); transform:translateX(-50%); z-index:3;
  flex-direction:column; align-items:center; width:max-content; max-width:calc(100vw - 2*var(--gap));
}
.typing{
  position:relative; cursor:text;
  display:flex; align-items:center; justify-content:space-between; gap:24px;
  width:fit-content; min-width:min(403px, 100%); max-width:100%;
  min-height:75px; padding:8px 0; margin:0 auto 6px;
  border-radius:31px; user-select:none; -webkit-user-select:none;
  background:var(--mat-thick);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-lg);
}
.q-side{
  flex:0 0 auto; min-width:97px; display:flex; flex-direction:column; gap:0;
  padding:0 30px; pointer-events:none;
}
.q-side.is-prev{align-items:flex-start}
.q-side.is-next{align-items:flex-end}
.q-name{
  font-weight:700; font-size:24px; line-height:1.2; color:var(--label-2);
}
.q-letters{
  display:flex; justify-content:center; gap:2px;
  font-weight:800; font-size:min(52px, calc((100vw - 112px) / var(--n, 4))); letter-spacing:-.01em; line-height:1.15;
}
.q-letters b{flex:none; position:relative; white-space:pre}
/* 안 친 글자는 흐리게, 맞게 친 글자는 본문색으로 밝아지고, 틀린 글자는 빨강 + 밑줄, 넘쳐 친 글자는 짙은 빨강 */
.typing b{
  color:color-mix(in srgb,var(--label) 40%,transparent);
  transition:color .1s var(--ease);
}
.typing b.on,
.typing b.ing{color:var(--label)}
.typing b.err,
.typing.bad b.ing{color:var(--stop)}
.typing b.over{color:color-mix(in srgb,var(--stop) 62%,#000)}
.typing b.err,
.typing b.over{text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.1em}
:root[data-night] .typing b.over{color:color-mix(in srgb,var(--stop) 70%,var(--map-land))}
.typing.hide b:not(.on):not(.ing){
  color:transparent;
  background:color-mix(in srgb,var(--label-2) 22%,transparent);
  border-radius:4px;
}
/* 타이핑 커서 — 글자 사이를 미끄러지는 막대 하나 */
.typing .caret{
  position:absolute; left:0; top:0; width:3px; border-radius:2px; pointer-events:none;
  background:var(--brand); transition:transform .1s linear;
}
.typing .caret.idle{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.typing.off .q-letters{opacity:.55}
.typing.off .caret{display:none}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.typing.miss{animation:shake .3s}
/* 원래 입력창은 화면에서 뺀다. display:none 이면 포커스가 안 잡혀 IME 가 죽는다 */
.typebar{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0;padding:0}
#typein{width:1px;height:1px;padding:0;border:0;box-shadow:none;font-size:16px}
.fact{text-align:center;min-height:1.4em;background:none;padding:0}
.fact span{color:var(--label-2);font-size:17px;font-weight:500}
.fact:is(:empty,:has(> span:empty)){display:none}
/* 내 차 — 흰 원판 위 파란 화살(내비 퍽) */
.car{width:64px;height:64px;color:var(--map-route)}
.car svg{width:100%;height:100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.3))}
.done{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
.done.on{display:flex}
.done .box{border-radius:28px;padding:28px 28px 20px;text-align:center;min-width:300px;background-color:var(--mat-thick)}
.done h2{margin:0 0 6px;font-size:28px;font-weight:700;letter-spacing:-.02em}
.done p{margin:0;color:var(--label-2);font-variant-numeric:tabular-nums}
.done .pill{margin:20px auto 0;width:100%;justify-content:center;background:color-mix(in srgb,var(--tint) var(--tintmix),transparent);color:var(--on-tint);font-weight:700;box-shadow:none}
.attrib{position:fixed;right:var(--gap);bottom:4px;margin:0;font-size:11px;color:var(--label-2);z-index:2}
.attrib a{color:inherit}
.toast{position:fixed;left:50%;top:68px;transform:translateX(-50%);z-index:5;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;display:none}
.toast.on{display:block}

/* 폰 갈림은 pointer:coarse (CLAUDE.md). 좁은 데스크톱 창도 같은 배치로 접어 겹치지 않게만 한다 */
@media (pointer:coarse),(max-width:760px){
  :root{--gap:8px;--r-sheet:28px}
  .nav-top .side{display:none}
  /* 아래 시트 + 손잡이 */
  .panel{top:auto;left:var(--gap);right:var(--gap);width:auto;height:44vh;bottom:calc(72px + env(safe-area-inset-bottom))}
  .panel::before{content:'';width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:6px auto 0;flex:none}
  .panel-head{padding-top:8px}
  .ctl{top:60px}
  .nav-row.is-bot{bottom:calc(var(--gap) + env(safe-area-inset-bottom))}
  .nav-bot a,.nav-bot button{font-size:16px;padding:10px 16px}
  .hint{display:none}
  .banner .dist{font-size:30px}.banner .arrow{width:44px;height:44px}.banner .street{font-size:20px}
  .pills{top:auto;bottom:calc(190px + env(safe-area-inset-bottom))}
  .trip{left:var(--gap);right:var(--gap);bottom:calc(104px + env(safe-area-inset-bottom));justify-content:space-around}
  .backdrop-blur{display:none}
  body.driving .backdrop-blur.bot.drive{display:none!important}
  .play-sheet{
    left:12px;right:12px;transform:none;width:auto;max-width:none;gap:2px;
    bottom:calc(8px + env(safe-area-inset-bottom,0px));
    padding:8px 22px;border-radius:999px;
    background:var(--mat-thick);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow-lg);
  }
  .typing{min-width:0;width:100%;gap:0;min-height:0;padding:4px 0;margin:0;border-radius:0;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
  .q-side{flex:1 1 0;min-width:0;padding:0 6px}
  .q-name{max-width:100%;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .q-letters{flex:none;font-size:min(40px,calc((100vw - 112px) / var(--n, 4)))}
  .fact{min-height:1.4em;padding:0 8px;line-height:1.4}
  .fact span{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .attrib{display:none}
}
@media (prefers-reduced-motion:reduce){
  .typing b,.typing .caret,.card,button{transition:none}
  .typing .caret.idle,.typing.miss{animation:none}
  button:active:not(:disabled){transform:none}
}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE=matchMedia('(pointer:coarse),(max-width:760px)').matches;   // 배치만 접는다
const DATA='../../data/';
/* 사이트 야간 설정을 그대로 따른다(app.js 의 rt.opt) */
try{document.documentElement.toggleAttribute('data-night',!!JSON.parse(localStorage.getItem('rt.opt')||'{}').night)}catch(e){}
/* 지도 칠은 CSS 의 --map-* 토큰에서 읽는다 — 색을 여기 적지 않는다 */
const T=n=>getComputedStyle(document.documentElement).getPropertyValue('--map-'+n).trim();
/* 설정은 settings/index.html 이 쓴다. 키와 기본값을 저쪽과 맞춘다 */
const NAV=(()=>{const d={pitch:62,zoom:16.8,speed:'normal',glass:85,sheen:100,lens:100};
  try{return {...d,...JSON.parse(localStorage.getItem('rt-nav3d')||'{}')}}catch{return d}})();
const PACE={slow:2,normal:1.4,fast:.8}[NAV.speed]||1.4;   // 1 m 에 몇 ms. 하한·상한으로 자르지 않는다
/* 두벌식 키로 푼다(app.js 의 jamo). 조합 중인 '강ㅅ' 도 목표의 앞머리로 읽히게 한다 */
const JUNG='ㅏ ㅐ ㅑ ㅒ ㅓ ㅔ ㅕ ㅖ ㅗ ㅗㅏ ㅗㅐ ㅗㅣ ㅛ ㅜ ㅜㅓ ㅜㅔ ㅜㅣ ㅠ ㅡ ㅡㅣ ㅣ'.split(' ');
const JONG=[''].concat('ㄱ ㄲ ㄱㅅ ㄴ ㄴㅈ ㄴㅎ ㄷ ㄹ ㄹㄱ ㄹㅁ ㄹㅂ ㄹㅅ ㄹㅌ ㄹㅍ ㄹㅎ ㅁ ㅂ ㅂㅅ ㅅ ㅆ ㅇ ㅈ ㅊ ㅋ ㅌ ㅍ ㅎ'.split(' '));
const PAIR={ㅘ:'ㅗㅏ',ㅙ:'ㅗㅐ',ㅚ:'ㅗㅣ',ㅝ:'ㅜㅓ',ㅞ:'ㅜㅔ',ㅟ:'ㅜㅣ',ㅢ:'ㅡㅣ',ㄳ:'ㄱㅅ',ㄵ:'ㄴㅈ',ㄶ:'ㄶ',ㄺ:'ㄹㄱ',ㄻ:'ㄹㅁ',ㄼ:'ㄹㅂ',ㄽ:'ㄹㅅ',ㄾ:'ㄹㅌ',ㄿ:'ㄹㅍ',ㅀ:'ㄹㅎ',ㅄ:'ㅂㅅ'};
const jamo=s=>[...s.normalize('NFC')].map(ch=>{const c=ch.charCodeAt(0)-0xAC00;
  return c<0||c>=11172?PAIR[ch]||ch:'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'[Math.floor(c/588)]+JUNG[Math.floor(c%588/28)]+JONG[c%28]}).join('');

const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',
  center:[126.98,37.56],zoom:11,attributionControl:false,maxPitch:70,dragRotate:true});
/* 리퀴드 글래스 — 유리 뒤는 늘 MapLibre 의 WebGL 캔버스다. 그래서 html2canvas 같은 화면 베끼기 없이
   지도 캔버스를 그대로 텍스처로 받아, 지도 바로 위에 깐 캔버스 한 장(#glassGL)에 유리 판마다
   굴절한 지도를 그린다. 사파리·파이어폭스도 똑같이 휜다 — SVG backdrop-filter 굴절은 크로미움만 그렸다.
   한 판의 결(kube.io · ybouane/liquidglass · EMIT 글에서 모은 값):
   - 굴절: 가장자리 베벨(최대 28px)을 볼록 스퀘어클 y=(1-(1-x)^4)^¼ 유리로 보고, 곧게 내리는 빛이
     스넬 법칙(1 → 1.5)으로 꺾인 만큼 지도를 안쪽에서 끌어온다. 가운데는 평평해 1:1 이다
   - 분산: R·B 를 법선 따라 반대로 조금씩(굴절의 5%) 어긋나게 집는다
   - 채도 180% · 밝기 1.08 — 흐림이 없어도 유리 너머 색이 산다. 흐림은 없다
   - 프레넬: 베벨이 가팔라질수록(법선이 누울수록) 흰빛으로 10% 까지 밝힌다
   - 빛테: -60° 빛을 받는 테두리 2.5px
   물들임(--mat)·그림자는 그 위 DOM 판이 그린다. 빛테는 여기 한 줄뿐이다(CSS --rim 은 걷힌다).
   지도 버퍼는 그린 뒤 비워지니(preserveDrawingBuffer 없음) 'render' 이벤트 안에서 같은 박자로 받아 두고,
   DOM 만 바뀔 때는 받아 둔 텍스처로 다시 그린다 */
(()=>{
  const root=document.documentElement,k=NAV.lens/100;
  /* .grp 와 위·아래 넵바는 CSS 흐림을 유지하므로 렌즈 패스에서 뺀다 */
  const els=[...document.querySelectorAll('.glass,.banner,.typing,.play-sheet')].filter(el=>!el.matches('.grp,.nav-top,.nav-bot')&&getComputedStyle(el).backdropFilter!=='none');
  const cv=document.createElement('canvas'),gl=k>0&&!matchMedia('(prefers-reduced-transparency:reduce),(prefers-contrast:more)').matches
    &&cv.getContext('webgl',{premultipliedAlpha:true,antialias:false});
  /* 굴절을 못 그리면 맑은 판 위 글자가 안 읽힌다 — 서린 유리(--blur)로 물러나고 물들임도 .55 밑으로 내리지 않는다 */
  const tint=on=>root.style.setProperty('--ga',on?1-NAV.glass/100:Math.max(.55,1-NAV.glass/100));
  root.style.setProperty('--sk',NAV.sheen/100);
  tint(false);
  if(!gl)return;
  const sh=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s};
  const pg=gl.createProgram();
  gl.attachShader(pg,sh(gl.VERTEX_SHADER,'attribute vec2 a;uniform vec4 R;uniform vec2 S;void main(){gl_Position=vec4((R.xy+a*R.zw)/S*2.-1.,0.,1.);}'));
  gl.attachShader(pg,sh(gl.FRAGMENT_SHADER,`precision highp float;
uniform sampler2D T;uniform vec2 S;uniform vec4 R;uniform float rad,B,K,SP,D;
float sd(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return min(max(q.x,q.y),0.)+length(max(q,0.))-r;}
void main(){
  vec2 b=R.zw*.5,p=gl_FragCoord.xy-R.xy-b;float d=sd(p,b,rad);
  float a=clamp(.5-d,0.,1.);if(a<=0.)discard;
  float gr=min(max(rad,B),min(b.x,b.y));vec2 e=vec2(1.,0.);
  vec2 g=vec2(sd(p+e,b,gr)-sd(p-e,b,gr),sd(p+e.yx,b,gr)-sd(p-e.yx,b,gr));g/=max(length(g),1e-4);
  float t=max(-d,0.)/B,off=0.,fr=0.;
  if(t<1.){float x=max(t,1e-3),m=1.-pow(1.-x,4.),f=pow(m,.25),s=pow(1.-x,3.)*pow(m,-.75),ai=atan(s);
    off=B*(.3+f)*tan(ai-asin(sin(ai)/1.5))*K;fr=pow(1.-inversesqrt(1.+s*s),4.);}
  vec2 uv=(gl_FragCoord.xy-g*off)/S,cd=g*off*.05/S;
  vec3 c=vec3(texture2D(T,uv+cd).r,texture2D(T,uv).g,texture2D(T,uv-cd).b);
  c=clamp(mix(vec3(dot(c,vec3(.2126,.7152,.0722))),c,1.8)*1.08,0.,1.);
  c=mix(c,vec3(1.),fr*.1*SP);
  c=mix(c,vec3(1.),smoothstep(2.5*D,0.,-d)*abs(dot(g,vec2(.5,.866)))*.5*SP);
  gl_FragColor=vec4(c*a,a);
}`));
  gl.bindAttribLocation(pg,0,'a');gl.linkProgram(pg);
  if(!gl.getProgramParameter(pg,gl.LINK_STATUS))return;
  gl.useProgram(pg);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  const U={};for(const n of ['T','S','R','rad','B','K','SP','D'])U[n]=gl.getUniformLocation(pg,n);
  const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  for(const [p,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,p,v);
  gl.uniform1f(U.K,k);gl.uniform1f(U.SP,NAV.sheen/100);
  cv.id='glassGL';cv.setAttribute('aria-hidden','true');
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none';
  $('map').after(cv);
  let ready=false,raf=0,dpr=1;
  function size(){dpr=devicePixelRatio||1;cv.width=Math.round(innerWidth*dpr);cv.height=Math.round(innerHeight*dpr)}
  function draw(){
    raf=0;if(!ready)return;
    gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U.S,cv.width,cv.height);gl.uniform1f(U.D,dpr);
    for(const el of els){
      const r=el.getBoundingClientRect();if(!r.width||!r.height)continue;
      const w=r.width*dpr,h=r.height*dpr,rad=Math.min((parseFloat(getComputedStyle(el).borderTopLeftRadius)||0)*dpr,w/2,h/2);

      gl.uniform1f(U.rad,rad);gl.uniform1f(U.B,Math.max(2,Math.min(28*dpr,Math.min(w,h)/2-dpr)));

  }
  const soon=()=>{if(!raf)raf=requestAnimationFrame(draw)};
  map.on('render',()=>{
    try{gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,map.getCanvas())}catch{return}
    if(!ready){ready=true;root.dataset.gl='';tint(true)}
    draw();
  });
  size();
  addEventListener('resize',()=>{size();soon()});
  const ro=new ResizeObserver(soon);els.forEach(el=>ro.observe(el));
  new MutationObserver(soon).observe(document.body,{attributes:true,attributeFilter:['class']});
  /* 탭을 뒤로 보내면 iOS 가 컨텍스트를 거둔다 — 서린 유리로 물러난다 */
  cv.addEventListener('webglcontextlost',()=>{cv.remove();delete root.dataset.gl;tint(false)});
})();

let index=[], slug=null, dongs=[], routes=[], sel=0, view='list', pin, pinTag, bubbles=[], run=null, planSeq=0;

/* ── 바탕: OSM 이름을 한국어로, 칠은 Apple 지도 결(--map-*)로 ── */
function tame(){
  for(const l of map.getStyle().layers){
    try{
      const id=l.id;
      if(l.type==='symbol'&&map.getLayoutProperty(id,'text-field')){
        map.setLayoutProperty(id,'text-field',['coalesce',['get','name:ko'],['get','name']]);
        map.setPaintProperty(id,'text-color',T(/road|highway|street/.test(id)?'label-2':'label'));
        map.setPaintProperty(id,'text-halo-color',T('halo'));
        map.setPaintProperty(id,'text-halo-width',1.4);
      }
      if((l.type==='symbol'&&/poi/.test(id))||l.type==='raster') map.setLayoutProperty(id,'visibility','none');   // 저배율 위성 래스터는 Apple 의 평평한 땅과 안 맞는다
      if(l.type==='fill'&&/^aeroway/.test(id)) map.setPaintProperty(id,'fill-color',T('bldg-lo'));
      if(l.type==='fill'&&id==='building') map.setPaintProperty(id,'fill-color',T('bldg-lo'));
      if(l.type==='background') map.setPaintProperty(id,'background-color',T('land'));
      if(l.type==='fill'&&/^water/.test(id)) map.setPaintProperty(id,'fill-color',T('water'));
      if(l.type==='line'&&/^water/.test(id)) map.setPaintProperty(id,'line-color',T('water'));
      if(l.type==='fill'&&/park|wood|grass|landcover|landuse/.test(id)){
        map.setPaintProperty(id,'fill-color',/park|wood|grass/.test(id)?T('park'):T('land'));map.setPaintProperty(id,'fill-opacity',1);
      }
      if(l.type==='line'&&/^(road|highway|bridge|tunnel)/.test(id)&&!/rail|path|pier|area/.test(id)){
        const hwy=/motorway/.test(id),cs=/casing/.test(id);
        map.setPaintProperty(id,'line-color',T((hwy?'hwy':'road')+(cs?'-case':'')));
      }
      if(l.type==='fill-extrusion'){
        map.setPaintProperty(id,'fill-extrusion-color',['interpolate',['linear'],['coalesce',['get','render_height'],8],0,T('bldg-lo'),120,T('bldg-hi')]);
        map.setPaintProperty(id,'fill-extrusion-opacity',.9);
      }
    }catch(e){}
  }
}

const norm=s=>s.replace(/[\s·,.\-]/g,'');
const mins=s=>Math.max(1,Math.round(s/60))+'분';
const km=m=>(m/1000).toFixed(1);
const fc=list=>({type:'FeatureCollection',features:list.map((d,i)=>({type:'Feature',
  properties:{name:d.name,own:d.own?1:0,tgt:d.tgt?1:0},geometry:d.geometry}))});
const pts=list=>({type:'FeatureCollection',features:list.map((d,i)=>({type:'Feature',
  properties:{name:(d.own?'✓ ':'')+d.name,own:d.own?1:0,tgt:d.tgt?1:0},geometry:{type:'Point',coordinates:d.c}}))});
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3200)}

/* ── 코스: 핀을 놓은 동에서 출발하는 세 갈래 ── */
function nearest(from,list){
  const left=[...list],out=[];let cur=from;
  while(left.length){let bi=0,bd=1e9;
    left.forEach((d,i)=>{const dx=(d.c[0]-cur.c[0])*88,dy=(d.c[1]-cur.c[1])*111,q=dx*dx+dy*dy;if(q<bd){bd=q;bi=i}});
    cur=left.splice(bi,1)[0];out.push(cur)}
  return out;
}
function variants(s){
  const k=dongs.indexOf(s);
  return [
    {name:'코스 순서',tag:'추천',order:[...dongs.slice(k),...dongs.slice(0,k)]},
    {name:'가까운 동부터',tag:'짧은 길',order:[s,...nearest(s,dongs.filter(d=>d!==s))]},
    {name:'거꾸로 돌기',tag:'반대로',order:[s,...dongs.slice(0,k).reverse(),...dongs.slice(k+1).reverse()]},
  ];
}
/* 동 중심을 곧게 잇는 길. 길 서버를 기다리는 동안의 미리보기이자, 서버가 안 될 때의 대신이다 */
const straight=order=>({geom:order.map(d=>d.c),dist:0,dur:0,fallback:true,legs:order.slice(1).map((d,i)=>({dist:0,steps:[],coords:[order[i].c,d.c]}))});
const routeCache=new Map();   // 같은 순서는 다시 묻지 않는다
function route(order){
  const url='https://router.project-osrm.org/route/v1/driving/'+order.map(d=>d.c.join(',')).join(';')+'?overview=full&geometries=geojson&steps=true';
  if(!routeCache.has(url))routeCache.set(url,(async()=>{
    try{
      /* 공개 데모 서버라 가끔 한참 걸린다 — 6초 넘으면 곧은 길로 놀게 한다 */
      const j=await (await fetch(url,{signal:AbortSignal.timeout(6000)})).json();if(j.code!=='Ok')throw 0;
      const r=j.routes[0];
      return {geom:r.geometry.coordinates,dist:r.distance,dur:r.duration,
        legs:r.legs.map(l=>({dist:l.distance,steps:l.steps,coords:l.steps.flatMap(s=>s.geometry.coordinates)}))};
    }catch(e){routeCache.delete(url);return straight(order)}
  })());
  return routeCache.get(url);
}

/* ── 패널: 구 목록 → 경로 카드 ── */
function showList(){
  view='list';$('back').hidden=true;$('ttl').textContent='어느 구를 달릴까요';
  $('sub').textContent='서울 25개 구 · 행정동 코스';

    b.setAttribute('aria-current',m.slug===slug);

    b.onclick=()=>load(m.slug);box.appendChild(b);
  });
  clearRoutes();
  if(pin){pin.remove();pinTag.remove();pin=null}
  setDongs([]);guVis('visible');
  map.easeTo({center:[126.985,37.56],zoom:COARSE?10:10.6,pitch:0,bearing:0,padding:pad(),duration:RM?0:700});

function pad(){return COARSE?{left:44,right:76,top:80,bottom:innerHeight*.6}:{left:400,right:96,top:96,bottom:96}}

async function load(s){
  slug=s;history.replaceState(null,'','?c='+s);
  const gj=await (await fetch(DATA+s+'.drive.json')).json();
  dongs=gj.features.map(f=>({name:f.properties.name,c:f.properties.c,geometry:f.geometry}));
  view='routes';$('back').hidden=false;
  guVis('none');
  setDongs(dongs);
  fit();
  placePin(dongs[0]);
  await plan(dongs[0]);
}
/* ── 구 고르는 지도: 25개 구를 다 띄운다. 구 경계는 따로 없으니 각 구의 행정동 경계에서 두 동이 함께 쓰는 변을 지워 얻는다 ── */
const GU_LAYERS=['gu-fill','gu-hov','gu-line','gu-label'];
let guHov=null;
function guVis(v){GU_LAYERS.forEach(id=>map.getLayer(id)&&map.setLayoutProperty(id,'visibility',v))}
async function drawGus(){
  const all=await Promise.all(index.map(m=>fetch(DATA+m.slug+'.drive.json').then(r=>r.json()).catch(()=>null)));
  const fills=[],edges=[];
  all.forEach((gj,k)=>{
    if(!gj)return;const slug=index[k].slug,seen=new Map();
    gj.features.forEach(f=>{
      fills.push({type:'Feature',properties:{slug},geometry:f.geometry});
      const g=f.geometry,polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;
      polys.forEach(poly=>poly.forEach(r=>{for(let i=1;i<r.length;i++){
        const a=r[i-1]+'',b=r[i]+'',key=a<b?a+';'+b:b+';'+a;
        seen.has(key)?seen.delete(key):seen.set(key,[r[i-1],r[i]]);
      }}));
    });
    edges.push({type:'Feature',properties:{slug},geometry:{type:'MultiLineString',coordinates:[...seen.values()]}});
  });
  map.getSource('gus').setData({type:'FeatureCollection',features:fills});
  map.getSource('gu-edge').setData({type:'FeatureCollection',features:edges});
  map.getSource('gu-pts').setData({type:'FeatureCollection',features:index.map(m=>({type:'Feature',
    properties:{slug:m.slug,name:m.title.split(' ')[0]},geometry:{type:'Point',coordinates:m.c}}))});
}
function setDongs(list){map.getSource('dongs').setData(fc(list));map.getSource('dong-pts').setData(pts(list))}
function fit(){
  if(!dongs.length)return;const b=new maplibregl.LngLatBounds();dongs.forEach(d=>b.extend(d.c));
  map.fitBounds(b,{padding:pad(),pitch:map.getPitch(),bearing:map.getBearing(),duration:RM?0:900,maxZoom:15});
}
function placePin(d){
  if(!pin){
    const el=document.createElement('div');el.className='pin';el.tabIndex=0;el.setAttribute('role','button');
    el.setAttribute('aria-label','플레이 핀 — 방향키로 옆 동으로 옮깁니다');
    el.innerHTML='<svg viewBox="0 0 40 52" width="40" height="52" aria-hidden="true"><path d="M20 51l-6-10h12z" fill="currentColor"/><circle cx="20" cy="20" r="18" fill="currentColor" stroke="#fff" stroke-width="2.5"/><path d="M15 11v18M15 12h11l-3 4 3 4H15" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>';
    pin=new maplibregl.Marker({element:el,anchor:'bottom',draggable:true}).setLngLat(d.c).addTo(map);
    const t=document.createElement('div');t.className='pin-tag';
    pinTag=new maplibregl.Marker({element:t,anchor:'bottom'}).setLngLat(d.c).addTo(map);
    pin.on('drag',()=>{const h=dongAt(pin.getLngLat());t.textContent=h?h.name:'코스 밖';pinTag.setLngLat(pin.getLngLat())});
    pin.on('dragend',()=>{const h=dongAt(pin.getLngLat());if(!h){toast('코스 안의 동에 놓아 주세요');return placePin(pin._d)}placePin(h);plan(h)});
    el.addEventListener('keydown',e=>{
      const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key];if(!dir)return;
      e.preventDefault();e.stopPropagation();
      const cur=pin._d;let best=null,bd=1e9;
      dongs.forEach(o=>{if(o===cur)return;const dx=(o.c[0]-cur.c[0])*88,dy=(o.c[1]-cur.c[1])*111;
        const along=dx*dir[0]+dy*dir[1];if(along<=0)return;const q=dx*dx+dy*dy+Math.abs(dx*dir[1]-dy*dir[0])*4;if(q<bd){bd=q;best=o}});
      if(best){placePin(best);plan(best)}
    });
  }
  pin._d=d;pin.setLngLat(d.c);pinTag.setLngLat(d.c);pinTag.getElement().textContent=d.name;
}
function dongAt(ll){
  const f=map.queryRenderedFeatures(map.project(ll),{layers:['dong-fill','dong-tgt']})[0];
  return f&&dongs.find(d=>d.name===f.properties.name);
}

async function plan(s){
  const my=++planSeq;
  $('ttl').textContent=s.name+'에서 출발';
  $('sub').textContent='실제 도로로 길을 찾는 중…';
  const vs=variants(s);
  /* 곧은 길로 먼저 띄우고, 실제 도로가 오면 바꿔 낀다 */
  routes=vs.map(v=>({...straight(v.order),...v,pending:true}));sel=0;drawRoutes();renderCards();
  const rs=await Promise.all(vs.map(v=>route(v.order)));
  if(my!==planSeq||view!=='routes'||run)return;
  const focused=$('cards').contains(document.activeElement);
  routes=rs.map((r,i)=>({...r,...vs[i]}));
  $('sub').textContent=routes[0].fallback?'길 서버에 닿지 않아 동 사이를 곧게 잇습니다':`${index.find(m=>m.slug===slug)?.title||''} · 실제 도로 경로`;
  drawRoutes();renderCards();
  if(focused)document.querySelectorAll('.card')[sel]?.focus({preventScroll:true});
}
/* 길은 선이 아니라 점이다. 20 m 마다 하나를 찍고, 멀리서 보면 넷째·열여섯째 점만 남겨 화면 위 간격을 비슷하게 둔다.
   점마다 길 위 위치(u, 0~1)를 들고 있어, 띄울 때 출발점부터 물결(waveT)이 지나가며 부풀었다 가라앉고,
   달릴 때는 지나온 만큼(passed)만 진하게 칠한다 */
const DOT=20, LV=[{k:16,max:13},{k:4,min:13,max:15.5},{k:1,min:15.5}], SWELL=.07;
let waveT=1+SWELL, waveRaf=0, passed=-1;
const lvIds=i=>LV.map((_,l)=>'r'+i+'-'+l);
/* 점은 원이 아니라 벌집 칸 같은 육각형이다. 색을 갈아 칠하도록 거리장(SDF) 그림으로 한 번 만들어 둔다 —
   한 변까지의 거리를 알파에 담고, 가장자리를 .75 에 맞춘다. 그림 64px 에 반지름 24px, 화면에서는 반지름 12px */
const HEX_R=12;
function hexImage(){
  const n=64,c=n/2,r=HEX_R*2,d=new Uint8ClampedArray(n*n*4),ap=r*Math.sqrt(3)/2;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const px=Math.abs(x+.5-c),py=Math.abs(y+.5-c);   // 꼭짓점이 위아래인 육각형
    const inside=ap-Math.max(px,px*.5+py*Math.sqrt(3)/2);
    d[(y*n+x)*4+3]=Math.max(0,Math.min(255,(.75+inside/32)*255));
  }
  return {width:n,height:n,data:d};
}
function dotsOf(geom){
  const seg=[];let tot=0;
  for(let i=1;i<geom.length;i++){const d=hav(geom[i-1],geom[i]);seg.push(d);tot+=d}
  const out=[];let n=0,i=0,base=0;
  for(let at=0;at<=tot;at+=DOT,n++){

const ARROWS={straight:'M12 21V5M6 11l6-6 6 6',right:'M7 21v-9a3 3 0 0 1 3-3h9M15 5l4 4-4 4','slight right':'M9 21v-8l8-8M11 5h6v6','sharp right':'M7 21V9a3 3 0 0 1 3-3h9M15 2l4 4-4 4',

/* 직전 동의 끝 음절이 조합이 끝나며 빈 칸에 다시 들어온다. 지금 이름의 앞머리가 아니면 떼어 낸다 */

/* 지금까지 친 것을 그대로 보여준다(app.js 의 paintTyped). 맞은 글자는 색이 차고, 조합 중인 자모도 그대로 뜬다.

let caretIdle=0;

function tick(){

/* 한 구간의 좌표와 길이. 같은 구간은 다시 재지 않는다 */
function legGeom(leg){
  if(leg._geom)return leg._geom;
  const p=leg.coords,seg=[];let tot=0;
  for(let i=1;i<p.length;i++){const d=hav(p[i-1],p[i]);seg.push(d);tot+=d}
  leg._geom={p,seg,tot};
  return leg._geom;

function pointAt(g,dist){
  let want=dist,i=0;
  while(i<g.seg.length-1&&want>g.seg[i]){want-=g.seg[i];i++}
  const a=g.p[i],b=g.p[i+1]||a;
  return {a,b,u:g.seg[i]?Math.min(1,want/g.seg[i]):1};
}
/* 줄 서 있는 구간들을 이어 along 에서 ahead m 앞의 점. 줄 끝에서 멈춘다 */
function routeAt(along,ahead){
  let d=along+ahead;
  for(let i=0;i<run.queue.length;i++){
    const g=legGeom(run.r.legs[run.queue[i]]);
    if(d<=g.tot||i===run.queue.length-1){const {a,b,u}=pointAt(g,Math.min(d,g.tot));return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u]}
    d-=g.tot;
  }

/* 바로 밑 토막이 아니라 앞쪽 점을 겨눠, 시간으로 부드럽게 돈다.
   차는 코앞을 보고 빨리, 지도는 더 멀리 보고 먼저·천천히 돈다 — 모퉁이 전에 화면이 돌아 차가 옆으로 미끄러져 보이지 않는다 */
const LOOK=12;   // m. 여기에 빠르기 × 시간(차 0.05초, 지도 0.25초)을 더 내다본다
function steer(along,v,dt){
  const q=routeAt(along,0),k=tau=>RM?1:1-Math.exp(-dt/tau);
  const turn=(cur,p,tau)=>hav(q,p)<3?cur:cur+(((bearing(q,p)-cur+540)%360)-180)*k(tau);
  run.carBrg=turn(run.carBrg,routeAt(along,LOOK+v*50),60);
  run.brg=turn(run.brg,routeAt(along,LOOK*2+v*250),180);
  return q;
}
/* 맞춰 둔 동까지 차를 보낸다. 앞서 친 동이 많을수록 그 배수로 빨라지고,
   이동 시간에 하한·상한을 두지 않는다. 차는 도착 전에도 다음 이름을 받는다 */
function chase(){
  if(!run||run.driving||run.done||!run.queue.length)return;
  run.driving=true;
  const gen=++run.gen;
  let along=0,last=performance.now();
  const metersLeft=()=>{
    let m=0;
    for(let i=0;i<run.queue.length;i++){
      const tot=legGeom(run.r.legs[run.queue[i]]).tot;
      m+=i?tot:Math.max(0,tot-along);
    }
    return m;
  };
  const frame=now=>{
    if(!run||run.done||gen!==run.gen)return;
    const dt=Math.min(100,now-last);last=now;
    const ahead=run.queue.length,remain=metersLeft();
    let budget;
    if(RM)budget=1e12;
    else{
      /* 한 곳만 앞서 있으면 설정 빠르기 그대로. 여러 곳을 미리 치면 그 거리를 0.9초 안에 따라잡는다 */
      if(ahead>1&&ahead>(run.rushN||0)){run.rush=now+900;run.rushN=ahead}
      if(run.rush&&now<run.rush){
        const timeLeft=Math.max(dt,run.rush-now);
        budget=Math.max(dt/PACE,remain*(dt/timeLeft));
      }else{
        run.rush=0;run.rushN=0;
        budget=(dt/PACE)*Math.max(1,ahead);
      }
    }
    const moved=budget;
    while(budget>0&&run.queue.length){
      const g=legGeom(run.r.legs[run.queue[0]]);
      const left=Math.max(0,g.tot-along);
      if(g.tot<=0||budget>=left){
        budget-=left;
        const end=g.p[g.p.length-1];
        if(end){
          run.car.setLngLat(end);
          map.jumpTo({center:end});
        }
        run.dist+=g.tot;
        const reached=run.queue.shift()+1;
        run.r.order[reached].own=true;run.at=reached;
        setDongs(run.r.order);
        along=0;
        $('km').textContent=km(run.dist);
        setPassed(run.tot?run.dist/run.tot:1);
        if(run.at>=run.r.order.length-1){run.driving=false;finish();return}
        continue;
      }
      along+=budget;budget=0;
      const q=steer(along,moved/dt,dt);
      run.car.setLngLat(q).setRotation(run.carBrg);
      map.jumpTo({center:q,bearing:run.brg});
      $('km').textContent=km(run.dist+along);
      if(run.tot)setPassed((run.dist+along)/run.tot);
    }
    if(run.queue.length)requestAnimationFrame(frame);
    else{run.driving=false;run.rush=0;run.rushN=0}
  };

}
function finish(){

  $('doneP').textContent=`${run.r.order.length}곳 · ${km(run.dist)} km · ${Math.floor(s/60)}분 ${s%60}초`;

function tryType(composing=false,forced=false){

     차가 이전 동으로 가는 중에도 다음 이름은 바로 받는다 */
  const spaced=forced||(/\s/.test(raw)&&!composing);
  if(!spaced){

/* 이름을 다 쳐도 스페이스 전에는 달리지 않는다. 조합 중 스페이스는 IME 에 맡기고, 떼는 순간에만 확정한다 */

const markFocus=()=>$('typing').classList.toggle('off',document.activeElement!==$('typein'));

$('typein').addEventListener('blur',markFocus);
$('typing').addEventListener('pointerdown',e=>{e.preventDefault();$('typein').focus()});
$('typing').addEventListener('click',()=>$('typein').focus());
$('peek').onclick=()=>{if(run&&!run.done){const d=run.r.order[run.k];if(!d)return;$('typein').value=d.name[0];paintTyped(d.name[0]);$('typein').focus()}};
function quit(){
  if(!run)return;run.car.remove();run=null;
  $('done').classList.remove('on');document.body.classList.remove('driving');
  dongs.forEach(d=>{d.own=false;d.tgt=false});setDongs(dongs);
  routes.forEach((_,j)=>routeVis(j,'visible'));
  passed=-1;restyle();
  bubbles.forEach(b=>b.getElement().style.display='');
  pin.getElement().style.display='';pinTag.getElement().style.display='';
  map.easeTo({pitch:$('tilt').getAttribute('aria-pressed')==='true'?55:0,bearing:0,padding:{top:0,bottom:0,left:0,right:0},duration:RM?0:700});
  setTimeout(fit,RM?0:720);
  document.querySelector('.card[aria-checked=true]')?.focus();
}

/* ── 단추·키 ── */
$('back').onclick=showList;
$('fit').onclick=fit;$('zin').onclick=()=>map.zoomIn();$('zout').onclick=()=>map.zoomOut();
$('tilt').onclick=()=>{const on=$('tilt').getAttribute('aria-pressed')!=='true';$('tilt').setAttribute('aria-pressed',on);
  map.easeTo({pitch:on?55:0,bearing:on?-17:0,duration:RM?0:700})};
$('up').onclick=()=>step(-1);$('down').onclick=()=>step(1);
$('play').onclick=()=>view==='routes'?start():toast('먼저 구를 고르세요');
$('quit').onclick=quit;$('again').onclick=quit;
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(run)return quit();if(view==='routes')return showList()}
  if(run||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowDown'){e.preventDefault();step(1)}
  if(e.key==='ArrowUp'){e.preventDefault();step(-1)}
  if(e.key==='Enter'&&view==='routes'&&!e.target.closest('button,a'))start();
});

map.on('load',async()=>{
  tame();
  map.addSource('dongs',{type:'geojson',data:fc([]),generateId:true});
  map.addSource('dong-pts',{type:'geojson',data:pts([])});
  const firstSym=map.getStyle().layers.find(l=>l.type==='symbol')?.id;
  /* 동 경계 그대로 칠한 면. 마우스를 얹으면 짙어지고, 누르면 그 동에서 출발한다 */
  const hov=['boolean',['feature-state','hover'],false];
  map.addLayer({id:'dong-fill',type:'fill',source:'dongs',filter:['!=',['get','tgt'],1],
    paint:{'fill-color':['case',['==',['get','own'],1],T('own'),T('area')],
      'fill-opacity':['case',hov,1,.75]}},firstSym);
  map.addLayer({id:'dong-tgt',type:'fill',source:'dongs',filter:['==',['get','tgt'],1],paint:{'fill-color':T('tgt')}},firstSym);
  map.addLayer({id:'dong-line',type:'line',source:'dongs',layout:{'line-join':'round'},paint:{
    'line-color':['case',['==',['get','tgt'],1],T('tgt-line'),['==',['get','own'],1],T('own-line'),T('area-line')],
    'line-width':['case',['==',['get','tgt'],1],4,hov,3,['==',['get','own'],1],2.5,1.2]}},firstSym);
  let hovId=null;
  const unhover=()=>{if(hovId!==null)map.setFeatureState({source:'dongs',id:hovId},{hover:false});hovId=null;map.getCanvas().style.cursor=''};
  map.on('mousemove','dong-fill',e=>{
    if(run)return unhover();
    const id=e.features[0].id;if(id===hovId)return;unhover();
    hovId=id;map.setFeatureState({source:'dongs',id},{hover:true});map.getCanvas().style.cursor='pointer';
  });
  map.on('mouseleave','dong-fill',unhover);
  map.on('click','dong-fill',e=>{
    if(run||view!=='routes')return;
    const d=dongs.find(x=>x.name===e.features[0].properties.name);if(d&&d!==pin?._d){placePin(d);plan(d)}
  });
  map.addLayer({id:'dong-label',type:'symbol',source:'dong-pts',layout:{
    'text-field':['get','name'],'text-font':['Noto Sans Bold'],'text-letter-spacing':-.01,
    'text-size':['interpolate',['linear'],['zoom'],11,12,16,21],'symbol-sort-key':['case',['==',['get','tgt'],1],0,1],
    'text-padding':4},
    paint:{'text-color':['case',['==',['get','tgt'],1],'#ffffff',T('label')],
      'text-halo-color':['case',['==',['get','tgt'],1],T('tgt-line'),['==',['get','own'],1],T('own-halo'),T('halo')],
      'text-halo-width':['case',['==',['get','tgt'],1],6,2]}});
  const empty={type:'FeatureCollection',features:[]};
  ['gus','gu-edge','gu-pts'].forEach(id=>map.addSource(id,{type:'geojson',data:empty}));
  map.addLayer({id:'gu-fill',type:'fill',source:'gus',paint:{'fill-color':T('area'),'fill-opacity':.75}},'dong-fill');
  map.addLayer({id:'gu-hov',type:'fill',source:'gus',filter:['==',['get','slug'],''],paint:{'fill-color':T('tgt')}},'dong-fill');
  map.addLayer({id:'gu-line',type:'line',source:'gu-edge',layout:{'line-join':'round'},paint:{'line-color':T('area-line'),
    'line-width':['case',['==',['get','slug'],''],2.5,1.2]}},'dong-fill');
  map.addLayer({id:'gu-label',type:'symbol',source:'gu-pts',layout:{'text-field':['get','name'],'text-font':['Noto Sans Bold'],
    'text-size':['interpolate',['linear'],['zoom'],10,12,13,17],'text-padding':2},
    paint:{'text-color':T('label'),'text-halo-color':T('halo'),'text-halo-width':2}});
  /* 구에 마우스를 얹으면 짙어지고, 누르면 그 구로 들어간다 */
  const guOn=g=>{
    if(g===guHov)return;guHov=g;
    map.setFilter('gu-hov',['==',['get','slug'],g||'']);
    map.setPaintProperty('gu-line','line-color',['case',['==',['get','slug'],g||''],T('tgt-line'),T('area-line')]);
    map.setPaintProperty('gu-line','line-width',['case',['==',['get','slug'],g||''],2.5,1.2]);
    map.getCanvas().style.cursor=g?'pointer':'';
  };
  map.on('mousemove','gu-fill',e=>{if(view==='list')guOn(e.features[0].properties.slug)});
  map.on('mouseleave','gu-fill',()=>guOn(null));
  map.on('click','gu-fill',e=>{if(view==='list'){guOn(null);load(e.features[0].properties.slug)}});
  index=await (await fetch(DATA+'drive-index.json')).json();
  drawGus();
  const q=new URLSearchParams(location.search).get('c');
  if(q&&index.some(m=>m.slug===q))load(q);else showList();
});
map.on('error',e=>{if(/tiles|style/.test(e?.error?.message||''))toast('지도 타일을 받지 못했습니다')});
</script>
</body>
</html>
