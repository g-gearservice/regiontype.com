<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>처음 오셨네요 — regiontype</title>
<link rel="stylesheet" href="../style.css?v=5.17">
<script>try{const o=JSON.parse(localStorage.getItem('rt.opt')||'{}');document.documentElement.toggleAttribute('data-night',!!o.night);document.documentElement.dataset.motion=o.motion===false?'off':'on'}catch{}</script>
<script src="../relay.js?v=5.17"></script>
<script src="welcome.js?v=5.17" defer></script>
</head>
<body class="intro-page">

<div class="map-backdrop" aria-hidden="true">
  <span class="c6 r1">도봉구</span>
  <span class="c3 r2">은평구</span>
  <span class="c5 r2">강북구</span>
  <span class="c6 r2">노원구</span>
  <span class="c4 r3">종로구</span>
  <span class="c5 r3">성북구</span>
  <span class="c7 r3">중랑구</span>
  <span class="c1 r4">강서구</span>
  <span class="c3 r4">마포구</span>
  <span class="c4 r4">서대문구</span>
  <span class="c5 r4">중구</span>
  <span class="c6 r4">동대문구</span>
  <span class="c8 r4">강동구</span>
  <span class="c2 r5">양천구</span>

  <span class="c6 r5">성동구</span>

  <span class="c5 r7">서초구</span>
</div>

<div class="intro-rail" aria-hidden="true"><span id="introBar"></span></div>

<main class="intro-shell">
  <p class="intro-count"><span id="introStep">1</span> / <span id="introTotal">13</span></p>

  <!-- 한 번에 한 장만 보인다. 순서·질문은 welcome.js 의 STEPS 가 쥔다 -->
  <section class="intro-card" id="introCard" tabindex="-1" aria-live="polite">
    <p class="intro-kicker" id="introKicker"></p>
    <h1 class="intro-ask" id="introAsk"></h1>
    <p class="intro-note" id="introNote"></p>
    <div class="intro-body" id="introBody"></div>
    <p class="intro-say" id="introSay" role="status" aria-live="polite"></p>
  </section>

  <nav class="intro-acts">
    <button type="button" class="profile-button" id="introBack" data-i18n="back">이전</button>
    <button type="button" class="profile-button intro-next" id="introNext" data-i18n="botNext">다음</button>
    <button type="button" class="intro-skip" id="introSkip" data-i18n="introSkip">건너뛰기</button>
  </nav>
</main>

</body>
</html>
