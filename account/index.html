<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>regiontype</title>
<!-- 내 계정은 이제 홈 위에 뜨는 덮개다(index.html + account/account.js). 이 자리는
     /account/ 옛 주소가 살아 있게 #account 로 넘기는 착지대다(settings/ 와 같은 결). -->
<meta name="robots" content="noindex">
<script>
  /* replace 로 넘긴다 — 뒤로 가기가 이 자리로 되돌아오면 안 된다 */
  location.replace('../#account');
</script>
</head>

</html>
