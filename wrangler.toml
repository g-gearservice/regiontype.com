# The site as a Worker with static assets — no script, no build step.
# Nothing deploys this on push: run `npx wrangler deploy` from main after merging, or the
# live site stays on the last manual deploy. relay/ has its own wrangler.toml.
#
# html_handling = "none" means a folder URL never finds its index.html on its own —
# every new page folder needs its pair of lines in _redirects.
name = "regiontype-com"
compatibility_date = "2026-09-15"

# One door only, the same rule the relay follows. The workers.dev address is open right now
# because the site was verified there before the domain moved; the next deploy closes it.
workers_dev = false

[assets]
directory = "."
# Keep URLs exactly as the files are named — hreflang and canonical links use .html
html_handling = "none"

# Pull-request builds run `wrangler preview`. That command stops unless this
# block exists. It stays empty: assets and routes remain above.
[previews]

# www owns its DNS record: Cloudflare made a Worker record for it, so the hostname is the
# Worker's and nothing else can answer there.
[[routes]]
pattern = "www.regiontype.com"
custom_domain = true

# The root keeps its GitHub Pages A records and is caught by a route instead. A custom
# domain would have meant deleting those records first, and the gap where the name does not
# resolve at all is the one outage worth avoiding — resolvers cache a missing name for
# minutes. A route intercepts at the edge before the request ever leaves for GitHub, so the
# switch is instant in both directions: delete the route and Pages answers again.
[[routes]]
pattern = "regiontype.com/*"
zone_name = "regiontype.com"
