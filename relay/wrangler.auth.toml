name = "rt-auth"
main = "entry-auth.mjs"
compatibility_date = "2026-08-01"
# 문은 존 라우트뿐 — workers.dev 는 닫는다.
workers_dev = false

# 이 워커가 받는 경로는 entry.mjs 의 OWN.auth. g.gearservicevanguard.com 의 rt-feedback(커스텀
# 도메인)보다 존 라우트 워커가 먼저 요청을 받으므로 프런트·OAuth 주소는 그대로다.
# 배포: wrangler deploy -c wrangler.auth.toml
# 시크릿(wrangler secret put X -c wrangler.auth.toml):
#   SESSION_KEY · SUB_KEY(선택, 없으면 SESSION_KEY) · GOOGLE_SECRET · APPLE_KEY
[vars]
GOOGLE_ID = "553049755538-kbc24ao0p1hv6re0nspv50j9e6hrqr0j.apps.googleusercontent.com"
APPLE_ID = ""
APPLE_TEAM = ""
APPLE_KID = ""

[[d1_databases]]
binding = "DB"
database_name = "rt-board"
database_id = "593224a1-2f33-4ec4-b43a-d9cd246e2d40"


[[ratelimits]]
name = "RL_AU"
namespace_id = "1003"   # 기존 wrangler.toml 과 같은 번호 — 셈이 이어진다
  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_CB"
namespace_id = "1004"   # 기존 wrangler.toml 과 같은 번호 — 셈이 이어진다
  [ratelimits.simple]
  limit = 30
  period = 60

# 시크릿을 넣은 뒤 주석을 푼다 — 그 전에는 이 워커가 실제 요청을 받지 않는다.
# [[routes]]
# pattern = "g.gearservicevanguard.com/auth/*"
# zone_name = "gearservicevanguard.com"


[observability]
enabled = true

[observability.logs]
enabled = true

# 복구 메일은 regiontype.com 의 rt-mail 만 보낸다. 브라우저에 열린 경로가 아니다.
[[services]]
binding = "MAIL"
service = "rt-mail"
