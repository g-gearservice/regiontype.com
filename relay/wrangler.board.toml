name = "rt-board"
main = "entry-board.mjs"
compatibility_date = "2026-08-01"
# 문은 존 라우트뿐 — workers.dev 는 닫는다.
workers_dev = false

# 이 워커가 받는 경로는 entry.mjs 의 OWN.board. api.regiontype.com 의 rt-feedback(커스텀
# 도메인)보다 존 라우트 워커가 먼저 요청을 받으므로 프런트·OAuth 주소는 그대로다.
# 배포: wrangler deploy -c wrangler.board.toml
# 시크릿(wrangler secret put X -c wrangler.board.toml):
#   SESSION_KEY

[[d1_databases]]
binding = "DB"
database_name = "rt-board"
database_id = "593224a1-2f33-4ec4-b43a-d9cd246e2d40"


[[ratelimits]]
name = "RL_SC"
namespace_id = "1002"   # 기존 wrangler.toml 과 같은 번호 — 셈이 이어진다
  [ratelimits.simple]
  limit = 3
  period = 60

[[ratelimits]]
name = "RL_RK"
namespace_id = "1005"   # 기존 wrangler.toml 과 같은 번호 — 셈이 이어진다
  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
# 1대1 매칭(/match/*). 찾기 폴링 2초·진행 폴링 1.5초라 분당 서른 남짓 — 넉넉히 둔다
name = "RL_MT"
namespace_id = "1011"   # 기존 wrangler.toml 과 같은 번호 — 셈이 이어진다
  [ratelimits.simple]
  limit = 120
  period = 60

# 시크릿을 넣은 뒤 주석을 푼다 — 그 전에는 이 워커가 실제 요청을 받지 않는다.
# [[routes]]
# pattern = "api.regiontype.com/top*"
# zone_name = "regiontype.com"

# [[routes]]
# pattern = "api.regiontype.com/dist*"
# zone_name = "regiontype.com"

# [[routes]]
# pattern = "api.regiontype.com/forget*"
# zone_name = "regiontype.com"

# [[routes]]
# pattern = "api.regiontype.com/ranked/*"
# zone_name = "regiontype.com"

# [[routes]]
# pattern = "api.regiontype.com/played*"
# zone_name = "regiontype.com"

# [[routes]]
# pattern = "api.regiontype.com/games*"
# zone_name = "regiontype.com"

# [[routes]]
# pattern = "api.regiontype.com/ladder*"
# zone_name = "regiontype.com"

# [[routes]]
# pattern = "api.regiontype.com/match/*"
# zone_name = "regiontype.com"


[observability]
enabled = true

[observability.logs]
enabled = true
