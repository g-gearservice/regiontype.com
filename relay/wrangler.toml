name = "rt-feedback"
main = "worker.mjs"
compatibility_date = "2026-08-01"

# wrangler d1 create rt-board 가 찍어주는 id 를 여기 적는다
[[d1_databases]]
binding = "DB"
database_name = "rt-board"
database_id = "593224a1-2f33-4ec4-b43a-d9cd246e2d40"

# IP 창. 예전엔 Cache API 로 셌지만 그건 workers.dev 배포에서 무시된다.
# namespace_id 는 그냥 이 워커 안에서 겹치지 않는 번호면 된다.
[[ratelimits]]
name = "RL_FB"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 1
  period = 60

[[ratelimits]]
name = "RL_SC"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 3
  period = 60

[[ratelimits]]
name = "RL_AU"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 10
  period = 60
