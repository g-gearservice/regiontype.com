# regiontype.com 존의 복구 메일. 브라우저가 부르는 문이 아니다 — 라우트를 달지 않는다.
# 중계기(rt-auth, 그리고 /auth 를 아직 받는 rt-feedback)가 서비스 바인딩으로만 부른다.
# 배포는 중계기보다 먼저: wrangler deploy -c mail/wrangler.toml
# 그 다음 같은 값을 세 곳에 넣는다(값을 저장소에 적지 않는다):
#   wrangler secret put MAIL_KEY -c mail/wrangler.toml
#   wrangler secret put MAIL_KEY -c relay/wrangler.auth.toml
#   wrangler secret put MAIL_KEY -c relay/wrangler.toml
# 로컬 중계기만 쓸 때는 relay/.dev.vars 에 MAIL_KEY 를 사람이 적는다.
# 보내는 주소는 recover@regiontype.com. Email Sending 이 regiontype.com 에 켜져 있어야 나간다.
# 수신자 허용 목록은 두지 않는다 — 누구에게 보내는지는 중계기의 확인된 사서함만 정한다.
name = "rt-mail"
main = "worker.mjs"
compatibility_date = "2026-09-15"
workers_dev = false

[vars]
MAIL_FROM = "recover@regiontype.com"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["recover@regiontype.com"]

[observability]
enabled = true

[observability.logs]
enabled = true
