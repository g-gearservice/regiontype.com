<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>regiontype</title>
<!-- 로그인 화면은 이제 홈 위에 뜨는 덮개다(index.html + auth.js). 이 자리는
     공급자가 돌아오는 착지대로만 남는다 — relay/worker.mjs 의 redir() 이
     브라우저를 /signin/#signin=… 로 보내기 때문이다. 해시를 그대로 홈에
     넘기고 비킨다. Worker 를 고쳐 /#… 로 바로 보내면 이 파일은 지워도 된다. -->
<meta name="robots" content="noindex">
<script>
  /* replace 로 넘긴다 — 뒤로 가기가 이 자리로 되돌아오면 안 된다 */
  location.replace('../' + (location.hash || ''));
</script>
</head>
<body></body>
</html>
