<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>regiontype — 갈래마다 한 색</title>
<meta name="robots" content="noindex, nofollow">
<!-- 래퍼런스: cosmos.so/e/1362512254 (workshops) · /e/1100441899 (my films) · /e/1298025822 (giulia loi).
     한 사람의 사이트가 갈래마다 색 한 쌍을 입는다 — 둥근 판 하나, 위에 굵은 대문자 메뉴와 그 밑의 가는 줄,
     왼쪽에 빗금과 두 줄 캡션, 꽉 찬 소문자 두 줄(_ 나 \\ 나 * 가 붙는다), 오른쪽 절반은 망점 사진.
     regiontype 은 연습·경쟁전·mimi·동네버스가 그 갈래다. 망점 사진 자리에는 그 갈래의 지도를 망점으로 찍는다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Noto+Sans+KR:wght@700&family=Noto+Serif+KR:wght@600&display=swap">
<style>
  :root{--sans:"Inter Tight","Noto Sans KR",system-ui,sans-serif;--serif:"Noto Serif KR",Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{background:var(--out,#b5b5b5);font:700 12px/1.2 var(--sans);-webkit-font-smoothing:antialiased;
    display:grid;place-items:center;min-height:100svh;padding:clamp(16px,6vw,96px) clamp(16px,6vw,140px);transition:background .4s ease}
  a,button{color:inherit;font:inherit}
  button{background:none;border:0;cursor:pointer;text-transform:inherit}
  :focus-visible{outline:2px solid currentColor;outline-offset:3px}

  .panel{position:relative;width:100%;max-width:1140px;aspect-ratio:1138/752;background:var(--bg);color:var(--ink);
    border-radius:10px;overflow:hidden;display:grid;grid-template-columns:1fr minmax(0,var(--img,33%));
    transition:background .4s ease,color .4s ease}
  .top{position:absolute;inset:0 0 auto 0;display:grid;grid-template-columns:1fr auto;padding:20px 20px 0 22px;z-index:2;pointer-events:none}
  .top > *{pointer-events:auto}
  .logo{font-size:22px;font-weight:800;letter-spacing:-.04em;text-decoration:none;align-self:start}
  .menu{position:absolute;left:43%;right:0;top:20px;display:flex;gap:clamp(14px,2.4vw,34px);padding-bottom:10px;border-bottom:2px solid var(--ink);text-transform:uppercase;font-size:clamp(9px,.85vw,11.5px)}
  .menu button[aria-selected="true"]{text-decoration:underline;text-underline-offset:3px}
  .lang{position:absolute;right:20px;top:20px;text-transform:uppercase;font-size:clamp(9px,.85vw,11px)}

  .left{position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 0 1.8%}
  .cap{display:flex;gap:8px;align-items:flex-start;text-transform:uppercase;font-size:clamp(9px,1.05vw,14px);line-height:1.05;margin:0 0 2.2% 0}
  .cap::before{content:"";width:22px;height:24px;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--ink) calc(50% - 1px),var(--ink) calc(50% + 1px),transparent calc(50% + 1px))}
  .word{font-weight:700;font-size:var(--fs,clamp(64px,15.6vw,196px));line-height:.78;letter-spacing:-.045em;white-space:pre;margin-bottom:-.05em;text-transform:lowercase}
  .word .mk{font-weight:600}
  .bio{position:absolute;left:58%;bottom:0;width:40%;border-left:2px solid var(--ink);padding:0 0 1.2% 12px;
    font:600 clamp(11px,1.4vw,19px)/1.24 var(--serif);letter-spacing:-.02em}
  .bio[hidden]{display:none}
  .go{display:inline-block;margin-top:10px;font:700 12px/1 var(--sans);text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}

  .img{position:relative;margin-top:calc(20px + 1.2em + 12px)}
  .img canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .hint{position:fixed;left:16px;bottom:12px;font:600 12px/1.3 var(--sans);color:#222;opacity:.7}

  @media (max-width:760px){
    body{padding:16px;place-items:start center}
    .panel{aspect-ratio:auto;grid-template-columns:1fr;grid-template-rows:auto 46vh auto}
    .menu{position:static;grid-column:1/-1;flex-wrap:wrap;gap:6px 14px;margin-top:40px}
    .top{position:relative;grid-template-columns:1fr;padding:16px}
    .lang{right:16px;top:20px}
    .img{grid-row:2;margin:0}
    .left{grid-row:3;padding:16px 0 0 16px;min-height:52vh}
    .word{--fs:clamp(72px,26vw,160px)}
    .bio{position:static;width:auto;margin:16px 16px 16px 0;border-left:0;padding:0}
    .hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){ body,.panel{transition:none} }
</style>
</head>
<body>

<main class="panel" id="panel">
  <div class="top">
    <a class="logo" href="../../" aria-label="regiontype 홈">rt</a>
    <div class="menu" role="tablist" aria-label="갈래" id="menu"></div>
    <span class="lang">KO / EN</span>
  </div>
  <section class="left" role="tabpanel" id="tp">
    <p class="cap" id="cap"></p>
    <h1 class="word" id="word"></h1>
    <p class="bio" id="bio" hidden></p>
  </section>
  <div class="img"><canvas id="cv" aria-hidden="true"></canvas></div>
</main>
<p class="hint">← → 로 갈래를 넘깁니다</p>

<script>
// 갈래 넷 — 색 한 쌍, 두 줄 낱말, 캡션, 망점으로 찍을 지도. 낱말의 _ \\ * 는 래퍼런스의 장식 그대로
const LINES=[
  {id:'practice',tab:'연습',bg:'#e5d7bf',ink:'#c4473f',out:'#b5b5b5',img:'36%',word:['region_','type'],cap:['Archive of place names','typed by hand'],map:'seoul'},
  {id:'ranked',tab:'경쟁전',bg:'#126b98',ink:'#061922',out:'#b5b5b5',img:'42%',word:['rank\\\\','ed'],cap:['Matches judged by','speed and accuracy'],map:'korea'},
  {id:'mimi',tab:'mimi',bg:'#982323',ink:'#1a0607',out:'linear-gradient(#2b74b8,#c9b8c6 60%,#c46d55)',img:'0%',word:['mimi','*board'],cap:['',''],map:null,
   bio:'보드게임처럼 두꺼운 지형 위에서 지역을 타이핑한다.'},
  {id:'bus',tab:'동네버스',bg:'#d9e04a',ink:'#14200c',out:'#b5b5b5',img:'40%',word:['bus_','stops'],cap:['Typing along','a neighbourhood line'],map:'seoul'},
];
const $=id=>document.getElementById(id), menu=$('menu');
let cur=0, shapes={};

LINES.forEach((l,i)=>{
  const b=document.createElement('button');b.type='button';b.role='tab';b.textContent=l.tab;b.setAttribute('aria-controls','tp');
  b.addEventListener('click',()=>show(i));menu.append(b);
});
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')show((cur+1)%LINES.length);
  if(e.key==='ArrowLeft')show((cur+LINES.length-1)%LINES.length);
});

function show(i){
  cur=i;const l=LINES[i],p=$('panel');
  p.style.setProperty('--bg',l.bg);p.style.setProperty('--ink',l.ink);p.style.setProperty('--img',l.img);
  document.body.style.background=l.out;
  menu.querySelectorAll('button').forEach((b,k)=>{b.setAttribute('aria-selected',k===i);b.tabIndex=k===i?0:-1});
  $('cap').textContent='';$('cap').style.visibility=l.cap[0]?'visible':'hidden';
  l.cap.forEach((c,k)=>{if(k)$('cap').append(document.createElement('br'));$('cap').append(c)});
  // 장식 글자(_ \ *)는 한 단 가볍게
  $('word').innerHTML=l.word.map(w=>w.replace(/[&<>]/g,'').replace(/([_\\*]+)/g,'<span class="mk">$1</span>')).join('\n');
  $('word').setAttribute('aria-label',l.word.join(' ').replace(/[_\\*]/g,''));
  $('bio').hidden=!l.bio;if(l.bio){$('bio').textContent=l.bio;const a=document.createElement('a');a.className='go';a.href='../../mimi/';a.textContent='판 열기 →';$('bio').append(document.createElement('br'),a)}
  draw();
}

// 망점 — 지도를 작은 캔버스에 칠하고 흐린 뒤, 밝기만큼 확률로 점을 찍는다(래퍼런스 사진의 거친 디더)
function draw(){
  const l=LINES[cur],cv=$('cv'),r=cv.getBoundingClientRect();
  const W=Math.max(1,Math.round(r.width)),H=Math.max(1,Math.round(r.height));
  const dpr=Math.min(2,devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const src=shapes[l.map];if(!src||!W)return;
  const s=Math.max(1,Math.floor(Math.min(W,H)/150)), w=Math.ceil(W/s), h=Math.ceil(H/s);
  const off=document.createElement('canvas');off.width=w;off.height=h;const o=off.getContext('2d');
  o.filter=`blur(${Math.max(2,w/38)}px)`;
  const k=Math.min(w/src.w,h/src.h)*.95, ox=(w-src.w*k)/2, oy=(h-src.h*k)/2;
  o.fillStyle='#000';src.cells.forEach(([x,y])=>o.fillRect(ox+x*k,oy+y*k,k+.6,k+.6));
  const d=o.getImageData(0,0,w,h).data;g.fillStyle=l.ink;
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const a=d[(y*w+x)*4+3]/255, p=.025+a*.9;
    if(rnd()<p)g.fillRect(x*s,y*s,s,s);
  }
}
addEventListener('resize',draw);

// 지도 두 장 — 서울 25구 격자와 대한민국 점 지도
Promise.all([
  fetch('../../data/seoul-gu.geom.json').then(r=>r.json()).then(g=>{const c=[];g.grid.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')c.push([x,y])}));shapes.seoul={cells:c,w:g.cols,h:g.rows_n}}),
  fetch('../../data/korea-pixels.json').then(r=>r.json()).then(p=>{const c=[];p.rows.forEach((row,y)=>{let x=0;for(const [,n,k] of row.matchAll(/(\d*)([.xS])/g)){const len=+(n||1);if(k!=='.')for(let j=0;j<len;j++)c.push([x+j,y]);x+=len}});shapes.korea={cells:c,w:p.w,h:p.h}})
]).then(draw);
show(0);
</script>
</body>
</html>
