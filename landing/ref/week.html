<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>regiontype — 이번 주</title>
<meta name="robots" content="noindex, nofollow">
<!-- 래퍼런스: cosmos.so/e/1490519735 (De School, Amsterdam).
     크림 바탕 위 굵은 검은 선의 정사각 격자. 격자는 계단처럼 비어 있고, 그 위에 칸을 덮는 판들이 얹힌다 —
     2×2 로고 칸, 큰 'THIS WEEK', 밑줄 친 큰 소식, 점박이 칸, 날짜와 고정폭 글자의 일정표.
     regiontype 의 홈도 격자 위에 지도가 앉는다. 일정표는 data/changes.json(바뀐 것)을 그대로 읽는다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  :root{
    --cream:#faf5ee; --ink:#141414; --red:#a5413c; --line:2px;
    --sans:"Inter Tight","Noto Sans KR",system-ui,sans-serif;
    --mono:"IBM Plex Mono","Noto Sans KR",ui-monospace,monospace;
    --cols:20; --cell:calc((min(100vw,1600px) - 64px) / var(--cols));
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--cream);color:var(--ink)}
  body{font:400 15px/1.55 var(--mono);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .wrap{max-width:1600px;margin:0 auto;padding:16px 32px 64px}

  .util{display:flex;justify-content:flex-end;gap:18px;font-family:var(--sans);font-size:14px;text-transform:uppercase;margin-bottom:18px}
  .util a{text-decoration:none} .util a[aria-current]{text-decoration:underline}

  /* 격자 — 칸 하나하나가 테두리를 가진 상자다. 판은 grid-area 로 칸 위에 얹혀 칸을 가린다 */
  .board{position:relative;display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell)}
  .cell{border:var(--line) solid var(--ink);margin:0 calc(var(--line) * -1) calc(var(--line) * -1) 0}
  .cell.off{visibility:hidden}
  .pane{position:relative;z-index:1;background:var(--cream);border:var(--line) solid var(--ink);margin:0 calc(var(--line) * -1) calc(var(--line) * -1) 0}

  .logo{grid-area:1/1/3/4;display:grid;grid-template:1fr 1fr/2fr 1fr;font:400 clamp(16px,1.7vw,26px)/1 var(--sans)}
  .logo span{display:flex;align-items:center;padding-left:10%;border-right:var(--line) solid var(--ink);border-bottom:var(--line) solid var(--ink)}
  .logo span:nth-child(2n){border-right:0} .logo span:nth-child(n+3){border-bottom:0}
  .logo span:nth-child(3){grid-column:1/3}
  .logo a{text-decoration:none;display:contents}

  .nav{grid-area:1/5/2/18;z-index:1;background:var(--cream);display:flex;align-items:center;gap:clamp(12px,2.2vw,34px);font-size:clamp(13px,1.1vw,17px);padding-left:4px}
  .nav a{text-decoration:none} .nav a[aria-current]{text-decoration:underline;text-underline-offset:4px}
  .tickets{grid-area:2/18/3/21;display:flex;align-items:center;justify-content:center;font:400 clamp(18px,2.1vw,32px)/1 var(--sans);text-decoration:underline;text-underline-offset:5px}
  .week{grid-area:3/10/5/18;display:flex;align-items:center;padding-left:3%;font:400 clamp(34px,5.3vw,84px)/1 var(--sans);letter-spacing:-.01em}
  .feat{grid-area:6/3/9/11;padding:5% 6%;font:400 clamp(20px,2.4vw,38px)/1.32 var(--sans);overflow:hidden}
  .feat a{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
  .dots{grid-area:9/8/12/13;z-index:2;
    background-color:var(--cream);background-image:radial-gradient(var(--ink) 1.3px,transparent 1.6px),radial-gradient(var(--ink) 1.1px,transparent 1.4px);
    background-size:13px 11px,17px 19px;background-position:0 0,6px 7px}
  .sched{grid-area:6/13/16/20;padding:4% 5%;overflow:hidden}
  .ev{display:grid;grid-template-columns:7.2em 1fr;gap:18px;margin-bottom:34px}
  .ev time{font:400 clamp(16px,1.4vw,21px)/1.3 var(--sans);text-transform:uppercase}
  .ev p{font-size:clamp(13px,1vw,15.5px);line-height:1.6}
  .ev small{display:block;margin-top:10px;font-size:13px}
  .ev a{color:var(--red);text-underline-offset:3px}

  .shots{display:grid;grid-template-columns:repeat(var(--cols),var(--cell));margin-top:calc(var(--cell) * .6)}
  .shots img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(.6) contrast(.95);display:block}
  .shots figure:nth-child(1){grid-column:1/5}
  .shots figure:nth-child(2){grid-column:6/10}
  .shots figcaption{font-size:13px;margin-top:8px}

  /* 폰 — 칸을 8줄로 줄이고 판은 격자 밖으로 내려 차례로 쌓는다 */
  @media (max-width:820px){
    :root{--cols:8;--cell:calc((100vw - 32px) / 8)}
    .wrap{padding:12px 16px 48px}
    .util{display:none}
    .wrap{padding-top:52px}
    .logo{grid-area:1/1/3/5}
    .nav{position:absolute;top:-40px;left:0;right:0;gap:16px;padding:0;background:none;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
    .tickets{grid-area:1/6/2/9}
    .week{grid-area:3/2/5/9;font-size:40px}
    .feat{grid-area:6/1/9/9;font-size:22px}
    .dots{grid-area:9/1/11/4}
    .sched{grid-area:auto;grid-column:1/-1;grid-row:span 12;margin-top:16px}
    .ev{grid-template-columns:1fr;gap:6px;margin-bottom:24px}
    .shots figure:nth-child(1){grid-column:1/5} .shots figure:nth-child(2){grid-column:5/9}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="util"><a href="https://github.com/g-gearservice/regiontype.com">GitHub</a><a href="../../community/">커뮤니티</a><a href="#" aria-current="true">KO</a><a href="../../about/en.html">EN</a></div>

  <div class="board" id="board">
    <div class="pane logo"><a href="../../" aria-label="regiontype 홈"><span>REGION</span><span></span><span>TYPE</span></a></div>
    <nav class="nav" aria-label="주 메뉴">
      <a href="#" aria-current="page">이번 주</a><a href="../../">플레이</a><a href="../../">경쟁전</a><a href="../../mimi/">mimi</a><a href="../../beta/bus/">동네버스</a><a href="../../beta/3dnavigation/">3D 내비</a><a href="../../community/">커뮤니티</a><a href="../../about/">소개</a>
    </nav>
    <a class="pane tickets" href="../../">시작하기</a>
    <h1 class="pane week">이번 주</h1>
    <div class="pane feat" id="feat"></div>
    <div class="pane dots" aria-hidden="true"></div>
    <section class="pane sched" aria-labelledby="h-s"><h2 id="h-s" style="position:absolute;left:-9999px">바뀐 것</h2><div id="sched"></div></section>
  </div>

  <div class="shots">
    <figure><img src="../../shots/desk-closed.png" alt="regiontype 홈 — 격자 위 서울 지도"><figcaption>홈 — 서울 25구</figcaption></figure>
    <figure><img src="../../shots/desk-open.png" alt="구를 펼친 화면 — 행정동이 칸으로 나뉜다"><figcaption>구를 펼치면 행정동</figcaption></figure>
  </div>
</div>

<script>
// 격자 칸을 깐다. 계단처럼 비우는 칸(래퍼런스의 왼쪽 위·오른쪽 아래)은 off 로 숨긴다
const board=document.getElementById('board');
function lay(){
  board.querySelectorAll('.cell').forEach(c=>c.remove());
  const cols=+getComputedStyle(document.documentElement).getPropertyValue('--cols'), rows=cols>10?16:11;
  const off=(x,y)=>cols>10
    ? (y<2&&x<3)||(y===0&&x<17&&x>2)||(y>=11&&x<12)||(y>=13&&x>19)||(y>=9&&x<7)
    : (y===0&&x<5)||(y>=9&&x>3);
  const frag=document.createDocumentFragment();
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const c=document.createElement('div');c.className='cell'+(off(x,y)?' off':'');
    c.style.gridArea=`${y+1}/${x+1}`;c.setAttribute('aria-hidden','true');frag.append(c);
  }
  board.prepend(frag);
}
lay();addEventListener('resize',lay);

const DAY=['SUN','MON','TUE','WED','THU','FRI','SAT'];
fetch('../../data/changes.json').then(r=>r.json()).then(list=>{
  const fmt=s=>{const d=new Date(s+'T00:00:00');return `${DAY[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`};
  const top=list[0];
  document.getElementById('feat').innerHTML='';
  const a=document.createElement('a');a.href='../../';a.textContent=`${fmt(top.date)}: v${top.v} — ${top.ko}`;
  document.getElementById('feat').append(a);
  const box=document.getElementById('sched');
  list.slice(1,8).forEach(e=>{
    const ev=document.createElement('article');ev.className='ev';
    const t=document.createElement('time');t.dateTime=e.date;t.textContent=fmt(e.date);
    const p=document.createElement('p');p.textContent=`UPDATE | ${e.ko}`;
    const sm=document.createElement('small');sm.textContent=`v${e.v} / ${e.date}`;p.append(sm);
    ev.append(t,p);box.append(ev);
  });
});
</script>
</body>
</html>
