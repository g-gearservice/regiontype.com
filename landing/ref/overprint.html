<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>regiontype — 겹쳐 찍은 동네</title>
<meta name="robots" content="noindex, nofollow">
<!-- 래퍼런스: cosmos.so/e/1851469676 (NORTH / CENTRAL / RIVR / SIGNAL / EAST 노선 포스터).
     회색 종이 위 가는 색 노선, 그 위에 겹쳐 찍은 아주 굵은 검은 지명 몇 개 — 그 문법을 따른다.
     노선은 동네버스(data/bus.json)의 실제 정류장 순서다. 큰 글자는 넷째 정류장마다 하나.
     정류장 이름을 치면 그 글자가 노선 색 속 빈 글자로 바뀐다. ← → 로 구를 넘긴다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;900&display=swap">
<style>
  :root{
    --paper:#d9d6cf; --ink:#111; --muted:#56534d; --route:#f6c037;
    --sans:"Inter Tight","Noto Sans KR",system-ui,sans-serif;
    --mono:"IBM Plex Mono","Noto Sans KR",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink)}
  body{font:500 13px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
  a,button{color:inherit;font:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .sheet{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:24px;min-height:100svh}
  .side{display:flex;flex-direction:column;gap:20px;font-size:12px}
  .side .logo{font:600 15px var(--sans)}
  .side .meta{font-family:var(--mono);color:var(--muted);line-height:1.6}
  .side .desc{line-height:1.65;max-width:20em}
  .side .key{display:flex;gap:8px;align-items:center}
  .side .key button{border:1px solid var(--ink);background:none;width:32px;height:32px;cursor:pointer}
  .side .key button:hover{background:var(--ink);color:var(--paper)}
  .side ol{list-style:none;font-family:var(--mono);columns:2;column-gap:10px}
  .side li{padding:2px 0;break-inside:avoid}
  .side li.on{text-decoration:line-through;text-decoration-thickness:2px}
  .side li.on::after{content:" ✓"}
  .side nav{margin-top:auto;display:flex;gap:14px}
  .side nav a{text-decoration:none}
  .side nav a:hover{text-decoration:underline}

  .stage{position:relative}
  .stage svg{width:100%;height:100%;max-height:calc(100svh - 120px);display:block}
  .route{fill:none;stroke:var(--route);stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
  .ghost{fill:none;stroke:rgba(17,17,17,.18);stroke-width:1;stroke-dasharray:3 4}
  .dot{fill:var(--paper);stroke:var(--ink);stroke-width:2}
  .dot.on{fill:var(--route)}
  .word{font:900 76px/1 var(--sans);letter-spacing:-.06em;fill:var(--ink);paint-order:stroke;transition:fill .3s ease}
  .word.on{fill:transparent;stroke:var(--ink);stroke-width:1.5}
  .small{font:500 11px var(--mono);fill:var(--muted)}

  .type{position:absolute;right:0;bottom:0;width:min(320px,100%)}
  .type input{width:100%;background:none;border:0;border-bottom:2px solid var(--ink);font:500 20px/1.4 var(--sans);padding:6px 0;outline:0}
  .type p{font:500 11px var(--mono);color:var(--muted);margin-top:6px}

  @media (max-width:820px){
    .sheet{grid-template-columns:1fr;padding:16px}
    .type{position:static;margin-top:12px;width:100%}
    .word{font-size:64px}
  }
  @media (prefers-reduced-motion:reduce){ .word{transition:none} }
</style>
</head>
<body>
<div class="sheet">
  <aside class="side">
    <div class="logo">regiontype<br><span style="font-weight:400">동네버스</span></div>
    <div class="meta" id="meta">—</div>
    <p class="desc" id="desc"></p>
    <div class="key"><button id="prev" type="button" aria-label="이전 구">←</button><button id="next" type="button" aria-label="다음 구">→</button><span id="pos" class="meta">—</span></div>
    <ol id="list" aria-label="정류장"></ol>
    <nav aria-label="주 메뉴"><a href="../../beta/bus/">타기</a><a href="../../">연습</a><a href="../../about/">소개</a></nav>
  </aside>
  <main class="stage">
    <svg id="svg" viewBox="-20 -20 800 640" role="img" aria-label="동네버스 노선과 정류장 이름"></svg>
    <div class="type">
      <label for="t" style="position:absolute;left:-9999px">정류장 이름 입력</label>
      <input id="t" autocomplete="off" spellcheck="false" placeholder="정류장 이름">
      <p id="msg" aria-live="polite">0 / 0 정류장</p>
    </div>
  </main>
</div>

<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id),norm=s=>s.replace(/\s/g,'');
let D=[],cur=0,lit=new Set(),els={};
fetch('../../data/bus.json').then(r=>r.json()).then(b=>{D=b.districts;show(0)});
function el(tag,attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);return e}
function show(i){
  cur=(i+D.length)%D.length;const d=D[cur];lit=new Set();els={};
  document.documentElement.style.setProperty('--route',d.color);
  $('meta').innerHTML=`${d.name}<br>${d.stops.length} 정류장 · ${d.stops[0][0]} → ${d.stops[d.stops.length-1][0]}`;
  $('desc').textContent=d.desc;$('pos').textContent=`${String(cur+1).padStart(2,'0')} / ${D.length}`;
  $('list').innerHTML=d.stops.map(s=>`<li data-n="${s[0]}">${s[0]}</li>`).join('');
  const svg=$('svg');svg.innerHTML='';
  const pts=d.stops.map(s=>s[1]+','+s[2]).join(' ');
  svg.append(el('polyline',{class:'ghost',points:pts}));
  // 큰 글자 — 넷째 정류장마다. 노선보다 먼저 깔아 노선이 글자 위를 지나게 한다(래퍼런스의 겹침)
  d.stops.forEach((s,k)=>{if(k%4)return;const w=el('text',{class:'word',x:s[1]-20,y:s[2]+26});w.textContent=s[0].replace(/동$/,'');svg.append(w);(els[s[0]]=els[s[0]]||{}).word=w});
  svg.append(el('polyline',{class:'route',points:pts}));
  d.stops.forEach(s=>{const c=el('circle',{class:'dot',cx:s[1],cy:s[2],r:6});svg.append(c);(els[s[0]]=els[s[0]]||{}).dot=c;
    const t=el('text',{class:'small',x:s[1]+10,y:s[2]-10});t.textContent=s[0];svg.append(t)});
  count();
}
function count(){$('msg').textContent=`${lit.size} / ${D[cur].stops.length} 정류장`}
$('prev').onclick=()=>show(cur-1);$('next').onclick=()=>show(cur+1);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
const t=$('t');
const check=ev=>{
  if(ev&&ev.isComposing)return;const v=norm(t.value);
  if(els[v]&&!lit.has(v)){lit.add(v);t.value='';
    els[v].dot.classList.add('on');if(els[v].word)els[v].word.classList.add('on');
    document.querySelector(`#list li[data-n="${v}"]`).classList.add('on');count()}
};
t.addEventListener('input',check);t.addEventListener('compositionend',()=>setTimeout(check));
</script>
</body>
</html>
