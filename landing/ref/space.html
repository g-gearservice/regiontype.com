<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>regiontype — 내 코스 담기</title>
<meta name="robots" content="noindex, nofollow">
<!-- 래퍼런스: cosmos.so/e/379803229 (Sellers.Basic.Space).
     흰 바탕, 맨 위 '● Menu · 가운데 이름 · 오른쪽 링크'의 얇은 줄, 폭을 꽉 채운 제호(앞 낱말만 파랑),
     'Grid / List' 그 아래 가는 선, 왼쪽에 세로 사진 한 장, 오른쪽에 점으로 이은 이름 줄과 'Follow' 알약.
     regiontype 에서는 이름이 구 이름이고, Follow 는 '담기'다 — 담은 구로 내 코스를 만든다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  :root{--blue:#1414ef;--ink:#0b0b0b;--line:#8a8a8a;--bg:#fff;--sans:"Inter Tight","Noto Sans KR",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font:400 15px/1.3 var(--sans);-webkit-font-smoothing:antialiased;padding:0 18px 80px}
  a,button{color:inherit;font:inherit}
  button{background:none;border:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 0 0;font-size:15px}
  .bar .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--blue);vertical-align:-1px;margin-right:6px}
  .bar nav{justify-self:end;display:flex;gap:18px;align-items:center}
  .bar a{text-decoration:none}
  .count{font-variant-numeric:tabular-nums}

  .mast{font-weight:400;letter-spacing:-.045em;line-height:1;white-space:nowrap;width:max-content;margin:6px 0 0 -.04em}
  .mast b{font-weight:400;color:var(--blue)}

  .view{display:flex;gap:4px;margin-top:clamp(28px,4vw,56px);padding-bottom:6px;border-bottom:1px solid var(--ink);font-size:15px}
  .view button[aria-pressed="true"]{color:var(--blue)}

  .body{display:grid;grid-template-columns:minmax(0,24.5%) 1fr;gap:18px;margin-top:20px}
  .photo{position:sticky;top:18px;align-self:start;aspect-ratio:380/510;overflow:hidden;background:#eee}
  .photo img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
  .photo figcaption{position:absolute;left:0;bottom:0;right:0;padding:8px 10px;font-size:12px;background:rgba(255,255,255,.86)}

  .rows{list-style:none}
  .rows li{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:6px 0 7px}
  .rows .nm{font-size:clamp(26px,3.05vw,44px);letter-spacing:-.03em;line-height:1.12;text-decoration:none}
  .rows .nm small{font-size:.42em;letter-spacing:0;color:#666;margin-left:.5em;vertical-align:.25em}
  .rows li.on .nm{color:var(--blue);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
  .pill{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px 6px 8px;font-size:15px;white-space:nowrap}
  .pill::before{content:"";width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink);box-sizing:border-box}
  .pill[aria-pressed="true"]::before{background:var(--blue);border-color:var(--blue)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
  .grid button{text-align:left}
  .grid svg{display:block;width:100%;aspect-ratio:1;background:#f1f1f1}
  .grid button[aria-pressed="true"] svg{outline:3px solid var(--blue);outline-offset:-3px}
  .grid span{display:block;font-size:17px;margin-top:6px;letter-spacing:-.02em}
  .grid button[aria-pressed="true"] span{color:var(--blue);text-decoration:underline}
  [hidden]{display:none!important}

  .start{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--blue);color:#fff;border-radius:999px;
    padding:12px 22px;font-size:16px;text-decoration:none;box-shadow:0 6px 18px rgba(20,20,239,.25)}

  @media (max-width:760px){
    body{padding:0 16px 88px}
    .bar{grid-template-columns:auto 1fr}
    .bar .center{display:none}
    .body{grid-template-columns:1fr}
    .photo{position:relative;top:0;aspect-ratio:4/3}
    .photo img{object-position:center 62%}
    .pill{padding:5px 10px 5px 6px;font-size:13px}
  }
</style>
</head>
<body>

<header class="bar">
  <a href="../../"><span class="dot" aria-hidden="true"></span>Menu</a>
  <span class="center">regiontype</span>
  <nav aria-label="보조 메뉴"><a href="../../">경쟁전</a><a href="../../about/">소개</a><span><span class="count" id="cnt">0</span>곳 (25)</span></nav>
</header>

<h1 class="mast" id="mast"><b>Seoul.</b>Region.Type</h1>

<div class="view" role="group" aria-label="보기">
  <button type="button" aria-pressed="false" data-v="grid">Grid</button> / <button type="button" aria-pressed="true" data-v="list">List</button>
</div>

<div class="body">
  <figure class="photo"><img src="../../shots/phone-closed.png" alt="폰에서 본 regiontype — 서울 25구 지도"><figcaption>폰에서는 화면 아래 게임 자판으로 칩니다</figcaption></figure>
  <div>
    <ol class="rows" id="rows"></ol>
    <div class="grid" id="grid" hidden></div>
  </div>
</div>

<a class="start" id="start" href="../../" hidden>담은 <span id="cnt2">0</span>곳으로 시작 →</a>

<script>
const NS='http://www.w3.org/2000/svg';
const picked=new Set();
const items=[];   // {ko,en,cells}

// 제호를 폭에 꼭 맞춘다
const mast=document.getElementById('mast');
const fit=()=>{mast.style.fontSize='100px';mast.style.fontSize=(100*(document.body.clientWidth-36)/mast.scrollWidth)+'px'};
document.fonts.ready.then(fit);addEventListener('resize',fit);

Promise.all(['seoul-gu.course','seoul-gu.geom','kr-names'].map(f=>fetch(`../../data/${f}.json`).then(r=>r.json()))).then(([c,g,names])=>{
  const by={};g.grid.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.')return;const n=g.items[parseInt(ch,36)].name;(by[n]=by[n]||[]).push([x,y])}));
  c.items.forEach(it=>{
    // Gangseo-gu → Gangseo.Gu — 래퍼런스의 'Natalie.Bonofacci' 처럼 점으로 잇는다
    const en=(names['seoul-gu/'+it.name]||it.name).replace(/-gu$/,'.Gu');
    items.push({ko:it.name,en,cells:by[it.name]||[]});
  });
  renderList();renderGrid();
});

function toggle(ko){picked.has(ko)?picked.delete(ko):picked.add(ko);sync()}
function sync(){
  document.querySelectorAll('[data-ko]').forEach(el=>{
    const on=picked.has(el.dataset.ko);
    if(el.matches('li'))el.classList.toggle('on',on);
    if(el.matches('button')){el.setAttribute('aria-pressed',on);if(el.classList.contains('pill'))el.lastChild.textContent=on?'담음':'담기'}
  });
  document.getElementById('cnt').textContent=picked.size;document.getElementById('cnt2').textContent=picked.size;
  document.getElementById('start').hidden=!picked.size;
}
function renderList(){
  const ol=document.getElementById('rows');
  ol.replaceChildren(...items.map(it=>{
    const li=document.createElement('li');li.dataset.ko=it.ko;
    const a=document.createElement('a');a.className='nm';a.href='../../';a.textContent=it.en;
    const sm=document.createElement('small');sm.textContent=it.ko;a.append(sm);
    const b=document.createElement('button');b.type='button';b.className='pill';b.dataset.ko=it.ko;b.setAttribute('aria-pressed','false');
    b.setAttribute('aria-label',`${it.ko} 담기`);b.append(document.createTextNode('담기'));
    b.addEventListener('click',()=>toggle(it.ko));
    li.append(a,b);return li;
  }));
}
function renderGrid(){
  const box=document.getElementById('grid');
  box.replaceChildren(...items.map(it=>{
    const b=document.createElement('button');b.type='button';b.dataset.ko=it.ko;b.setAttribute('aria-pressed','false');
    const xs=it.cells.map(c=>c[0]),ys=it.cells.map(c=>c[1]),x0=Math.min(...xs),y0=Math.min(...ys);
    const w=Math.max(...xs)-x0+1,h=Math.max(...ys)-y0+1,m=Math.max(w,h)+2;
    const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox',`0 0 ${m} ${m}`);s.setAttribute('aria-hidden','true');
    it.cells.forEach(([x,y])=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x-x0+(m-w)/2+.5);c.setAttribute('cy',y-y0+(m-h)/2+.5);c.setAttribute('r',.4);c.setAttribute('fill','#0b0b0b');s.append(c)});
    const sp=document.createElement('span');sp.textContent=it.en;
    b.append(s,sp);b.addEventListener('click',()=>toggle(it.ko));return b;
  }));
}
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.getElementById('rows').hidden=v!=='list';document.getElementById('grid').hidden=v!=='grid';
}));
</script>
</body>
</html>
