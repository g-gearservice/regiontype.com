<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>regiontype — 이름 목록</title>
<meta name="robots" content="noindex, nofollow">
<!-- 래퍼런스: cosmos.so/e/1575382657 (Simone Biavati 포트폴리오).
     흰 바탕, 맨 위 아주 작은 굵은 대문자 한 줄(이름 · 날짜 · ↓ALPHABETICAL / RECENT · ABOUT / CONTACT · ○),
     그 아래 굵고 큰 대문자 이름이 줄마다 하나, 이름 바로 뒤에 작은 사진 서넛.
     regiontype 에서는 이름이 지명이고, 사진 자리에 그 지명의 점 지도가 앉는다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Noto+Sans+KR:wght@700;900&display=swap">
<style>
  :root{--bg:#fff;--ink:#0d0d0d;--frame:#141414;--sans:"Inter Tight","Noto Sans KR",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font:700 11px/1.3 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-transform:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .meta{position:sticky;top:0;z-index:2;background:var(--bg);display:grid;
    grid-template-columns:auto auto 1fr auto auto;gap:28px;align-items:center;padding:10px 12px 6px;text-transform:uppercase;letter-spacing:.01em}
  .meta .sort button[aria-pressed="true"]{text-decoration:underline;text-underline-offset:2px}
  .meta .sort{justify-self:center}
  .meta input{width:9em;border:0;border-bottom:1.5px solid var(--ink);font:inherit;padding:1px 0;outline:0;background:none;text-transform:none}
  .ring{width:11px;height:11px;border:1.5px solid var(--ink);border-radius:50%;display:inline-block}

  .tabs{display:flex;gap:16px;padding:0 12px 4px;text-transform:uppercase}
  .tabs button[aria-selected="true"]{text-decoration:underline;text-underline-offset:2px}

  ol{list-style:none;padding:0 12px 48px}
  li a{display:flex;align-items:center;gap:clamp(8px,1vw,14px);padding:1px 0}
  .nm{font-weight:900;font-size:clamp(34px,5.6vw,80px);line-height:1.02;letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap}
  :lang(en) .nm,.nm.lat{font-family:"Inter Tight",sans-serif;font-weight:700}
  .th{display:flex;gap:clamp(6px,.8vw,12px);align-items:center}
  .th svg{height:clamp(30px,4.6vw,66px);width:auto;display:block}
  li a:hover .nm{text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.08em}
  li[hidden]{display:none}
  .none{padding:24px 12px;font-size:14px;text-transform:uppercase}

  footer{display:flex;justify-content:space-between;padding:12px;text-transform:uppercase;border-top:1.5px solid var(--ink)}

  @media (max-width:720px){
    .meta{grid-template-columns:1fr auto;gap:8px 16px}
    .meta .date,.meta .ring{display:none}
    .meta .sort{justify-self:start}
    .th svg:nth-child(n+3){display:none}
    .nm{white-space:normal}
  }
</style>
</head>
<body>

<header class="meta">
  <a href="../../">regiontype</a>
  <span class="date" id="date"></span>
  <span class="sort" role="group" aria-label="정렬">↓<button type="button" aria-pressed="false" data-sort="abc">가나다</button> / <button type="button" aria-pressed="true" data-sort="course">코스 순</button></span>
  <label>쳐서 찾기 <input id="q" autocomplete="off" spellcheck="false" placeholder="강"></label>
  <span><a href="../../about/">소개</a> / <a href="../../community/">커뮤니티</a> <span class="ring" aria-hidden="true"></span></span>
</header>

<div class="tabs" role="tablist" aria-label="목록">
  <button type="button" role="tab" aria-selected="true" data-tab="seoul">서울 25</button>
  <button type="button" role="tab" aria-selected="false" data-tab="world">World 46</button>
</div>

<main>
  <ol id="list" aria-live="polite"></ol>
  <p class="none" id="none" hidden>맞는 이름이 없습니다</p>
</main>

<footer><span>regiontype.com</span><span>지명을 치는 타자연습</span></footer>

<script>
const NS='http://www.w3.org/2000/svg';
const d=new Date();document.getElementById('date').textContent=`${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;

// 썸네일 한 장 = 칸 목록을 정사각 점판에 그린 것. 사진 대신 쓰므로 바탕·점 색을 장마다 바꾼다(래퍼런스의 사진들처럼 제각각)
const LOOKS=[['#0d0d0d','#fff'],['#e9e9e9','#0d0d0d'],['#1f4fd8','#fff'],['#f2b41b','#0d0d0d'],['#c8322a','#fff']];
function thumb(cells,w,h,look,ctx){
  const s=document.createElementNS(NS,'svg'),m=Math.max(w,h)+2;
  s.setAttribute('viewBox',`0 0 ${m} ${m}`);s.setAttribute('aria-hidden','true');
  const bg=document.createElementNS(NS,'rect');bg.setAttribute('width',m);bg.setAttribute('height',m);bg.setAttribute('fill',look[0]);s.append(bg);
  const ox=(m-w)/2,oy=(m-h)/2;
  (ctx||[]).forEach(([x,y])=>{const r=document.createElementNS(NS,'rect');r.setAttribute('x',ox+x+.1);r.setAttribute('y',oy+y+.1);r.setAttribute('width',.8);r.setAttribute('height',.8);r.setAttribute('fill',look[1]);r.setAttribute('opacity',.28);s.append(r)});
  cells.forEach(([x,y])=>{const r=document.createElementNS(NS,'rect');r.setAttribute('x',ox+x+.1);r.setAttribute('y',oy+y+.1);r.setAttribute('width',.8);r.setAttribute('height',.8);r.setAttribute('fill',look[1]);s.append(r)});
  return s;
}
const bbox=cs=>{const xs=cs.map(c=>c[0]),ys=cs.map(c=>c[1]),x0=Math.min(...xs),y0=Math.min(...ys);return {cells:cs.map(([x,y])=>[x-x0,y-y0]),w:Math.max(...xs)-x0+1,h:Math.max(...ys)-y0+1}};

let rows={seoul:[],world:[]},tab='seoul',sort='course';
const list=document.getElementById('list');

Promise.all([fetch('../../data/seoul-gu.geom.json').then(r=>r.json()),fetch('../../data/seoul-gu.course.json').then(r=>r.json())]).then(([g,c])=>{
  const all=[],by={};
  g.grid.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='.')return;const n=g.items[parseInt(ch,36)].name;all.push([x,y]);(by[n]=by[n]||[]).push([x,y])}));
  const A=bbox(all);
  rows.seoul=c.items.map((it,i)=>{
    const own=bbox(by[it.name]);
    const x0=Math.min(...by[it.name].map(c=>c[0])),y0=Math.min(...by[it.name].map(c=>c[1]));
    // 서너 장: 그 구만 / 서울 속의 그 구 / 다른 색 / 또 다른 색
    const inCity=by[it.name].map(([x,y])=>[x-Math.min(...all.map(c=>c[0])),y-Math.min(...all.map(c=>c[1]))]);
    const t=[thumb(own.cells,own.w,own.h,LOOKS[i%5]),thumb(inCity,A.w,A.h,LOOKS[(i+1)%5],A.cells),thumb(own.cells,own.w,own.h,LOOKS[(i+2)%5]),thumb(inCity,A.w,A.h,LOOKS[(i+3)%5],A.cells)];
    return {name:it.name,key:it.name,order:i,thumbs:t.slice(0,2+(i%3))};
  });
  render();
});

const WORLD={ae:'United Arab Emirates',ar:'Argentina',at:'Austria',au:'Australia',be:'Belgium',bg:'Bulgaria',br:'Brazil',ca:'Canada',ch:'Switzerland',cl:'Chile',cn:'China',co:'Colombia',cz:'Czechia',de:'Germany',eg:'Egypt',es:'Spain',fi:'Finland',fr:'France',gb:'United Kingdom',gr:'Greece',hk:'Hong Kong',hu:'Hungary',id:'Indonesia',ie:'Ireland',in:'India',it:'Italy',jp:'Japan',kr:'Korea',mx:'Mexico',my:'Malaysia',nl:'Netherlands',no:'Norway',nz:'New Zealand',ph:'Philippines',pl:'Poland',pt:'Portugal',ro:'Romania',sa:'Saudi Arabia',se:'Sweden',th:'Thailand',tr:'Türkiye',tw:'Taiwan',ua:'Ukraine',us:'United States',vn:'Vietnam',za:'South Africa'};
function loadWorld(){
  if(rows.world.length)return Promise.resolve();
  return Promise.all(Object.entries(WORLD).map(([cc,name],i)=>fetch(`../../data/${cc==='kr'?'korea':cc}-pixels.json`).then(r=>r.json()).then(p=>{
    const cells=[];p.rows.forEach((row,y)=>{let x=0;for(const [,num,k] of row.matchAll(/(\d*)([.xS])/g)){const n=+(num||1);if(k!=='.')for(let j=0;j<n;j++)cells.push([x+j,y]);x+=n}});
    return {name:name,key:name,order:i,lat:true,thumbs:[0,1,2].slice(0,1+(i%3)).map(k=>thumb(cells,p.w,p.h,LOOKS[(i+k)%5]))};
  }).catch(()=>null))).then(r=>{rows.world=r.filter(Boolean)});
}

function render(){
  const q=document.getElementById('q').value.replace(/\s/g,'').toLowerCase();
  const rs=[...rows[tab]].sort((a,b)=>sort==='abc'?a.name.localeCompare(b.name,'ko'):a.order-b.order);
  list.replaceChildren(...rs.map(r=>{
    const li=document.createElement('li'),a=document.createElement('a');a.href='../../';
    const nm=document.createElement('span');nm.className='nm'+(r.lat?' lat':'');nm.textContent=r.name;
    const th=document.createElement('span');th.className='th';th.append(...r.thumbs.map(s=>s.cloneNode(true)));
    a.append(nm,th);li.append(a);
    li.hidden=!!q&&!r.name.replace(/\s/g,'').toLowerCase().startsWith(q);
    return li;
  }));
  document.getElementById('none').hidden=rs.some(r=>!q||r.name.replace(/\s/g,'').toLowerCase().startsWith(q));
}
document.getElementById('q').addEventListener('input',render);
document.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{
  sort=b.dataset.sort;document.querySelectorAll('[data-sort]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();
}));
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));
  (tab==='world'?loadWorld():Promise.resolve()).then(render);
}));
</script>
</body>
</html>
