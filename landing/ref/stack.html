<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>regiontype — 다섯 줄</title>
<meta name="robots" content="noindex, nofollow">
<!-- 래퍼런스: cosmos.so/e/700001681 (라일락 판 위 쌓인 직함 — ARTIST / FILM MAKER / … / EDUCATOR).
     노란 바깥, 라일락 판, 맨 위 INDEX · 이름 · ABOUT 한 줄, 왼쪽에 굵게 쌓은 직함 다섯 줄,
     그 첫 글자들을 덮는 작은 흑백 그림 하나 — 그 문법을 따른다.
     직함은 regiontype 의 갈래에서 플레이어가 되는 것. 줄에 손을 대면 그림이 그 갈래의 지도로 바뀐다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;800&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
  :root{
    --out:#f2e94e; --lilac:#c6b2f4; --ink:#14111f; --muted:#3f3657;
    --sans:"Inter Tight","Noto Sans KR",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--out);color:var(--ink)}
  body{font:600 13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;padding:20px;min-height:100svh;display:flex}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  .panel{flex:1;background:var(--lilac);border-radius:6px;padding:16px 20px 24px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-transform:uppercase;letter-spacing:.04em}
  .top a{text-decoration:none}
  .top a:hover{text-decoration:underline}
  .top .mid{text-align:center}
  .top .end{text-align:right}

  .stack{list-style:none;margin:auto 0;padding:5vh 0 5vh clamp(48px,8vw,120px);position:relative}
  .stack a{display:block;text-decoration:none;font:900 clamp(40px,8.4vw,128px)/.9 var(--sans);letter-spacing:-.045em;text-transform:uppercase;width:max-content;max-width:100%}
  .stack a small{font:600 clamp(11px,1vw,14px)/1 var(--sans);letter-spacing:.02em;vertical-align:top;margin-left:.6em;text-transform:none}
  .stack a:hover,.stack a:focus-visible,.stack a.hit{color:#fff;outline:0;-webkit-text-stroke:2px var(--ink)}
  .stack a:hover small,.stack a:focus-visible small,.stack a.hit small{color:var(--ink);-webkit-text-stroke:0}

  /* 첫 글자들을 덮는 그림 — 래퍼런스의 흑백 사진 자리 */
  .pic{position:absolute;left:clamp(8px,2vw,32px);top:50%;transform:translateY(-50%);width:clamp(84px,11vw,170px);aspect-ratio:3/4;
    background:#f7f4ff;border:2px solid var(--ink);display:grid;place-items:center;pointer-events:none;z-index:2;padding:10px}
  .pic svg{width:100%;height:100%}
  .pic svg *{fill:var(--ink)}
  .pic svg .stroke{fill:none;stroke:var(--ink);stroke-width:6;stroke-linejoin:round}
  .pic figcaption{position:absolute;left:0;right:0;bottom:-22px;font-size:11px;text-align:left}

  .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .bottom p{max-width:28em;color:var(--muted)}
  .bottom label{display:flex;gap:10px;align-items:center;text-transform:uppercase}
  .bottom input{background:none;border:0;border-bottom:2px solid var(--ink);font:700 18px var(--sans);padding:4px 0;outline:0;width:12em;color:var(--ink)}

  @media (max-width:640px){
    body{padding:10px}
    .pic{left:auto;right:12px;width:96px}
    .top{grid-template-columns:1fr 1fr}.top .mid{display:none}
  }
</style>
</head>
<body>
<div class="panel">
  <div class="top"><a href="index.html">Index</a><span class="mid">Regiontype</span><a class="end" href="../../about/">About</a></div>

  <ul class="stack" id="stack">
    <li><a href="../../" data-pic="seoul">타자수<small>연습 · 서울 25구</small></a></li>
    <li><a href="../../compete/" data-pic="seoul">맞수<small>경쟁전</small></a></li>
    <li><a href="../../beta/bus/" data-pic="bus">승객<small>동네버스</small></a></li>
    <li><a href="../../beta/3dnavigation/" data-pic="seoul">길잡이<small>3D 내비게이션</small></a></li>
    <li><a href="../../" data-pic="korea">지도 수집가<small>46 나라</small></a></li>
  </ul>

  <figure class="pic" aria-hidden="true"><svg id="pic"></svg><figcaption id="cap"></figcaption></figure>

  <div class="bottom">
    <p>지명을 치는 타자연습. 지도에 뜬 지역 이름을 직접 쳐서 익힙니다 — 무엇이 될지는 갈래가 고릅니다.</p>
    <label for="t">되고 싶은 것<input id="t" autocomplete="off" spellcheck="false" placeholder="승객"></label>
  </div>
</div>

<script>
const NS='http://www.w3.org/2000/svg',pic=document.getElementById('pic'),cap=document.getElementById('cap');
const art={};
// 그림 셋 — 서울 자치구 칸, 한반도 픽셀, 강서구 동네버스 노선. 모두 같은 먹 한 색
fetch('../../data/seoul-gu.geom.json').then(r=>r.json()).then(g=>{
  const c=g.cell;let d='';g.grid.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')d+=`M${x*c+3} ${y*c+3}h${c-6}v${c-6}h${-(c-6)}z`}));
  art.seoul={vb:`0 0 ${g.cols*c} ${g.rows_n*c}`,html:`<path d="${d}"/>`,cap:'서울 25개 자치구'};draw('seoul');
});
fetch('../../data/korea-pixels.json').then(r=>r.json()).then(p=>{
  let d='';p.rows.forEach((row,y)=>{let x=0;for(const [,num,k] of row.matchAll(/(\d*)([.xS])/g)){const len=+(num||1);if(k!=='.')d+=`M${x+.1} ${y+.1}h${len-.2}v.8h${-(len-.2)}z`;x+=len}});
  art.korea={vb:`0 0 ${p.w} ${p.h}`,html:`<path d="${d}"/>`,cap:'대한민국 — 46 나라 중 하나'};
});
fetch('../../data/bus.json').then(r=>r.json()).then(b=>{
  const s=b.districts[0];
  art.bus={vb:'0 0 760 600',html:`<polyline class="stroke" points="${s.stops.map(x=>x[1]+','+x[2]).join(' ')}"/>`+s.stops.map(x=>`<circle cx="${x[1]}" cy="${x[2]}" r="12"/>`).join(''),cap:`${s.name} 동네버스 ${s.stops.length} 정류장`};
});
function draw(k){const a=art[k];if(!a)return;pic.setAttribute('viewBox',a.vb);pic.innerHTML=a.html;cap.textContent=a.cap}
document.querySelectorAll('#stack a').forEach(a=>{['mouseenter','focus'].forEach(ev=>a.addEventListener(ev,()=>draw(a.dataset.pic)))});

// 줄 이름을 치면 그 줄에 불이 들어오고, Enter 로 간다
const links=[...document.querySelectorAll('#stack a')],t=document.getElementById('t');
const key=a=>a.firstChild.textContent.replace(/\s/g,'');
const hits=()=>{const v=t.value.replace(/\s/g,'');return v?links.filter(a=>key(a).startsWith(v)):[]};
const check=ev=>{if(ev&&ev.isComposing)return;const h=hits();links.forEach(a=>a.classList.toggle("hit",h.includes(a)));if(h.length===1)draw(h[0].dataset.pic)};
t.addEventListener('input',check);t.addEventListener('compositionend',()=>setTimeout(check));
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){const h=hits();if(h.length===1)location.href=h[0].href}});
</script>
</body>
</html>
