<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 남이 쓴 글을 그리는 유일한 페이지라 CSP 를 페이지 안에 둔다. GitHub Pages 는 _headers 를
     읽지 않아 거기 적은 줄은 서지 않는다(2026-09-27 curl -I 로 확인 — CSP 헤더 없음).
     meta 로는 frame-ancestors 가 안 먹으니 그 줄은 뺀다. localhost 는 wrangler dev 로 relay 를
     띄워 볼 때만 쓰인다(community.js 가 localhost 에서 연 페이지에서만 그리로 보낸다) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://regiontype.gearservicevanguard.com http://localhost:* http://127.0.0.1:*; form-action 'none'; base-uri 'none'">
<title>커뮤니티 — regiontype</title>
<meta name="description" content="regiontype 을 치는 사람들이 기록을 자랑하고, 묻고, 코스를 제안하는 곳.">
<link rel="canonical" href="https://regiontype.com/community/">
<link rel="icon" type="image/png" sizes="any" media="(prefers-color-scheme: dark)" href="../favicon/white.png?v=3.48">
<link rel="icon" type="image/png" sizes="any" media="(prefers-color-scheme: light)" href="../favicon/dark.png?v=3.48">
<link rel="icon" type="image/png" sizes="any" href="../favicon/dark.png?v=3.48">
<link rel="stylesheet" href="../style.css?v=5.03">
<link rel="stylesheet" href="community.css?v=5.03">
<!-- 읽는 글이 아니라 쓰는 곳이라 about/ 과 달리 제 스크립트를 둔다. 서버는 relay/ 의
     /cm/* 다. 글은 평문이고 화면은 textContent 로만 그린다 — innerHTML 을 쓰지 않는다 -->
<script src="../relay.js?v=3.80"></script>
<script src="community.js?v=4.74"></script>
</head>
<body>

<svg class="grid-bg" aria-hidden="true">
  <defs>
    <pattern id="bitgrid" patternUnits="userSpaceOnUse" width="152" height="152">
      <path d="M152 0 V152 H0"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bitgrid)"/>
</svg>


<header class="cm-top">
  <a class="logo" href="/">region<span>type</span><i class="dot" aria-hidden="true"></i></a>
  <a class="cm-me" id="me" href="/#signin" data-i18n="signinBtn">로그인</a>
</header>

<main class="cm" id="main">
  <!-- 목록 -->
  <section id="listView" aria-labelledby="cmTitle">
    <h1 id="cmTitle" data-i18n="community">커뮤니티</h1>
    <p class="cm-lead" data-i18n="cmLead">기록을 자랑하고, 막힌 지명을 묻고, 다음 코스를 제안하는 곳.</p>

    <div class="cm-bar">
      <div class="cm-tags" role="group" aria-label="주제로 거르기" data-i18n-aria="cmFilter" id="tags">
        <button type="button" data-tag="" aria-pressed="true" data-i18n="cmAll">전체</button>
        <button type="button" data-tag="brag" aria-pressed="false"><b aria-hidden="true">★</b><bdi data-i18n="cmBrag">자랑</bdi></button>
        <button type="button" data-tag="ask" aria-pressed="false"><b aria-hidden="true">?</b><bdi data-i18n="cmAsk">질문</bdi></button>
        <button type="button" data-tag="idea" aria-pressed="false"><b aria-hidden="true">+</b><bdi data-i18n="kindIdea">제안</bdi></button>
        <button type="button" data-tag="chat" aria-pressed="false"><b aria-hidden="true">~</b><bdi data-i18n="cmChat">잡담</bdi></button>
      </div>
      <button type="button" class="profile-button cm-write" id="write" data-i18n="cmWrite">글 쓰기</button>
    </div>

    <ol class="cm-list" id="list" aria-live="polite"></ol>
    <p class="cm-say" id="listSay" role="status"></p>
    <button type="button" class="profile-button cm-more" id="more" hidden data-i18n="cmMore">더 보기</button>
  </section>

  <!-- 글 하나. 주소는 #p12 -->
  <article id="postView" hidden>
    <a class="cm-back" href="#"><span aria-hidden="true">← </span><span data-i18n="cmList">목록</span></a>
    <p class="cm-tag" id="pTag"></p>
    <h1 id="pTitle" tabindex="-1"></h1>
    <p class="cm-meta" id="pMeta"></p>
    <div class="cm-body" id="pBody"></div>
    <div class="cm-acts">
      <button type="button" class="profile-button cm-up" id="pUp" aria-pressed="false">♥ <span data-i18n="cmLike">공감</span> <span id="pUps">0</span></button>
      <button type="button" class="profile-button" id="pFlag" data-i18n="cmFlag">신고</button>
      <button type="button" class="profile-button destructive" id="pDel" hidden data-i18n="cmDelete">지우기</button>
    </div>

    <section class="cm-replies" aria-labelledby="rTitle">
      <h2 id="rTitle"><span data-i18n="cmComments">댓글</span> <span id="rCount">0</span></h2>
      <ol id="replies"></ol>
      <form id="replyForm" class="cm-form">
        <label class="cm-label" for="replyBody" data-i18n="cmReply">댓글 달기</label>
        <textarea id="replyBody" rows="3" maxlength="500" required></textarea>
        <div class="cm-send">
          <span class="cm-count" id="replyCount">0 / 500</span>
          <button type="submit" class="profile-button cm-go" data-i18n="cmReply">댓글 달기</button>
        </div>
      </form>
    </section>
    <p class="cm-say" id="postSay" role="status"></p>
  </article>
</main>

<!-- 글 쓰기. <dialog> 가 초점 가두기와 Esc 닫기를 맡는다 -->
<dialog id="composer" aria-labelledby="cTitle">
  <form id="postForm" class="cm-form" method="dialog">
    <h2 id="cTitle" data-i18n="cmWrite">글 쓰기</h2>
    <fieldset class="cm-pick">
      <legend class="cm-label" data-i18n="cmTopic">주제</legend>
      <label data-tag="brag"><input type="radio" name="tag" value="brag" required><span><b aria-hidden="true">★</b><bdi data-i18n="cmBrag">자랑</bdi></span></label>
      <label data-tag="ask"><input type="radio" name="tag" value="ask"><span><b aria-hidden="true">?</b><bdi data-i18n="cmAsk">질문</bdi></span></label>
      <label data-tag="idea"><input type="radio" name="tag" value="idea"><span><b aria-hidden="true">+</b><bdi data-i18n="kindIdea">제안</bdi></span></label>
      <label data-tag="chat"><input type="radio" name="tag" value="chat"><span><b aria-hidden="true">~</b><bdi data-i18n="cmChat">잡담</bdi></span></label>
    </fieldset>
    <label class="cm-label" for="postTitle" data-i18n="cmPostTitle">제목</label>
    <input id="postTitle" maxlength="60" required autocomplete="off">
    <label class="cm-label" for="postBody" data-i18n="fbBody">내용</label>
    <textarea id="postBody" rows="8" maxlength="2000" required></textarea>
    <p class="cm-note" data-i18n="cmNote">글은 누구나 읽습니다. 연락처·실명은 적지 마세요. 서로 다른 세 사람이 신고하면 가려집니다.</p>
    <p class="cm-say" id="composeSay" role="status"></p>
    <div class="cm-send">
      <span class="cm-count" id="postCount">0 / 2000</span>
      <button type="button" class="profile-button" id="cancel" data-i18n="close">닫기</button>
      <button type="submit" class="profile-button cm-go" value="send" data-i18n="cmPost">올리기</button>
    </div>
  </form>
</dialog>

<!-- 폰에서만: 홈과 같은 아래 탭 막대(style.css 의 .tab-dock). 홈은 app.js 가 요소를 옮겨 짓지만
     여기는 제 페이지라 링크를 그냥 적는다. 덮개들은 홈 주소 해시로 열린다 -->
<div class="tab-dock" id="tabDock">
  <nav class="tab-bar" id="tabBar" aria-label="놀이 메뉴" data-i18n-aria="navDock">
    <span class="tab-ind" aria-hidden="true"></span>
    <a class="nav-item" id="tabHome" href="/" data-i18n="tabMap">지도</a>
    <a class="nav-item" href="/#ranking" data-i18n="ranking">순위</a>
    <a class="nav-item" href="/community/" aria-current="page" data-i18n="community">커뮤니티</a>
    <a class="nav-item" href="/#settings" data-i18n="options">설정</a>
  </nav>
  <a class="nav-item" id="signinLink" href="/#signin" data-i18n="signinBtn">로그인</a>
</div>

</body>
</html>
