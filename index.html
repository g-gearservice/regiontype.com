<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>regiontype — 지역을 타이핑으로 알리자</title>
<meta name="description" content="지역을 타이핑으로 알리는 타자연습. 서울 25개 자치구부터.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grid-bg"></div>
<svg class="road" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <path d="M-60 686 H 232 Q 312 686 312 606 V -60"/>
</svg>

<!-- 타이틀 -->
<section id="title" class="screen on">
  <h1 class="logo">region<span>type</span><i class="dot"></i></h1>
  <p class="tagline">지역을 타이핑으로 알리자</p>
  <nav class="menu">
    <button data-go="courses">시작하기</button>
    <button data-go="options">설정</button>
  </nav>
  <svg id="pixelmap" aria-hidden="true"></svg>
</section>

<!-- 코스 목록 -->
<section id="courses" class="screen">
  <button class="back" data-go="title" aria-label="뒤로">←</button>
  <h2 class="head">코스</h2>
  <ul class="course-list" id="courseList"></ul>
</section>

<!-- 설정 -->
<section id="options" class="screen">
  <button class="back" data-go="title" aria-label="뒤로">←</button>
  <h2 class="head">설정</h2>
  <dl class="opts">
    <dt>제한 시간</dt>
    <dd><button class="step" data-opt="time" data-dir="-1" aria-label="제한 시간 줄이기">◀</button><span id="optTime" aria-live="polite"></span><button class="step" data-opt="time" data-dir="1" aria-label="제한 시간 늘리기">▶</button></dd>
    <dt>정식 명칭 강제</dt>
    <dd><button class="toggle" data-opt="strict" aria-label="정식 명칭 강제"></button></dd>
    <dt>야간 모드</dt>
    <dd><button class="toggle" data-opt="night" aria-label="야간 모드"></button></dd>
    <dt>효과음</dt>
    <dd><button class="toggle" data-opt="sound" aria-label="효과음"></button></dd>
    <dt>애니메이션</dt>
    <dd><button class="toggle" data-opt="motion" aria-label="애니메이션"></button></dd>
  </dl>
  <p class="ver">regiontype v0.1.1 · 서울 자치구 경계 2013 기준</p>
</section>

<!-- 플레이 -->
<section id="play" class="screen">
  <button class="back" data-go="courses" aria-label="그만두기">←</button>
  <div class="hud">
    <div class="gauge"><i id="gaugeFill"></i></div>
    <div class="stat time" id="statTime"><b>0:00</b></div>
    <div class="stat"><b id="statCount">0</b><span id="statTotal">/25</span></div>
    <div class="stat combo" id="statCombo"></div>
  </div>
  <div class="stage">
    <svg id="map" role="img" aria-label="서울 자치구 지도"></svg>
    <div class="fact" id="fact" aria-live="polite"></div>
  </div>
  <div class="typebar">
    <input id="typein" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="지역 이름 입력" placeholder="지역 이름">
  </div>
  <div class="countdown" id="countdown" aria-live="assertive"></div>
</section>

<!-- 결과 -->
<section id="result" class="screen">
  <h2 class="head">결과</h2>
  <div class="result-wrap">
    <canvas id="card" width="1600" height="900"></canvas>
    <div class="scores">
      <p><b id="rScore">0</b><span>점</span></p>
      <p><b id="rCount">0</b><span>곳 점령</span></p>
      <p><b id="rAcc">0%</b><span>정확도</span></p>
      <p class="best" id="rBest"></p>
      <div class="menu">
        <button id="again">다시 하기</button>
        <button id="save">이미지 저장</button>
        <button data-go="courses">코스 목록</button>
      </div>
    </div>
  </div>
  <h3 class="missed-head">놓친 곳 <span id="missCount"></span></h3>
  <ul class="missed" id="missed"></ul>
</section>

<!-- 코스 시작 옵션 -->
<div id="ov" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ovTitle">
    <h2 id="ovTitle"></h2>
    <p class="ov-sub" id="ovSub"></p>
    <div class="choice" role="group" aria-labelledby="ovZoomL">
      <span class="choice-l" id="ovZoomL">배율</span>
      <div class="choice-b" id="ovZoom">
        <button data-v="1" aria-pressed="true">1배율</button>
        <button data-v="3" aria-pressed="false">3배율</button>
      </div>
    </div>
    <p class="ov-note" id="ovNote"></p>
    <div class="menu">
      <button id="ovStart">시작</button>
      <button id="ovCancel">취소</button>
    </div>
  </div>
</div>

<div id="mobile">
  <h1 class="logo">region<span>type</span><i class="dot"></i></h1>
  <p>타이핑 게임이라 물리 키보드가 필요합니다.<br>PC에서 열어주세요.</p>
</div>

<script src="app.js"></script>
</body>
</html>
