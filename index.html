<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>regiontype · 서울 25개 자치구 타자로 외우기</title>
<meta name="description" content="지역을 타이핑으로 알리는 타자연습. 서울 25개 자치구부터.">
<link rel="canonical" href="https://regiontype.com/">

<!-- 링크 미리보기(카톡·DM·트위터). og:image 는 절대 URL 이어야 하고 미리보기
     캐시가 오래 남아, 해시 없는 고정 경로 /og.png 로만 서빙한다. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://regiontype.com/">
<meta property="og:title" content="regiontype — 서울, 얼마나 아세요?">
<meta property="og:description" content="25개 자치구부터 423개 행정동까지. 타이핑으로 서울을 완성하세요.">
<meta property="og:image" content="https://regiontype.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="regiontype">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="regiontype — 서울, 얼마나 아세요?">
<meta name="twitter:description" content="25개 자치구부터 423개 행정동까지.">
<meta name="twitter:image" content="https://regiontype.com/og.png">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "regiontype",
  "url": "https://regiontype.com/",
  "applicationCategory": "EducationalApplication",
  "inLanguage": "ko",
  "operatingSystem": "Web",
  "description": "지역을 타이핑으로 알리는 타자연습. 서울 25개 자치구와 423개 행정동을 타이핑으로 익히는 웹앱. 나라별 행정구역 코스.",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
}
</script>
<!-- 파비콘은 기기 테마(prefers-color-scheme)만 따른다. 사이트의 야간 모드는
     data-night 로 도는 별개의 것이라, 설정을 만져도 아이콘은 바뀌지 않는다.
     media 를 못 읽는 브라우저를 위해 마지막에 기본값 하나를 남긴다.
     sizes 는 Safari 가 media 다른 두 아이콘 중 하나를 고르지 못하고
     기본 글자 아이콘으로 넘어가는 것을 막는다. Safari 는 파비콘을 사이트
     데이터 캐시와 별도로 URL 별로 오래 쥐고 있어서, 파일을 바꿔도 주소가
     같으면 안 갈아탄다 — 쿼리스트링으로 매번 새 주소를 만든다. -->
<link rel="icon" type="image/png" sizes="any" media="(prefers-color-scheme: dark)" href="favicon/white.png?v=1.54">
<link rel="icon" type="image/png" sizes="any" media="(prefers-color-scheme: light)" href="favicon/dark.png?v=1.54">
<link rel="icon" type="image/png" sizes="any" href="favicon/dark.png?v=1.54">
<!-- 아이콘은 assets/*.svg 마스크로 그린다 (style.css 의 .i-*) -->
<link rel="stylesheet" href="style.css?v=1.75">
</head>
<body>

<svg class="grid-bg" aria-hidden="true">
  <defs>
    <pattern id="bitgrid" patternUnits="userSpaceOnUse" width="152" height="152">
      <path d="M152 0 V152 H0"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bitgrid)"/>
</svg>

<!-- 지역 목록 -->
<section id="regions" class="screen on">
  <!-- 상단 넵바. 흐림 띠는 플레이 화면 것과 같은 부품(.backdrop-blur)이다 —
       여섯 겹이 층층이 겹쳐 위에서 아래로 흐림이 사라진다. 그 위에 줄이 앉는다 -->
  <span class="backdrop-blur" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </span>
  <nav class="navbar" data-i18n-aria="navMain" aria-label="주 메뉴">
    <span class="nav-shape" id="navShape" aria-hidden="true"></span>
    <span class="nav-side nav-start">
      <a class="nav-item" id="aboutLink" href="about/" data-i18n="about">소개</a>
      <a class="nav-item" href="https://github.com/g-gearservice/regiontype.com" target="_blank" rel="noopener noreferrer">GitHub<span id="ghStars" hidden></span></a>
      <a class="nav-item" href="policy/" data-i18n="policyLink">개인정보</a>
    </span>
    <a class="nav-logo logo" href="/" aria-label="regiontype">region<span>type</span><i class="dot" aria-hidden="true"></i></a>
    <span class="nav-side nav-end">
      <a class="nav-item" href="https://github.com/g-gearservice/regiontype.com/discussions" target="_blank" rel="noopener noreferrer" data-i18n="community">커뮤니티</a>
      <!-- 피드백은 넵바에 남겨야 한다 — 방침·약관이 이 문을 유일한 연락 통로로 적고 있다 -->
      <button type="button" class="nav-item" id="fbOpen"><i class="i i-flag" aria-hidden="true"></i><span data-i18n="feedback">피드백</span></button>
      <a class="nav-item title-alt" href="mimi/">Mimi</a>
    </span>
  </nav>
  <!-- 아래 막대 뒤의 흐림 띠. 플레이 화면 타이핑 줄과 같은 .backdrop-blur.bot 이다 -->
  <span class="backdrop-blur bot" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </span>
  <!-- 설정·시작·계정은 아래 막대 -->
  <nav class="nav-bot" data-i18n-aria="navDock" aria-label="놀이 메뉴">
    <span class="nav-shape" id="navBotShape" aria-hidden="true"></span>
    <a class="nav-item" href="settings/" data-i18n="options">설정</a>
    <button type="button" class="nav-item is-play" id="navPlay" data-i18n="start">시작하기</button>
    <!-- 로그인은 제 페이지다(/signin/). 로그인해 있으면 라벨만 '내 계정' 으로 바뀐다 -->
    <a class="nav-item" id="signinLink" href="signin/" data-i18n="signinBtn">로그인</a>
  </nav>
  <div class="screen-head">
    <h2 class="head"><button type="button" id="coursePick" aria-pressed="true" aria-label="서울" hidden></button></h2>
  </div>
  <!-- 코스마다 격자 한 칸 버튼. 칸은 app.js 의 renderCourses 가 채운다 -->
  <div id="courseBtns" role="group" data-i18n-aria="pickCourse" aria-label="코스 고르기"></div>
  <p class="course-name" id="courseName" aria-live="polite"></p>
</section>

<!-- 플레이 -->
<section id="play" class="screen">
  <div class="hud">
    <button class="back" data-go="regions" data-i18n-aria="quit" aria-label="그만두기"><i class="i i-arrow-left" aria-hidden="true"></i></button>
    <div class="gauge"><i id="gaugeFill"></i></div>
    <div class="stat time" id="statTime"><b>0:00</b></div>
    <div class="stat"><b id="statCount">0</b><span id="statTotal">/25</span></div>
    <div class="stat"><b id="statScore">0</b><span data-i18n="scoreUnit">점</span></div>
    <div class="stat combo" id="statCombo"></div>
  </div>
  <div class="stage">
    <svg id="map" class="rt-map" role="img" data-i18n-aria="mapLabel" aria-label="지역 지도"></svg>
  </div>
  <span class="backdrop-blur" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </span>
  <span class="backdrop-blur bot" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </span>
  <div class="typing" id="typing" aria-hidden="true">
    <div class="q-side is-prev" id="qPrev"></div>
    <div class="q-letters" id="qLetters"></div>
    <div class="q-side is-next" id="qNext"></div>
  </div>
  <div class="fact" id="fact" aria-live="polite"></div>
  <div class="typebar">
    <input id="typein" autocomplete="off" autocapitalize="off" spellcheck="false" data-i18n-aria="typeName" aria-label="지역 이름 입력">
  </div>
  <div class="countdown" id="countdown" aria-live="assertive"></div>
</section>

<!-- 결과 -->
<section id="result" class="screen">
  <div class="screen-head">
    <button class="back" data-go="regions" data-i18n-aria="back" aria-label="뒤로"><i class="i i-arrow-left" aria-hidden="true"></i></button>
  </div>
  <div class="result-wrap">
    <canvas id="card" width="1600" height="900"></canvas>
    <div class="scores">
      <p><b id="rScore">0</b><span data-i18n="scoreUnit">점</span></p>
      <p><b id="rCount">0</b><span data-i18n="visited">들른 곳</span></p>
      <p><b id="rAcc">0%</b><span data-i18n="accuracy">정확도</span></p>
      <p class="best" id="rBest"></p>
      <div class="menu">
        <button id="again" data-i18n="again">다시 하기</button>
        <button id="save" data-i18n="save">이미지 저장</button>
      </div>
    </div>
  </div>
  <div id="board" hidden>
    <h3 class="res-head"><span data-i18n="board">순위표</span> <span id="boardWhere"></span></h3>
    <p class="board-say" id="boardSay" aria-live="polite"></p>
    <ol class="ranks" id="ranks"></ol>
    <div class="board-in" id="boardIn" hidden>
      <p data-i18n="needLoginHome">홈에서 로그인하면 순위표에 올라갑니다</p>
    </div>
    <form class="board-join" id="boardJoin" hidden>
      <label for="boardName" data-i18n="nameLabel">누구나 보는 순위표에 이 이름이 올라갑니다</label>
      <div>
        <input id="boardName" name="name" maxlength="12" autocomplete="off" spellcheck="false" data-i18n-ph="namePh" placeholder="이름">
        <button type="submit" data-i18n="submitScore">기록 남기기</button>
      </div>
    </form>
    <button type="button" class="board-drop" id="boardDrop" data-i18n="forgetMine" hidden>순위표에서 내 기록 내리기</button>
  </div>
</section>

<div id="mobile">
  <div class="logo">region<span>type</span><i class="dot"></i></div>
  <p><span data-i18n="mobileNeed">물리 키보드가 필요합니다.</span><br><span data-i18n="mobilePc">PC에서 열어주세요.</span></p>
</div>


<!-- 피드백 — 로고 점에서 열린다 -->
<dialog id="feedback" aria-labelledby="fbHead">
  <form id="fbForm">
    <div class="fb-head">
      <h2 id="fbHead" data-i18n="feedback">피드백</h2>
      <button type="button" class="back" id="fbClose" data-i18n-aria="close" aria-label="닫기"><i class="i i-close" aria-hidden="true"></i></button>
    </div>
    <p class="fb-lead" data-i18n="fbLead">뭐가 이상했는지, 뭐가 있었으면 좋겠는지 적어주세요.</p>
    <div class="choice-b fb-kind" role="group" data-i18n-aria="fbKind" aria-label="피드백 종류">
      <button type="button" data-v="bug" aria-pressed="true" data-i18n="kindBug">버그</button>
      <button type="button" data-v="idea" aria-pressed="false" data-i18n="kindIdea">제안</button>
      <button type="button" data-v="data" aria-pressed="false" data-i18n="kindData">지명·정보 오류</button>
    </div>
    <textarea id="fbBody" required autofocus maxlength="500" data-i18n-aria="fbBody" aria-label="내용"
      placeholder="버그내용"></textarea>
    <div class="fb-foot">
      <p class="fb-note" id="fbNote" aria-live="polite"></p>
      <button type="submit" class="fb-send" id="fbSend" data-i18n="fbSend">보내기</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=1.75"></script>
</body>
</html>
