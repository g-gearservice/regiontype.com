<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regiontype</title>
<meta name="description" content="지역을 타이핑으로 알리는 타자연습. 서울 25개 자치구부터.">
<!-- 파비콘은 기기 테마(prefers-color-scheme)만 따른다. 사이트의 야간 모드는
     data-night 로 도는 별개의 것이라, 설정을 만져도 아이콘은 바뀌지 않는다.
     media 를 못 읽는 브라우저를 위해 마지막에 기본값 하나를 남긴다.
     sizes 는 Safari 가 media 다른 두 아이콘 중 하나를 고르지 못하고
     기본 글자 아이콘으로 넘어가는 것을 막는다. Safari 는 파비콘을 사이트
     데이터 캐시와 별도로 URL 별로 오래 쥐고 있어서, 파일을 바꿔도 주소가
     같으면 안 갈아탄다 — 쿼리스트링으로 매번 새 주소를 만든다. -->
<link rel="icon" type="image/png" sizes="any" media="(prefers-color-scheme: dark)" href="favicon/white.png?v=0.69">
<link rel="icon" type="image/png" sizes="any" media="(prefers-color-scheme: light)" href="favicon/dark.png?v=0.69">
<link rel="icon" type="image/png" sizes="any" href="favicon/dark.png?v=0.69">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 아이콘: Material Symbols Rounded · FILL 0 · wght 300 · GRAD 200 · opsz 24 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300..700,0,200">
<link rel="stylesheet" href="style.css?v=0.69">
</head>
<body>

<svg class="grid-bg" aria-hidden="true">
  <defs>
    <pattern id="bitgrid" patternUnits="userSpaceOnUse" width="152" height="152">
      <path d="M152 0 V152 H0"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bitgrid)"/>
</svg>

<!-- 픽셀맵은 화면 밖에 둔다. 타이틀과 설정이 같은 것을 공유해야 좌표가
     어긋나지 않는다 — 복제하면 두 벌을 따로 맞춰야 한다. -->
<svg id="pixelmap" aria-hidden="true"></svg>

<!-- 타이틀 -->
<section id="title" class="screen on">
  <h1 class="logo">region<span>type</span><button type="button" class="dot" id="fbOpen" aria-label="피드백 보내기"><i class="ms">flag</i></button></h1>
  <nav class="menu">
    <button data-go="regions">시작하기</button>
    <button data-go="options">설정</button>
    <a class="alt" href="mimi/">Mimi 스타일 보기</a>
  </nav>
</section>

<!-- 지역 목록 -->
<section id="regions" class="screen">
  <div class="screen-head">
    <button class="back" data-go="title" aria-label="뒤로"><i class="ms">arrow_back</i></button>
    <h2 class="head">지역</h2>
  </div>
  <div class="course-stage">
    <ul class="course-list" id="regionList"></ul>
  </div>
</section>

<!-- 설정 -->
<section id="options" class="screen">
  <div class="screen-head">
    <button class="back" data-go="title" aria-label="뒤로"><i class="ms">arrow_back</i></button>
    <h2 class="head">설정</h2>
  </div>
  <dl class="opts">
    <dt>야간 모드</dt>
    <dd><button class="toggle" data-opt="night" aria-label="야간 모드"></button></dd>
    <dt>효과음</dt>
    <dd><button class="toggle" data-opt="sound" aria-label="효과음"></button></dd>
    <dt>애니메이션</dt>
    <dd><button class="toggle" data-opt="motion" aria-label="애니메이션"></button></dd>
    <dt>그리드</dt>
    <dd><button class="toggle" data-opt="grid" aria-label="그리드"></button></dd>
  </dl>
  <p class="ver">regiontype v0.3.6 (<span id="verBuild"></span>) · 서울 자치구 경계 2013 기준</p>
</section>

<!-- 플레이 -->
<section id="play" class="screen">
  <div class="hud">
    <button class="back" data-go="regions" aria-label="그만두기"><i class="ms">arrow_back</i></button>
    <div class="gauge"><i id="gaugeFill"></i></div>
    <div class="stat time" id="statTime"><b>0:00</b></div>
    <div class="stat"><b id="statCount">0</b><span id="statTotal">/25</span></div>
    <div class="stat"><b id="statScore">0</b><span>점</span></div>
    <div class="stat combo" id="statCombo"></div>
  </div>
  <div class="stage">
    <svg id="map" class="rt-map" role="img" aria-label="서울 자치구 지도"></svg>
  </div>
  <span class="backdrop-blur" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </span>
  <span class="backdrop-blur bot" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </span>
  <div class="typing" id="typing" aria-hidden="true">
    <div class="q-side is-prev" id="qPrev"></div>
    <div class="q-letters" id="qLetters"></div>
    <div class="q-side is-next" id="qNext"></div>
  </div>
  <div class="fact" id="fact" aria-live="polite"></div>
  <div class="typebar">
    <input id="typein" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="지역 이름 입력">
  </div>
  <div class="countdown" id="countdown" aria-live="assertive"></div>
</section>

<!-- 결과 -->
<section id="result" class="screen">
  <div class="screen-head">
    <button class="back" data-go="regions" aria-label="뒤로"><i class="ms">arrow_back</i></button>
  </div>
  <div class="result-wrap">
    <canvas id="card" width="1600" height="900"></canvas>
    <div class="scores">
      <p><b id="rScore">0</b><span>점</span></p>
      <p><b id="rCount">0</b><span>들른 곳</span></p>
      <p><b id="rAcc">0%</b><span>정확도</span></p>
      <p class="best" id="rBest"></p>
      <div class="menu">
        <button id="again">다시 하기</button>
        <button id="save">이미지 저장</button>
      </div>
    </div>
  </div>
  <h3 class="missed-head">놓친 곳 <span id="missCount"></span></h3>
  <ul class="missed" id="missed"></ul>
</section>

<!-- 지역 카드 뒷면: 코스 고르기 → 시작 옵션 -->
<template id="regionTpl">
  <div class="card-back">
    <div class="ov-pick">
      <div class="pickmap"></div>
      <p class="pickname"></p>
      <button type="button" class="course wide" data-slug="seoul-gu"></button>
    </div>
    <div class="ov-play" hidden></div>
  </div>
</template>

<template id="ovTpl">
  <div class="ov-game">
    <div class="hud ov-hud">
      <div class="gauge"><i></i></div>
      <div class="stat time">
        <button type="button" class="ov-time" aria-haspopup="listbox" aria-expanded="false" aria-label="제한 시간">0:00</button>
      </div>
      <div class="stat"><b>0</b><span class="ov-total">/0</span></div>
    </div>
    <div class="ov-body">
      <div class="ov-stage">
        <svg class="ov-map rt-map" aria-hidden="true"></svg>
      </div>
    </div>
    <div class="ov-dock">
      <div class="choice" role="group">
        <span class="choice-l">이름</span>
        <div class="choice-b ov-hint">
          <button type="button" data-v="1" aria-pressed="true">보임</button>
          <button type="button" data-v="0" aria-pressed="false">숨김</button>
        </div>
      </div>
      <b class="ov-title"></b>
      <div class="menu">
        <button type="button" class="ov-start">시작</button>
      </div>
    </div>
  </div>
</template>

<div id="mobile">
  <h1 class="logo">region<span>type</span><i class="dot"></i></h1>
  <p>타이핑 게임이라 물리 키보드가 필요합니다.<br>PC에서 열어주세요.</p>
</div>


<!-- 피드백 — 로고 점에서 열린다 -->
<dialog id="feedback" aria-labelledby="fbHead">
  <form id="fbForm">
    <div class="fb-head">
      <h2 id="fbHead">피드백</h2>
      <button type="button" class="back" id="fbClose" aria-label="닫기"><i class="ms">close</i></button>
    </div>
    <p class="fb-lead">뭐가 이상했는지, 뭐가 있었으면 좋겠는지 적어주세요.</p>
    <div class="choice-b fb-kind" role="group" aria-label="피드백 종류">
      <button type="button" data-v="bug" aria-pressed="true">버그</button>
      <button type="button" data-v="idea" aria-pressed="false">제안</button>
      <button type="button" data-v="data" aria-pressed="false">지명·정보 오류</button>
    </div>
    <textarea id="fbBody" required autofocus maxlength="500" aria-label="내용"
      placeholder="버그내용"></textarea>
    <div class="fb-foot">
      <p class="fb-note" id="fbNote" aria-live="polite"></p>
      <button type="submit" class="fb-send" id="fbSend">보내기</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=0.69"></script>
</body>
</html>
