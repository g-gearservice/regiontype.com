<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>데스크톱에서 만나요 — regiontype</title>
<!-- 폰·태블릿(pointer:coarse)이 앱 대신 닿는 자리다(../mobile.js). 검색에는 앱 주소만 남긴다 -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e8edf0">
<link rel="icon" type="image/png" href="../favicon/dark.png?v=6.08">
<link rel="stylesheet" href="../style.css?v=6.08">
<script>try{const o=JSON.parse(localStorage.getItem('rt.opt')||'{}');document.documentElement.toggleAttribute('data-night',!!o.night)}catch{}</script>
<style>
  body{display:grid;place-items:center;padding:24px 16px;box-sizing:border-box;overflow:auto;text-align:center}
  .dk{max-width:420px;display:grid;gap:18px;justify-items:center}
  .dk h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:8px 0 0}
  .dk p{margin:0;color:var(--ink-soft)}
  .dk .en{font-size:14px}
  .dk button{font:inherit;font-weight:700;color:var(--on-accent);background:var(--accent);border:2px solid var(--accent-deep);border-radius:999px;padding:12px 24px;min-height:48px;cursor:pointer}
  .dk button:focus-visible{outline:3px solid var(--target-hi);outline-offset:3px}
  .dk a{color:var(--accent-text)}
  #dkSaid{min-height:1.5em;font-size:14px}
</style>
</head>
<body>
<svg class="grid-bg" aria-hidden="true">
  <defs><pattern id="bitgrid" patternUnits="userSpaceOnUse" width="152" height="152"><path d="M152 0 V152 H0"/></pattern></defs>
  <rect width="100%" height="100%" fill="url(#bitgrid)"/>
</svg>
<main class="dk">
  <p class="logo" aria-label="regiontype">region<span>type</span><i class="dot"></i></p>
  <h1>regiontype 은 데스크톱에서 쳐요</h1>
  <p>지명을 실제 자판으로 치는 타자연습이라, 폰과 태블릿에서는 열지 않아요. 컴퓨터에서 <b>regiontype.com</b> 을 열어 주세요.</p>
  <p class="en" lang="en">regiontype is a typing game for a real keyboard, so it doesn't open on phones or tablets. Open <b>regiontype.com</b> on a computer.</p>
  <button type="button" id="dkSend">주소 보내기 · Send the link</button>
  <p id="dkSaid" role="status" aria-live="polite"></p>
  <p><a href="../about/">regiontype 소개 · About</a></p>
</main>
<script>
  /* 컴퓨터로 옮겨 열 수 있게 주소를 나에게 보낸다 — 공유 시트가 없으면 복사한다 */
  const url = 'https://regiontype.com/';
  document.getElementById('dkSend').onclick = async () => {
    const said = document.getElementById('dkSaid');
    try {
      if (navigator.share) await navigator.share({ title: 'regiontype', url });
      else { await navigator.clipboard.writeText(url); said.textContent = '주소를 복사했어요 · Link copied'; }
    } catch (e) { if (e.name !== 'AbortError') said.textContent = url; }
  };
</script>
</body>
</html>
